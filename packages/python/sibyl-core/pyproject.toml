# sibyl-core - Shared library for Sibyl knowledge graph operations
# Domain models, graph client, retrieval, tools, auth primitives

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../../../VERSION"
pattern = "(?P<version>.+)"

[project]
name = "sibyl-core"
dynamic = ["version"]
description = "Core library for Sibyl - domain models, graph operations, and knowledge retrieval"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "Stefanie Jane", email = "stef@hyperbliss.tech" }]
keywords = ["knowledge-graph", "graph-rag", "persistent-memory", "task-workflow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    # Data & Validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Auth primitives (JWT, password hashing)
    "pyjwt>=2.10",
    "cryptography>=50.0.0",
    # HTTP
    "httpx>=0.27",
    # Lexical normalization; must stay the same Snowball English implementation
    # the SurrealDB fulltext analyzers run, or the ranker and the index disagree
    "snowballstemmer>=2.2,<3",
    # Logging
    "structlog>=24.0",
    # Environment
    "packaging>=26.0",
]

[project.optional-dependencies]
# Amazon Bedrock: SigV4 signing and the AWS credential chain (IRSA, SSO,
# instance roles) for Claude through the Anthropic SDK's Bedrock clients and
# for Cohere embeddings on bedrock-runtime.
bedrock = [
    "anthropic[bedrock]>=1.0.0,<2",
    # The Cohere embedding path signs requests with botocore directly.
    "boto3>=1.28.57,<2",
    "botocore>=1.31.57,<2",
]
embeddings = [
    "google-genai>=2.23.0",
]
graph = [
    "surrealdb>=2.0.0,<3.0",
    # Embedding-similarity dedup in the retrieval stack
    "numpy>=2.5.1",
]
graphrag = [
    "networkx>=3.0",
    "python-louvain>=0.16",
]
llm = [
    "anthropic>=1.0.0,<2",
    "pydantic-ai-slim[anthropic,google,openai]>=2.42.0,<3",
]
reranking = [
    "sentence-transformers>=5.6.1",
]

[dependency-groups]
dev = [
    "anthropic[bedrock]>=1.0.0,<2",
    "httpx2>=2.5.0,<3",
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff",
    # Test-only mirrors of the runtime extras the suite exercises directly:
    # the graph backend, the numeric stack, and the pydantic-ai client layer.
    # They stay optional for the published package (graph/llm extras) but the
    # test env must install them or the graph/eval/ai modules fail collection.
    # The heavy reranking extra (sentence-transformers) is left out on purpose
    # so CI stays fast; its tests mock the cross-encoder instead.
    "surrealdb>=2.0.0,<3.0",
    "numpy>=2.5.1",
    "pydantic-ai-slim[anthropic,google,openai]>=2.42.0,<3",
    "ty>=0.0.80",
]

[project.urls]
Homepage = "https://github.com/hyperb1iss/sibyl"
Repository = "https://github.com/hyperb1iss/sibyl"

[tool.hatch.build.targets.wheel]
packages = ["src/sibyl_core"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sibyl_core"]

# =============================================================================
# UV Workspace (inherits from root)
# =============================================================================
# This package is part of the sibyl-workspace
# Dependencies on other workspace members use workspace = true
