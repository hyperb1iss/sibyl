$schema: https://moonrepo.dev/schemas/project.json
language: python
toolchains:
  default: system
env:
  PYTEST_ADDOPTS: "${PYTEST_ADDOPTS} -p sibyl_core.pytest_isolation"
tasks:
  test:
    command: uv run pytest
    env:
      SIBYL_E2E_CLI_COMMAND: uv run --project ../cli sibyl
    inputs:
    - '@group(tests)'
  test-api:
    command: uv run pytest -m 'api or cli'
    env:
      SIBYL_E2E_CLI_COMMAND: uv run --project ../cli sibyl
    inputs:
    - '@group(tests)'
  test-perf:
    command: uv run pytest tests/perf -m perf -v -s
    env:
      SIBYL_E2E_CLI_COMMAND: uv run --project ../cli sibyl
      SIBYL_E2E_PERF: '1'
    inputs:
    - '@group(tests)'
    - /tools/perf/**/*.py
  test-browser:
    command: uv run pytest -m browser
    deps:
    - ~:playwright-install
    env:
      SIBYL_E2E_CLI_COMMAND: uv run --project ../cli sibyl
    inputs:
    - '@group(tests)'
  playwright-install:
    command: uv run playwright install chromium
  sync:
    command: uv sync
    inputs:
    - '@group(configs)'
  lint:
    command: uv run ruff check tests
    inputs:
    - '@group(tests)'
  format:
    command: uv run ruff format tests
    inputs:
    - '@group(tests)'
tags:
- python
- e2e
- testing
fileGroups:
  tests:
  - tests/**/*.py
  configs:
  - pyproject.toml
  - moon.yml
layer: application
