name: Start SurrealDB
description: Start the repo SurrealDB compose service for CI jobs.

inputs:
  dockerhub-username:
    description: "Docker Hub user for authenticated image pulls. Optional."
    required: false
    default: ""
  dockerhub-token:
    description: >-
      Docker Hub token for authenticated image pulls. Optional; without it the
      pull is anonymous and shares the runner IP's unauthenticated rate limit.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Pull Docker Hub images through a mirror
      shell: bash
      run: |
        set -euo pipefail
        # Google's mirror serves the same content-addressed Docker Hub images
        # and keeps compose pulls going when Docker Hub's token service fails
        # GitHub's runners; the daemon falls back to Docker Hub on a miss.
        config=/etc/docker/daemon.json
        current="$(sudo cat "$config" 2>/dev/null || true)"
        [[ -n "$current" ]] || current='{}'
        printf '%s' "$current" |
          jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' |
          sudo tee "$config" >/dev/null
        sudo systemctl restart docker
        docker info --format '{{json .RegistryConfig.Mirrors}}'

    - name: Log in to Docker Hub
      if: ${{ inputs.dockerhub-token != '' }}
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub-username }}
        DOCKERHUB_TOKEN: ${{ inputs.dockerhub-token }}
      run: ${{ github.action_path }}/dockerhub-login.sh

    - name: Start SurrealDB service
      shell: bash
      run: |
        set -euo pipefail

        # Compose mounts SURREAL_DATA_DIR at /data. The default stays on
        # disk because SurrealDB's memory engine is not exclusive under
        # contention: two callers can both win one conditional UPDATE, and
        # even one atomic CREATE, so lease and fence tests flake on it.
        # RocksDB and SurrealKV held those writes exclusive in the same
        # trials, and RocksDB is what the compose service ships with.
        export SURREAL_DATA_DIR="${RUNNER_TEMP}/sibyl-surrealdb"
        export SIBYL_SURREAL_PATH="${SIBYL_SURREAL_PATH:-rocksdb:///data/sibyl.db}"
        mkdir -p "$SURREAL_DATA_DIR"
        chmod 777 "$SURREAL_DATA_DIR"

        echo "SurrealDB data dir: $SURREAL_DATA_DIR"
        echo "SurrealDB path: $SIBYL_SURREAL_PATH"

        docker compose --env-file /dev/null up -d surrealdb

        for i in {1..30}; do
          if docker compose --env-file /dev/null exec -T surrealdb /surreal is-ready --endpoint http://localhost:8000; then
            echo "SurrealDB is ready!"
            exit 0
          fi
          echo "Attempt $i: SurrealDB not ready yet..."
          sleep 1
        done

        docker compose --env-file /dev/null ps || true
        docker compose --env-file /dev/null logs surrealdb || true
        exit 1
