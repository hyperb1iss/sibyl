name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (leave empty for patch bump)"
        required: false
        default: ""
      bump:
        description: "Version bump type (if version not specified)"
        required: false
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (prove every gate; push nothing, tag nothing, publish nothing)"
        required: false
        type: boolean
        default: false
      nightly_run_id:
        description: "Nightly Regression run ID to cite (empty: find or dispatch one)"
        required: false
        default: ""

# Each job asks for what it uses. Only the release job can write contents, and
# it runs only after every gate below has passed.
permissions:
  contents: read

# Real cuts share one group, so two can never tag at the same time. A dry run
# changes no remote release state, so each one gets a group of its own. In the
# shared group a dry run would queue behind a real cut, and as the newest
# pending run it would cancel a real cut that was itself still pending.
concurrency:
  group: ${{ inputs.dry_run && format('release-dry-run-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

jobs:
  # A real cut pushes a version commit and a tag to the ref it runs on, so it
  # runs only on main. A dry run may rehearse any branch.
  preflight:
    name: "△ Preflight"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: "△ Refuse a real cut outside main"
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          echo "::error::A real release cuts from main, and this run was dispatched on $RELEASE_REF."
          echo "::error::Dispatch again with --ref main, or set dry_run=true to rehearse this ref."
          exit 1

      - name: "△ Record the candidate"
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: echo "Candidate $GITHUB_SHA on $GITHUB_REF (dry_run=$DRY_RUN)"

  # =========================================================================
  # Image CVE gate: prove the shipped images are clean before a release exists
  #
  # Publish scans images too, but publish is dispatched by the last step of
  # this workflow, so its verdict lands after the tag and the release object
  # are already public. v1.2.1 is what that ordering costs: the scan failed on
  # two HIGH advisories that a released version could no longer be recalled
  # for. Running the gate here means a dirty image stops the release before
  # anything is named, and the publish-time scan stays where it is as the
  # second line of defence over the artifacts that actually get distributed.
  #
  # The scan reads the dispatched SHA rather than the tagged commit. The only
  # thing between them is the version bump, which the release job proves
  # touches nothing but generated pins, so the image contents are identical.
  # =========================================================================
  image-cve-gate:
    name: "◆ Image CVE gate"
    needs: preflight
    uses: ./.github/workflows/image-cve-gate.yml
    permissions:
      contents: read
    with:
      # Every image and every architecture publish ships. Scanning only amd64
      # would let an arm64-only OS package advisory through, and the base
      # image package sets genuinely differ per architecture. Each builds on
      # its own native runner, so this costs wall time rather than emulation.
      images: '["api", "web"]'
      platforms: '["amd64", "arm64"]'

  # The browser and API end-to-end suites need a production-shaped fixture:
  # SurrealDB, the API, the job worker, the seeded baseline corpus and a built
  # frontend. CI runs this fixture only when a change reaches runtime, CI or
  # release paths, and CI on main is cancelled whenever a newer push lands, so
  # CI on the candidate commit may never have run it. The release runs it on
  # the candidate itself.
  #
  # The steps mirror ci.yml's E2E job, and test_release_workflow pins this copy
  # to that one so the two cannot drift. Two deliberate differences: no moon
  # output cache is restored, and the suites pass --force, so a pass recorded
  # on another commit can never stand in for this one.
  e2e-gate:
    name: "◇ E2E gate"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: sibyl-ci
      SIBYL_ENVIRONMENT: production
      SIBYL_JWT_SECRET: not-a-real-secret-not-a-real-secret
      SIBYL_STORE: surreal
      SIBYL_AUTH_STORE: surreal
      SIBYL_LOCAL_AUTH_ENABLED: "true"
      SIBYL_COORDINATION_BACKEND: local
      SIBYL_SURREAL_URL: ws://localhost:8000/rpc
      SIBYL_SURREAL_USERNAME: sibyl_ci
      SIBYL_SURREAL_PASSWORD: sibyl_ci_password
      SIBYL_OPENAI_API_KEY: sk-test-key
      SIBYL_ANTHROPIC_API_KEY: sk-ant-test-key
      SIBYL_MOCK_LLM: true
      # The API writes transactional mail here and the auth replay reads the
      # password-reset link back out of it.
      SIBYL_EMAIL_OUTBOX_PATH: /tmp/sibyl-e2e-email-outbox.jsonl
    steps:
      - name: "◆ Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Start SurrealDB
        uses: ./.github/actions/start-surrealdb

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Setup moonrepo toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: "0.61.1"
          auto-install: true
          auto-setup: true
          cache-version: release-rc-v1

      - name: Verify toolchain
        run: |
          chmod +x "$HOME/.proto/shims"/* 2>/dev/null || true
          chmod +x "$HOME/.proto/bin"/* 2>/dev/null || true
          moon --version
          proto --version
          uv --version

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-release-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-release-${{ runner.os }}-

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-release-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-release-${{ runner.os }}-

      - name: Install Node dependencies
        run: cd apps/web && pnpm install --frozen-lockfile

      - name: Build frontend for E2E
        run: |
          moon run web:build
          test -f apps/web/.next/BUILD_ID

      - name: Start backend server
        run: |
          cd apps/api
          uv run sibyld serve > /tmp/sibyld.log 2>&1 &
          echo "Waiting for backend to start..."
          for i in {1..60}; do
            if curl -fsS http://localhost:3334/api/health > /dev/null; then
              echo "Backend is ready!"
              sleep 2
              break
            fi
            echo "Attempt $i: Backend not ready yet..."
            sleep 1
          done
          curl -fsS http://localhost:3334/api/health | head -c 200

      - name: Start background job worker
        run: |
          cd apps/api
          uv run sibyld worker > /tmp/sibyl-worker.log 2>&1 &
          echo "Background job worker started"
          sleep 2

      - name: Seed deterministic baseline fixture
        run: moon run baseline-seed

      - name: Replay committed baseline corpus
        run: moon run baseline-replay-runtime

      - name: Start frontend server
        run: |
          cd apps/web
          pnpm start > /tmp/sibyl-web.log 2>&1 &
          web_pid=$!
          echo "Waiting for frontend to start..."
          for i in {1..60}; do
            if curl -fsS http://localhost:3337 > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            if ! kill -0 "$web_pid" 2>/dev/null; then
              echo "Frontend exited before becoming ready."
              cat /tmp/sibyl-web.log
              exit 1
            fi
            echo "Attempt $i: Frontend not ready yet..."
            sleep 1
          done
          curl -fsS http://localhost:3337 > /dev/null

      - name: Run e2e tests
        env:
          SIBYL_E2E_CLI_COMMAND: uv run --project ../cli sibyl
          SIBYL_E2E_EMAIL: baseline-corpus@sibyl.dev
          SIBYL_E2E_PASSWORD: baseline-corpus-password-secure-123!
        run: |
          moon run e2e:test --force -- --ignore=tests/browser
          moon run e2e:test-browser --force

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== Backend server logs ==="
          tail -n 200 /tmp/sibyld.log || true
          echo ""
          echo "=== Worker logs ==="
          tail -n 200 /tmp/sibyl-worker.log || true
          echo ""
          echo "=== Frontend logs ==="
          tail -n 200 /tmp/sibyl-web.log || true
          echo ""
          echo "=== SurrealDB logs ==="
          docker compose --env-file /dev/null logs surrealdb || true

  # Nightly Regression owns the live-graph, baseline-parity and restore gates.
  # This job finds a run on the candidate commit whose every job passed, and
  # dispatches one and waits for it when none exists. The daily schedule skips
  # Restore To Scratch, so only a dispatched run or the Monday schedule counts;
  # tools/release/nightly_evidence.py holds that rule and its tests. An
  # explicit nightly_run_id is validated instead of searched for.
  #
  # The job timeout outlasts the script's own 50 minute deadline so a slow
  # nightly fails with a message that names the run rather than a bare
  # cancellation. Nightly's longest job has a 45 minute timeout.
  nightly-evidence:
    name: "◇ Nightly Regression evidence"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    outputs:
      run_id: ${{ steps.nightly.outputs.run_id }}
      url: ${{ steps.nightly.outputs.url }}
      event: ${{ steps.nightly.outputs.event }}
      source: ${{ steps.nightly.outputs.source }}
    steps:
      - name: "◆ Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: "◇ Find or dispatch same-SHA Nightly Regression"
        id: nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_RUN_ID: ${{ inputs.nightly_run_id }}
        run: |
          python3 -m tools.release.nightly_evidence resolve \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --run-id "$NIGHTLY_RUN_ID" \
            --timeout-minutes 50

  release:
    name: Release
    needs: [image-cve-gate, e2e-gate, nightly-evidence]
    runs-on: ubuntu-latest
    # The forced RC bundle took 17 to 23 minutes across the 1.4.x cuts and the
    # release-only gates add about two. Sixty minutes leaves room for the suite
    # to grow without letting a hung test hold the release group for long.
    timeout-minutes: 60
    permissions:
      # Triggers publish.yml and reads the cited Nightly Regression run.
      actions: write
      # Pushes the version commit and tag and creates the release.
      contents: write

    steps:
      # Pinned to the dispatched commit, the one the gate jobs checked out and
      # the one the cited nightly ran on, even if the branch has moved since.
      - name: "◆ Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "◇ Configure git"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "◇ Install system dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: "◇ Setup moonrepo toolchain"
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: "0.61.1"
          auto-install: true
          auto-setup: true
          cache-version: release-rc-v1

      - name: "◇ Verify toolchain"
        run: |
          chmod +x "$HOME/.proto/shims"/* 2>/dev/null || true
          chmod +x "$HOME/.proto/bin"/* 2>/dev/null || true
          moon --version
          proto --version
          uv --version

      - name: "◇ Cache moon outputs"
        uses: actions/cache@v6
        with:
          path: |
            .moon/cache
            apps/web/.next/cache
          key: moon-release-${{ runner.os }}-${{ hashFiles('.prototools', '.python-version') }}-${{ hashFiles('uv.lock', 'pnpm-lock.yaml') }}
          restore-keys: |
            moon-release-${{ runner.os }}-${{ hashFiles('.prototools', '.python-version') }}-

      - name: "◇ Cache pnpm store"
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-release-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-release-${{ runner.os }}-

      - name: "◇ Cache uv"
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-release-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-release-${{ runner.os }}-

      - name: "◇ Install Node dependencies"
        run: cd apps/web && pnpm install --frozen-lockfile

      - name: "◇ Sync Python workspace"
        run: uv sync --locked --all-packages

      - name: "△ Determine version"
        id: version
        run: |
          # Get current version from VERSION file (single source of truth)
          CURRENT=$(cat VERSION | tr -d '\n')
          echo "Current version: $CURRENT"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' || true)"
          if [[ -z "$PREVIOUS_TAG" ]]; then
            PREVIOUS_TAG="v$CURRENT"
          fi

          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT%%-*}"
            case "${{ inputs.bump }}" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
          fi

          # Validate before VERSION or any generated pin can be mutated. The
          # same parser feeds package metadata, Homebrew, AUR, and tag names.
          VERSION="$(uv run python -m tools.release.version "$VERSION")"

          if git tag -l "v$VERSION" | grep -q "v$VERSION"; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

          NEEDS_VERSION_COMMIT=false
          if [[ "$CURRENT" != "$VERSION" ]]; then
            NEEDS_VERSION_COMMIT=true
          fi

          {
            echo "current=$CURRENT"
            echo "version=$VERSION"
            echo "previous_tag=$PREVIOUS_TAG"
            echo "needs_version_commit=$NEEDS_VERSION_COMMIT"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing: $CURRENT → $VERSION"

      - name: "△ Record validated base SHA"
        id: base
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          if [[ "$base_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Checked out $base_sha, but the gates ran on $GITHUB_SHA."
            exit 1
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      # The workflow bumps the version itself rather than demanding a
      # hand-made commit. The same-SHA safety property survives because the
      # bump is proven to touch nothing but generated pins, so the code that
      # Nightly Regression validated at the base SHA is the code being tagged.
      # The allowlist is read from sync_versions.py so it cannot drift from
      # the pins that tool actually writes.
      - name: "◆ Apply version bump"
        if: ${{ steps.version.outputs.needs_version_commit == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > VERSION
          moon run sync-versions
          moon run sync-versions-check

          uv run python tools/release/sync_versions.py --list-targets > /tmp/pin-allowlist.txt
          # --porcelain rather than `git diff`, so an untracked file the build
          # left behind is inspected too. `git diff` sees only tracked edits,
          # which would let `git add` stage something the check never saw.
          git status --porcelain > /tmp/bump-status.txt

          python - <<'PY'
          import sys
          from pathlib import Path

          allowed = {
              line.strip()
              for line in Path("/tmp/pin-allowlist.txt").read_text().splitlines()
              if line.strip()
          }
          changed = set()
          for line in Path("/tmp/bump-status.txt").read_text().splitlines():
              if not line.strip():
                  continue
              path = line[3:].strip().strip('"')
              # Renames read as "old -> new"; both sides must be allowlisted.
              changed.update(part.strip() for part in path.split("->"))

          smuggled = sorted(changed - allowed)
          if smuggled:
              print("::error::A version bump may only touch generated pins.")
              for path in smuggled:
                  print(f"::error::unexpected change: {path}")
              sys.exit(1)
          print(f"Version bump touched {len(changed)} pin files, all allowlisted.")
          PY

          # Stage the allowlisted pins by name. `git add --all` would stage
          # whatever else happened to be in the tree.
          xargs -a /tmp/pin-allowlist.txt git add --
          git commit -m "chore(release): cut ${VERSION}" -m \
            "Generated by the Release workflow from the validated base SHA."

      - name: "◇ Validate the bump changed only pins"
        if: ${{ steps.version.outputs.needs_version_commit == 'true' }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          uv run python tools/release/sync_versions.py --list-targets > /tmp/pin-allowlist.txt
          git diff --name-only "$BASE_SHA" HEAD > /tmp/committed-changed.txt

          python - <<'PY'
          import sys
          from pathlib import Path

          allowed = {
              line.strip()
              for line in Path("/tmp/pin-allowlist.txt").read_text().splitlines()
              if line.strip()
          }
          changed = {
              line.strip()
              for line in Path("/tmp/committed-changed.txt").read_text().splitlines()
              if line.strip()
          }
          smuggled = sorted(changed - allowed)
          if smuggled:
              print("::error::The committed bump differs from the base by non-pin files.")
              for path in smuggled:
                  print(f"::error::unexpected change: {path}")
              sys.exit(1)
          print("Committed bump is pin-only against the validated base SHA.")
          PY

      - name: "◈ Generate AI release notes"
        if: ${{ !inputs.dry_run }}
        id: ai_release_notes
        uses: hyperb1iss/git-iris@v2
        with:
          command: release-notes
          version: v2.1.0
          from: ${{ steps.version.outputs.previous_tag }}
          to: HEAD
          version-name: ${{ steps.version.outputs.version }}
          provider: anthropic
          model: claude-opus-5
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: "◇ Prepare release notes"
        if: ${{ !inputs.dry_run }}
        id: release_notes
        env:
          AI_CONTENT: ${{ steps.ai_release_notes.outputs.content }}
        run: |
          set -euo pipefail
          notes_path="$(mktemp)"

          if [[ ! "$AI_CONTENT" =~ [^[:space:]] ]]; then
            echo "::error::Git-Iris generated empty release notes; refusing to create a release."
            exit 1
          fi

          printf '%s\n' "$AI_CONTENT" > "$notes_path"
          mkdir -p .moon/cache/release
          uv run python -m tools.release.release_notes \
            --notes "$notes_path" \
            --receipt .moon/cache/release/release-notes-claim-receipt.json

          delimiter="release_notes_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "content<<$delimiter"
            cat "$notes_path"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: "◇ Record candidate SHA"
        id: candidate
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The Helm contract tests inside :check skip themselves when no helm
      # binary exists. Installing the pinned version makes them run on every
      # cut instead of depending on what the runner image happens to ship.
      - name: "◇ Setup Helm"
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.20.2

      # Every task is forced. The moon output cache above is restored across
      # runs, and the 1.4.0 and 1.4.1 cuts replayed the dry run's :check from
      # it in two seconds, so a cut proved nothing on its own. A gate whose
      # declared inputs miss a real dependency would replay a stale pass the
      # same way on a new candidate.
      #
      # :check holds the trust gates, every project's lint, typecheck and
      # tests, and the Helm contracts. The two gates after it run in no CI job
      # at all. doc-claim-gate rewrites its tracked receipt, so it runs after
      # the version commit exists and cannot leak into it.
      - name: "◇ Run RC gate bundle"
        id: rc_check
        run: |
          set -euo pipefail
          moon run :check --force
          moon run bench-longmemeval-v2-release-ci-test --force
          moon run doc-claim-gate --force
          mkdir -p .moon/cache/release
          cp benchmarks/results/ai-memory/doc-claim-receipt.json \
            .moon/cache/release/doc-claim-receipt.json

      # The evidence job already chose this run. Checking it again here, as
      # the last gate before the tag, pins the cited run to the base SHA the
      # workflow actually validated.
      - name: "◇ Validate same-SHA Nightly Regression"
        id: nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_RUN_ID: ${{ needs.nightly-evidence.outputs.run_id }}
          # Validated against the base SHA, not the tag. When the workflow
          # bumps the version it adds one commit that the steps above proved
          # touches only generated pins, so the validated code is unchanged.
          CANDIDATE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          python3 -m tools.release.nightly_evidence verify \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$CANDIDATE_SHA" \
            --run-id "$NIGHTLY_RUN_ID"

      - name: "◇ Record RC gate receipt"
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          IMAGE_CVE_GATE_RESULT: ${{ needs.image-cve-gate.result }}
          E2E_GATE_RESULT: ${{ needs.e2e-gate.result }}
          RC_CHECK_CONCLUSION: ${{ steps.rc_check.conclusion }}
          NIGHTLY_RUN_ID: ${{ steps.nightly.outputs.run_id }}
          NIGHTLY_URL: ${{ steps.nightly.outputs.url }}
          NIGHTLY_EVENT: ${{ steps.nightly.outputs.event }}
          NIGHTLY_SOURCE: ${{ needs.nightly-evidence.outputs.source }}
          NIGHTLY_CONCLUSION: ${{ steps.nightly.conclusion }}
        run: |
          mkdir -p .moon/cache/release
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "version": os.environ["VERSION"],
              "base_sha": os.environ["BASE_SHA"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "dry_run": os.environ["DRY_RUN"].lower() == "true",
              "image_cve_gate_result": os.environ["IMAGE_CVE_GATE_RESULT"],
              "e2e_gate_commands": [
                  "moon run e2e:test --force -- --ignore=tests/browser",
                  "moon run e2e:test-browser --force",
              ],
              "e2e_gate_result": os.environ["E2E_GATE_RESULT"],
              "rc_gate_commands": [
                  "moon run :check --force",
                  "moon run bench-longmemeval-v2-release-ci-test --force",
                  "moon run doc-claim-gate --force",
              ],
              "rc_gate_conclusion": os.environ["RC_CHECK_CONCLUSION"],
              "nightly_run_id": os.environ["NIGHTLY_RUN_ID"],
              "nightly_url": os.environ["NIGHTLY_URL"],
              "nightly_event": os.environ["NIGHTLY_EVENT"],
              "nightly_source": os.environ["NIGHTLY_SOURCE"],
              "nightly_conclusion": os.environ["NIGHTLY_CONCLUSION"],
          }
          Path(".moon/cache/release/rc-gate-receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: "► Upload RC gate receipt"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rc-gate-receipt-${{ steps.candidate.outputs.sha }}
          path: .moon/cache/release/*.json
          if-no-files-found: error

      - name: "◆ Create and push tag"
        if: ${{ !inputs.dry_run }}
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.version.outputs.version }}"

      # Created as a pre-release that is explicitly not "latest", and promoted
      # to a full release by the last job of the publish workflow, once the
      # images are scanned, signed and pushed and every package is out.
      #
      # The gate above scans an image built from this SHA, but publish rebuilds
      # from floating inputs (the base image tag, uv:latest, live apt
      # repositories), so the bytes it ships are not the bytes that were
      # scanned here. That gap is real and is closed by promoting the exact
      # scanned digests instead of rebuilding, which is a publish rework. Until
      # then the staged visibility is what bounds the damage: a release whose
      # distribution fails never presents itself as the version to install.
      #
      # Draft would hide it more thoroughly, but a draft release has no tag
      # association, and publish reads this release back by tag to preserve its
      # notes. A pre-release keeps that read working.
      - name: "◆ Create GitHub Release"
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.content }}
          prerelease: true
          make_latest: false

      - name: "◇ Trigger publish"
        if: ${{ !inputs.dry_run }}
        run: gh workflow run publish.yml -f tag=v${{ steps.version.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "► Summary"
        env:
          RELEASE_NOTES_CONTENT: ${{ steps.release_notes.outputs.content }}
        run: |
          {
            echo "## Release ${{ inputs.dry_run && '[DRY RUN] ' || '' }}v${{ steps.version.outputs.version }}"
            echo ""
            echo "- Base SHA: \`${{ steps.base.outputs.sha }}\`"
            echo "- Candidate SHA: \`${{ steps.candidate.outputs.sha }}\`"
            echo "- Version: \`${{ steps.version.outputs.current }}\` → \`${{ steps.version.outputs.version }}\`"
            echo "- Previous release: \`${{ steps.version.outputs.previous_tag }}\`"
            echo "- Image CVE gate: \`${{ needs.image-cve-gate.result }}\`"
            echo "- E2E gate: \`${{ needs.e2e-gate.result }}\`"
            echo "- RC gate: \`${{ steps.rc_check.conclusion }}\`"
            echo "- Nightly Regression: ${{ steps.nightly.outputs.url }} (${{ steps.nightly.outputs.event }}, ${{ needs.nightly-evidence.outputs.source }})"
            echo ""
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "No version commit, tag, release, or publish was created."
            else
              echo "✓ Released: ${{ steps.version.outputs.previous_tag }} → v${{ steps.version.outputs.version }}"
              echo ""
              echo "### Published Packages"
              echo "- [sibyl-core on PyPI](https://pypi.org/project/sibyl-core/${{ steps.version.outputs.version }}/)"
              echo "- [sibyl-dev on PyPI](https://pypi.org/project/sibyl-dev/${{ steps.version.outputs.version }}/)"
              echo "- [sibyld on PyPI](https://pypi.org/project/sibyld/${{ steps.version.outputs.version }}/)"
              echo "- [Docker Images on GHCR](https://github.com/hyperb1iss/sibyl/pkgs/container/sibyl-api)"
              echo ""
              echo "---"
              echo "### Release Notes"
              echo ""
              printf '%s\n' "$RELEASE_NOTES_CONTENT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
