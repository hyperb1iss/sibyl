name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: sibyl-ci

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      hooks_changed: ${{ steps.classify.outputs.hooks_changed }}
      infra_changed: ${{ steps.classify.outputs.infra_changed }}
      skills_changed: ${{ steps.classify.outputs.skills_changed }}
      runtime_changed: ${{ steps.classify.outputs.runtime_changed }}
      web_changed: ${{ steps.classify.outputs.web_changed }}
      ci_changed: ${{ steps.classify.outputs.ci_changed }}
      image_changed: ${{ steps.classify.outputs.image_changed }}
      image_scan_matrix: ${{ steps.classify.outputs.image_scan_matrix }}
      run_static: ${{ steps.classify.outputs.run_static }}
      run_build: ${{ steps.classify.outputs.run_build }}
      run_tests: ${{ steps.classify.outputs.run_tests }}
      run_e2e: ${{ steps.classify.outputs.run_e2e }}
      run_storybook: ${{ steps.classify.outputs.run_storybook }}
      run_image_scan: ${{ steps.classify.outputs.run_image_scan }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
            diff_range="$base_ref...HEAD"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_ref="$BEFORE_SHA"
            diff_range="$base_ref..HEAD"
          else
            base_ref="$(git rev-list --max-count=1 HEAD^ 2>/dev/null || true)"
            if [[ -n "$base_ref" ]]; then
              diff_range="$base_ref..HEAD"
            else
              diff_range=""
            fi
          fi

          if [[ -n "$base_ref" ]]; then
            git fetch --no-tags --depth=1 origin "$base_ref" || true
          fi

          if [[ -n "$diff_range" ]]; then
            mapfile -t changed_files < <(git diff --name-only "$diff_range")
          else
            mapfile -t changed_files < <(git ls-files)
          fi

          docs_changed=false
          hooks_changed=false
          infra_changed=false
          skills_changed=false
          runtime_changed=false
          web_changed=false
          ci_changed=false
          image_changed=false
          api_image_changed=false
          web_image_changed=false

          for file in "${changed_files[@]}"; do
            [[ -z "$file" ]] && continue

            case "$file" in
              docs/*|README.md|docs.md|.github/workflows/docs.yml)
                docs_changed=true
                ;;
            esac

            case "$file" in
              hooks/*)
                hooks_changed=true
                ;;
            esac

            case "$file" in
              skills/*)
                skills_changed=true
                ;;
            esac

            case "$file" in
              infra/*)
                infra_changed=true
                ;;
            esac

            case "$file" in
              .github/workflows/ci.yml|.github/workflows/nightly-regression.yml|.github/workflows/image-cve-gate.yml|.github/actions/*)
                ci_changed=true
                ;;
            esac

            # Dependency and image sources matched no other case here: the
            # lockfile, the root manifest, and the Dockerfiles all sit outside
            # apps/, so a bump that pulled in a vulnerable transitive
            # dependency used to run no tests and no scan whatsoever. A base
            # image bump is a Dockerfile edit and lands here too, which is the
            # path the msgpack and setuptools advisories arrived by.
            #
            # Attributed per image so the scan builds what the change can
            # actually reach. The first matching arm wins, so the specific
            # per-image inputs are listed ahead of the shared ones.
            case "$file" in
              apps/api/Dockerfile|uv.lock|pyproject.toml|apps/api/pyproject.toml|packages/python/sibyl-core/pyproject.toml)
                api_image_changed=true
                ;;
              apps/web/Dockerfile|package.json|apps/web/package.json|pnpm-lock.yaml|apps/web/pnpm-lock.yaml)
                web_image_changed=true
                ;;
              # Shared or unattributable image inputs reach both images, and so
              # does the suppression file, so an exception can never be added
              # without the scan it would suppress running on the same commit.
              Dockerfile|*/Dockerfile|*/pyproject.toml|.dockerignore|*/.dockerignore|.trivyignore)
                api_image_changed=true
                web_image_changed=true
                ;;
            esac

            case "$file" in
              apps/web/*)
                web_changed=true
                runtime_changed=true
                ;;
              apps/api/*|apps/cli/*|apps/e2e/*|packages/python/sibyl-core/*|tools/*|benchmarks/*|baselines/*|moon.yml|.moon/*|.prototools|pnpm-lock.yaml|compose.e2e.yml|docker-compose*.yml)
                runtime_changed=true
                ;;
            esac
          done

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            runtime_changed=true
            web_changed=true
            ci_changed=true
          fi

          # A change to the gate itself, or to the workflows around it, is not
          # attributable to one image, so it proves itself against both.
          if [[ "$ci_changed" == true || ${#changed_files[@]} -eq 0 ]]; then
            api_image_changed=true
            web_image_changed=true
          fi

          if [[ "$api_image_changed" == true || "$web_image_changed" == true ]]; then
            image_changed=true
            runtime_changed=true
          fi

          image_scan_matrix='[]'
          if [[ "$api_image_changed" == true && "$web_image_changed" == true ]]; then
            image_scan_matrix='["api", "web"]'
          elif [[ "$api_image_changed" == true ]]; then
            image_scan_matrix='["api"]'
          elif [[ "$web_image_changed" == true ]]; then
            image_scan_matrix='["web"]'
          fi

          run_static=false
          run_build=false
          run_tests=false
          run_e2e=false
          run_storybook=false
          run_image_scan=false

          if [[ "$docs_changed" == true || "$hooks_changed" == true || "$infra_changed" == true || "$skills_changed" == true || "$runtime_changed" == true || "$ci_changed" == true ]]; then
            run_static=true
          fi

          if [[ "$runtime_changed" == true || "$ci_changed" == true ]]; then
            run_build=true
            run_tests=true
            run_e2e=true
          fi

          if [[ "$web_changed" == true ]]; then
            run_storybook=true
          fi

          if [[ "$image_scan_matrix" != "[]" ]]; then
            run_image_scan=true
          fi

          {
            echo "docs_changed=$docs_changed"
            echo "hooks_changed=$hooks_changed"
            echo "infra_changed=$infra_changed"
            echo "skills_changed=$skills_changed"
            echo "runtime_changed=$runtime_changed"
            echo "web_changed=$web_changed"
            echo "ci_changed=$ci_changed"
            echo "image_changed=$image_changed"
            echo "image_scan_matrix=$image_scan_matrix"
            echo "run_static=$run_static"
            echo "run_build=$run_build"
            echo "run_tests=$run_tests"
            echo "run_e2e=$run_e2e"
            echo "run_storybook=$run_storybook"
            echo "run_image_scan=$run_image_scan"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Changed Files"
            echo
            if [[ ${#changed_files[@]} -eq 0 ]]; then
              echo "No diff detected; defaulting to the full CI path."
            else
              printf -- "- \`%s\`\n" "${changed_files[@]}"
            fi
            echo
            echo "### CI Plan"
            echo
            echo "- static: $run_static"
            echo "- build: $run_build"
            echo "- tests: $run_tests"
            echo "- e2e: $run_e2e"
            echo "- storybook: $run_storybook"
            echo "- image scan: $run_image_scan $image_scan_matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  # Catches shipped-dependency CVEs at review time. The image scan in publish
  # only speaks once a release is already under way, which is how a HIGH
  # postcss advisory reached two tagged releases. Scoped to --prod so it
  # tracks what actually ships: dev-only advisories in storybook or vitepress
  # never reach an image and must not block a merge.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup moonrepo toolchain
        uses: moonrepo/setup-toolchain@v0.6
        with:
          auto-install: true
          auto-setup: true
          cache-version: surreal-ci-v1

      - name: Audit shipped Node dependencies
        env:
          # Advisories accepted as tracked debt rather than fixed. The list may
          # only shrink: removing an entry is the last step of fixing one, and
          # it is empty because the advisory this gate was built around is now
          # fixed rather than waived.
          KNOWN_ADVISORIES: ""
        run: |
          set -uo pipefail
          pnpm audit --prod --audit-level=high --json > /tmp/audit.json || true

          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          known = {
              entry.strip()
              for entry in os.environ["KNOWN_ADVISORIES"].split(",")
              if entry.strip()
          }
          raw = Path("/tmp/audit.json").read_text().strip()
          advisories = json.loads(raw).get("advisories", {}) if raw else {}

          blocking: list[str] = []
          waived: list[str] = []
          for advisory in advisories.values():
              severity = str(advisory.get("severity", "")).lower()
              if severity not in {"high", "critical"}:
                  continue
              ident = advisory.get("github_advisory_id") or advisory.get("id")
              label = f"{severity.upper()} {advisory.get('module_name')} {ident}"
              (waived if ident in known else blocking).append(label)

          for label in sorted(set(waived)):
              print(f"::notice::known advisory, tracked: {label}")
          for label in sorted(set(blocking)):
              print(f"::error::new advisory in a shipped dependency: {label}")

          if blocking:
              sys.exit(1)
          print(f"No new high or critical advisories. {len(set(waived))} tracked.")
          PY

  # The dependency audit above reads Node manifests. This reads an image,
  # which is the only place a base-image advisory is visible at all: msgpack
  # and setuptools reached a tagged release through pip's vendored set in the
  # Python base image, named in no manifest this repository owns. Same gate
  # the release and publish workflows run, so a merge cannot introduce
  # something a release would later refuse to ship.
  #
  # Scans whichever images the change can actually reach, api, web, or both,
  # from the matrix the classifier derived. The Node audit above reads web's
  # manifests but cannot see packages inherited from its runtime base image,
  # so a web Dockerfile change has to build and scan the web image itself.
  #
  # amd64 only, unlike the release gate, which covers both architectures. The
  # dependency mistake this catches is almost always architecture independent,
  # and pre-merge latency is worth more here than the last few percent of
  # coverage that the release gate then supplies before anything ships.
  image-cve-scan:
    name: Image CVE Scan (amd64)
    needs: changes
    if: needs.changes.outputs.run_image_scan == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/image-cve-gate.yml
    with:
      images: ${{ needs.changes.outputs.image_scan_matrix }}
      platforms: '["amd64"]'

  static:
    name: Static Checks
    needs: changes
    if: needs.changes.outputs.run_static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Setup moonrepo toolchain
        uses: moonrepo/setup-toolchain@v0.6
        with:
          auto-install: true
          auto-setup: true
          cache-version: surreal-ci-v1

      - name: Verify toolchain
        run: |
          chmod +x "$HOME/.proto/shims"/* 2>/dev/null || true
          chmod +x "$HOME/.proto/bin"/* 2>/dev/null || true
          moon --version
          proto --version
          uv --version

      - name: Cache moon outputs
        uses: actions/cache@v6
        with:
          path: |
            .moon/cache
            apps/web/.next/cache
          key:
            moon-${{ runner.os }}-${{ hashFiles('.prototools', 'uv.lock', 'apps/web/pnpm-lock.yaml')
            }}
          restore-keys: |
            moon-${{ runner.os }}-

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install Node dependencies
        run: cd apps/web && pnpm install --frozen-lockfile

      - name: Run static checks
        env:
          DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
          HOOKS_CHANGED: ${{ needs.changes.outputs.hooks_changed }}
          INFRA_CHANGED: ${{ needs.changes.outputs.infra_changed }}
          SKILLS_CHANGED: ${{ needs.changes.outputs.skills_changed }}
          RUNTIME_CHANGED: ${{ needs.changes.outputs.runtime_changed }}
          CI_CHANGED: ${{ needs.changes.outputs.ci_changed }}
        run: |
          set -euo pipefail

          if [[ "$RUNTIME_CHANGED" == "true" || "$CI_CHANGED" == "true" ]]; then
            moon run :lint
            moon run :typecheck
            exit 0
          fi

          ran_any=false

          if [[ "$DOCS_CHANGED" == "true" ]]; then
            moon run docs:lint
            ran_any=true
          fi

          if [[ "$HOOKS_CHANGED" == "true" ]]; then
            moon run hooks:lint hooks:typecheck
            ran_any=true
          fi

          if [[ "$SKILLS_CHANGED" == "true" ]]; then
            moon run skills:lint
            ran_any=true
          fi

          if [[ "$INFRA_CHANGED" == "true" ]]; then
            moon run infra:lint
            ran_any=true
          fi

          if [[ "$ran_any" == false ]]; then
            echo "No static tasks matched the change set."
          fi

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Setup moonrepo toolchain
        uses: moonrepo/setup-toolchain@v0.6
        with:
          auto-install: true
          auto-setup: true
          cache-version: surreal-ci-v1

      - name: Verify toolchain
        run: |
          chmod +x "$HOME/.proto/shims"/* 2>/dev/null || true
          chmod +x "$HOME/.proto/bin"/* 2>/dev/null || true
          moon --version
          proto --version
          uv --version

      - name: Cache moon outputs
        uses: actions/cache@v6
        with:
          path: |
            .moon/cache
            apps/web/.next/cache
          key:
            moon-${{ runner.os }}-${{ hashFiles('.prototools', 'uv.lock', 'apps/web/pnpm-lock.yaml')
            }}
          restore-keys: |
            moon-${{ runner.os }}-

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install Node dependencies
        run: cd apps/web && pnpm install --frozen-lockfile

      - name: Build API and web
        run: moon run api:build web:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: warn

  tests:
    name: Package Tests
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Setup moonrepo toolchain
        uses: moonrepo/setup-toolchain@v0.6
        with:
          auto-install: true
          auto-setup: true
          cache-version: surreal-ci-v1

      - name: Verify toolchain
        run: |
          chmod +x "$HOME/.proto/shims"/* 2>/dev/null || true
          chmod +x "$HOME/.proto/bin"/* 2>/dev/null || true
          moon --version
          proto --version
          uv --version

      - name: Cache moon outputs
        uses: actions/cache@v6
        with:
          path: |
            .moon/cache
            apps/web/.next/cache
          key:
            moon-${{ runner.os }}-${{ hashFiles('.prototools', 'uv.lock', 'apps/web/pnpm-lock.yaml')
            }}
          restore-keys: |
            moon-${{ runner.os }}-

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install Node dependencies
        run: cd apps/web && pnpm install --frozen-lockfile

      - name: Run package test suites
        run: moon run api:test-cov cli:test-cov core:test-cov web:test-cov

      - name: Run eval regression gates
        run: |
          moon run bench-gate
          moon run bench-gate-test

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: apps/api/coverage.xml,apps/cli/coverage.xml,packages/python/sibyl-core/coverage.xml,apps/web/coverage.xml
          fail_ci_if_error: false

  live-ingestion:
    name: Live SurrealDB 3.x Ingestion
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIBYL_ENVIRONMENT: production
      SIBYL_JWT_SECRET: not-a-real-secret-not-a-real-secret
      SIBYL_STORE: surreal
      SIBYL_AUTH_STORE: surreal
      SIBYL_COORDINATION_BACKEND: local
      SIBYL_SURREAL_URL: ws://localhost:8000/rpc
      SIBYL_SURREAL_USERNAME: sibyl_ci
      SIBYL_SURREAL_PASSWORD: sibyl_ci_password
      SIBYL_OPENAI_API_KEY: sk-test-key
      SIBYL_ANTHROPIC_API_KEY: sk-ant-test-key
      SIBYL_MOCK_LLM: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Start SurrealDB
        uses: ./.github/actions/start-surrealdb

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Setup moonrepo toolchain
        uses: moonrepo/setup-toolchain@v0.6
        with:
          auto-install: true
          auto-setup: true
          cache-version: surreal-ci-v1

      - name: Verify toolchain
        run: |
          chmod +x "$HOME/.proto/shims"/* 2>/dev/null || true
          chmod +x "$HOME/.proto/bin"/* 2>/dev/null || true
          moon --version
          proto --version
          uv --version

      - name: Cache moon outputs
        uses: actions/cache@v6
        with:
          path: .moon/cache
          key: moon-live-${{ runner.os }}-${{ hashFiles('.prototools', 'uv.lock') }}
          restore-keys: |
            moon-live-${{ runner.os }}-

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-live-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-live-${{ runner.os }}-

      - name: Run live ingestion primitives
        run: moon run api:test-live

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIBYL_ENVIRONMENT: production
      SIBYL_JWT_SECRET: not-a-real-secret-not-a-real-secret
      SIBYL_STORE: surreal
      SIBYL_AUTH_STORE: surreal
      SIBYL_LOCAL_AUTH_ENABLED: "true"
      SIBYL_COORDINATION_BACKEND: local
      SIBYL_SURREAL_URL: ws://localhost:8000/rpc
      SIBYL_SURREAL_USERNAME: sibyl_ci
      SIBYL_SURREAL_PASSWORD: sibyl_ci_password
      SIBYL_OPENAI_API_KEY: sk-test-key
      SIBYL_ANTHROPIC_API_KEY: sk-ant-test-key
      SIBYL_MOCK_LLM: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Start SurrealDB
        uses: ./.github/actions/start-surrealdb

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Setup moonrepo toolchain
        uses: moonrepo/setup-toolchain@v0.6
        with:
          auto-install: true
          auto-setup: true
          cache-version: surreal-ci-v1

      - name: Verify toolchain
        run: |
          chmod +x "$HOME/.proto/shims"/* 2>/dev/null || true
          chmod +x "$HOME/.proto/bin"/* 2>/dev/null || true
          moon --version
          proto --version
          uv --version

      - name: Cache moon outputs
        uses: actions/cache@v6
        with:
          path: |
            .moon/cache
            apps/web/.next/cache
          key:
            moon-${{ runner.os }}-${{ hashFiles('.prototools', 'uv.lock', 'apps/web/pnpm-lock.yaml')
            }}
          restore-keys: |
            moon-${{ runner.os }}-

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install Node dependencies
        run: cd apps/web && pnpm install --frozen-lockfile

      - name: Build frontend for E2E
        run: moon run web:build

      - name: Start backend server
        run: |
          cd apps/api
          uv run sibyld serve > /tmp/sibyld.log 2>&1 &
          echo "Waiting for backend to start..."
          for i in {1..60}; do
            if curl -fsS http://localhost:3334/api/health > /dev/null; then
              echo "Backend is ready!"
              sleep 2
              break
            fi
            echo "Attempt $i: Backend not ready yet..."
            sleep 1
          done
          curl -fsS http://localhost:3334/api/health | head -c 200

      - name: Start background job worker
        run: |
          cd apps/api
          uv run sibyld worker > /tmp/sibyl-worker.log 2>&1 &
          echo "Background job worker started"
          sleep 2

      - name: Seed deterministic baseline fixture
        run: moon run baseline-seed

      - name: Replay committed baseline corpus
        run: moon run baseline-replay-runtime

      - name: Start frontend server
        run: |
          cd apps/web
          pnpm start > /tmp/sibyl-web.log 2>&1 &
          echo "Waiting for frontend to start..."
          for i in {1..60}; do
            if curl -fsS http://localhost:3337 > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            echo "Attempt $i: Frontend not ready yet..."
            sleep 1
          done

      - name: Run e2e tests
        env:
          SIBYL_E2E_CLI_COMMAND: uv run --project ../cli sibyl
          SIBYL_E2E_EMAIL: baseline-corpus@sibyl.dev
          SIBYL_E2E_PASSWORD: baseline-corpus-password-secure-123!
        run: |
          cd apps/e2e
          uv run pytest -v

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== Backend server logs ==="
          tail -n 200 /tmp/sibyld.log || true
          echo ""
          echo "=== Worker logs ==="
          tail -n 200 /tmp/sibyl-worker.log || true
          echo ""
          echo "=== Frontend logs ==="
          tail -n 200 /tmp/sibyl-web.log || true
          echo ""
          echo "=== SurrealDB logs ==="
          docker compose --env-file /dev/null logs surrealdb || true

  storybook:
    name: Storybook
    needs: changes
    if: needs.changes.outputs.run_storybook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup moonrepo toolchain
        uses: moonrepo/setup-toolchain@v0.6
        with:
          auto-install: true
          auto-setup: true
          cache-version: surreal-ci-v1

      - name: Cache moon outputs
        uses: actions/cache@v6
        with:
          path: |
            .moon/cache
            apps/web/.next/cache
          key:
            moon-${{ runner.os }}-${{ hashFiles('.prototools', 'uv.lock', 'apps/web/pnpm-lock.yaml')
            }}
          restore-keys: |
            moon-${{ runner.os }}-

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install Node dependencies
        run: cd apps/web && pnpm install --frozen-lockfile

      - name: Build Storybook
        run: moon run web:build-storybook
