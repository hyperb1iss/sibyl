name: LongMemEval V2
run-name: >-
  LongMemEval V2 ${{ inputs.official_ci_context_json &&
  fromJSON(inputs.official_ci_context_json).orchestration_id || github.run_id }}
  ${{ inputs.official_ci_context_json &&
  fromJSON(inputs.official_ci_context_json).arm_id || github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/longmemeval-v2.yml"
      - ".github/workflows/longmemeval-v2-release-aa.yml"
      - "benchmarks/longmemeval_v2_download.py"
      - "benchmarks/longmemeval_v2_memory/**"
      - "benchmarks/longmemeval_v2_live_retrieval.py"
      - "benchmarks/longmemeval_v2_official.py"
      - "benchmarks/longmemeval_v2_official_source.py"
      - "benchmarks/longmemeval_v2_ablations.py"
      - "benchmarks/longmemeval_v2_reader_report.py"
      - "benchmarks/longmemeval_v2_reader_replication.py"
      - "benchmarks/longmemeval_v2_reader_replication_report.py"
      - "benchmarks/longmemeval_v2_reader_holdout.py"
      - "benchmarks/longmemeval_v2_reader_holdout_report.py"
      - "benchmarks/longmemeval_v2_causal_ablation.py"
      - "benchmarks/longmemeval_v2_causal_ablation_report.py"
      - "benchmarks/longmemeval_v2_validation_slice.py"
      - "benchmarks/longmemeval_v2_validation_slice_v2.py"
      - "benchmarks/longmemeval_v2_composition_validation.json"
      - "benchmarks/longmemeval_v2_composition_validation_v2.json"
      - "benchmarks/longmemeval_v2_diagnostics.py"
      - "benchmarks/longmemeval_v2_diagnostic_slice.json"
      - "benchmarks/longmemeval_v2_probe.py"
      - "packages/python/sibyl-core/src/sibyl_core/evals/**"
      - "tools/bench/eval_gate.py"
      - "tools/bench/longmemeval_v2_pack_compare.py"
      - "tools/bench/longmemeval_v2_rig.py"
      - "tools/tests/test_longmemeval_v2_official.py"
      - "tools/tests/test_longmemeval_v2_ablations.py"
      - "tools/tests/test_longmemeval_v2_causal_ablation.py"
      - "tools/tests/test_longmemeval_v2_pack_compare.py"
      - "tools/tests/test_longmemeval_v2_rig.py"
      - "tools/tests/test_longmemeval_v2_validation_slice.py"
      - "tools/tests/test_longmemeval_v2_validation_slice_v2.py"
      - "tools/tests/test_longmemeval_v2_diagnostics.py"
      - "packages/python/sibyl-core/tests/test_longmemeval_v2.py"
      - "tools/tests/test_longmemeval_v2_probe.py"
      - "tools/dev/surreal-runtime-monitor.sh"
      - "moon.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/longmemeval-v2.yml"
      - ".github/workflows/longmemeval-v2-release-aa.yml"
      - "benchmarks/longmemeval_v2_download.py"
      - "benchmarks/longmemeval_v2_memory/**"
      - "benchmarks/longmemeval_v2_live_retrieval.py"
      - "benchmarks/longmemeval_v2_official.py"
      - "benchmarks/longmemeval_v2_official_source.py"
      - "benchmarks/longmemeval_v2_ablations.py"
      - "benchmarks/longmemeval_v2_reader_report.py"
      - "benchmarks/longmemeval_v2_reader_replication.py"
      - "benchmarks/longmemeval_v2_reader_replication_report.py"
      - "benchmarks/longmemeval_v2_reader_holdout.py"
      - "benchmarks/longmemeval_v2_reader_holdout_report.py"
      - "benchmarks/longmemeval_v2_causal_ablation.py"
      - "benchmarks/longmemeval_v2_causal_ablation_report.py"
      - "benchmarks/longmemeval_v2_validation_slice.py"
      - "benchmarks/longmemeval_v2_validation_slice_v2.py"
      - "benchmarks/longmemeval_v2_composition_validation.json"
      - "benchmarks/longmemeval_v2_composition_validation_v2.json"
      - "benchmarks/longmemeval_v2_diagnostics.py"
      - "benchmarks/longmemeval_v2_diagnostic_slice.json"
      - "benchmarks/longmemeval_v2_probe.py"
      - "packages/python/sibyl-core/src/sibyl_core/evals/**"
      - "tools/bench/eval_gate.py"
      - "tools/bench/longmemeval_v2_pack_compare.py"
      - "tools/bench/longmemeval_v2_rig.py"
      - "tools/tests/test_longmemeval_v2_official.py"
      - "tools/tests/test_longmemeval_v2_ablations.py"
      - "tools/tests/test_longmemeval_v2_causal_ablation.py"
      - "tools/tests/test_longmemeval_v2_pack_compare.py"
      - "tools/tests/test_longmemeval_v2_rig.py"
      - "tools/tests/test_longmemeval_v2_validation_slice.py"
      - "tools/tests/test_longmemeval_v2_validation_slice_v2.py"
      - "tools/tests/test_longmemeval_v2_diagnostics.py"
      - "packages/python/sibyl-core/tests/test_longmemeval_v2.py"
      - "tools/tests/test_longmemeval_v2_probe.py"
      - "tools/dev/surreal-runtime-monitor.sh"
      - "moon.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      run_official_full:
        description: "Run the approval-bound official full harness"
        type: boolean
        default: false
      official_ci_context_json:
        description: "Sealed controller, source, arm, and frozen-memory identity"
        type: string
        default: >-
          {"orchestration_id":"","arm_id":"","source_sha":"","memory_mode":"save","memory_source_run_id":""}
      official_arm_manifest_json:
        description: "Sealed experiment identity, substrate, geometry, and render profile"
        type: string
        default: >-
          {"experiment_id":"","experiment_phase":"aa","pass_id":"","pass_seed":0,"arm_role":"machine","substrate":"machine","preregistration_sha256":"","max_spend_usd":8,"retrieval_mode":"accurate","max_context_total_chars":60000,"operational_note_dedupe_mode":"source","operational_note_lane_mode":"reserved","operational_note_distillation_profile":"baseline","render_group_lanes":false,"render_action_spines":false}
      official_tier:
        description: "Official haystack tier"
        type: choice
        options:
          - small
          - medium
        default: small
      official_domain:
        description: "Official domain selection; single-domain runs skip combined packaging"
        type: choice
        options:
          - both
          - web
          - enterprise
        default: both
      official_limit:
        description: "Optional question limit per domain; blank means full domain"
        type: string
        default: ""
      official_validation_slice:
        description: "Tracked validation or explicitly developmental replay"
        type: choice
        options:
          - none
          - composition-v1
          - composition-v2
          - composition-v2-developmental-accurate
        default: none
      official_dataset_revision:
        description: "Optional Hugging Face dataset revision"
        type: string
        default: ""
      official_reader_base_url:
        description: "OpenAI-compatible Qwen reader endpoint"
        type: string
        default: "https://openrouter.ai/api/v1"
      official_reader_model:
        description: "Official reader model"
        type: string
        default: "qwen/qwen3.5-9b"
      official_reader_api_key_env:
        description: "Environment variable containing the reader API key"
        type: string
        default: "OPENROUTER_API_KEY"
      official_reader_max_concurrent_requests:
        description: "Maximum concurrent official reader requests"
        type: string
        default: "16"
      official_reader_retry_attempts:
        description: "Attempts per reader request for transient provider failures"
        type: string
        default: "4"
      official_evidence_composition_mode:
        description: "Memory evidence composition strategy"
        type: choice
        options:
          - shared_relevance
          - reserved_support
        default: shared_relevance
      official_source_evidence_bundling:
        description: "Bundle policy-safe operational source evidence into typed items"
        type: boolean
        default: false
      official_retrieval_max_planned_queries:
        description: "Maximum supplemental evidence queries in accurate mode"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
        default: "3"
      official_max_context_chars_per_item:
        description: "Maximum characters retained per retrieved context item"
        type: string
        default: "18000"
      official_typed_stream_retrieval:
        description: "Retrieve distilled notes alongside raw evidence"
        type: boolean
        default: false
      official_typed_stream_limit:
        description: "Maximum distilled-note candidates per retrieval"
        type: string
        default: "8"
      official_note_distillation:
        description: "Distill typed retrieval notes during fresh ingestion"
        type: boolean
        default: false
      official_note_distillation_model:
        description: "Memory model used to distill typed retrieval notes"
        type: string
        default: "gpt-5.4-nano"
      official_api_retry_attempts:
        description: "Attempts per Sibyl API request"
        type: string
        default: "3"
      official_prompt_build_max_workers:
        description: "Concurrent official prompt builders"
        type: string
        default: "1"
      official_evaluator_model:
        description: "Official evaluator model"
        type: string
        default: "gpt-5.2"
      official_include_screenshots:
        description: "Download trajectory screenshots and pass screenshot refs"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group:
    ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' &&
    inputs.run_official_full && github.run_id || 'standard' }}
  cancel-in-progress:
    ${{ github.event_name != 'workflow_dispatch' || !inputs.run_official_full }}

jobs:
  probe:
    name: Probe ${{ matrix.tier }}
    if: github.event_name != 'workflow_dispatch' || !inputs.run_official_full
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tier: [small, medium]
    env:
      DATA_ROOT: .moon/cache/benchmarks/longmemeval-v2
      HF_BASE: https://huggingface.co/datasets/xiaowu0162/longmemeval-v2/resolve/main
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Setup moonrepo toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: "0.61.1"
          auto-install: true
          auto-setup: true
          cache-version: longmemeval-v2-v1

      - name: Cache moon outputs
        uses: actions/cache@v6
        with:
          path: .moon/cache
          key: moon-longmemeval-v2-${{ runner.os }}-${{ hashFiles('.prototools', '.python-version') }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            moon-longmemeval-v2-${{ runner.os }}-${{ hashFiles('.prototools', '.python-version') }}-

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-longmemeval-v2-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-longmemeval-v2-${{ runner.os }}-

      - name: Fetch LongMemEval-V2 metadata
        run: |
          set -euo pipefail
          mkdir -p "$DATA_ROOT/haystacks" ".moon/cache/evals"
          # -f keeps an HTTP error page from being written over the target.
          # Without it curl saves the error body and still exits 0, so an
          # upstream hiccup on checksums.sha256 destroys the verifier for every
          # other file and only surfaces as an unreadable checksum list below.
          fetch() {
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors "$1" -o "$2"
          }
          fetch "$HF_BASE/checksums.sha256?download=true" \
            "$DATA_ROOT/checksums.sha256"
          fetch "$HF_BASE/questions.jsonl?download=true" \
            "$DATA_ROOT/questions.jsonl"
          fetch "$HF_BASE/SCHEMA.md?download=true" \
            "$DATA_ROOT/SCHEMA.md"
          fetch "$HF_BASE/haystacks/lme_v2_${{ matrix.tier }}.json?download=true" \
            "$DATA_ROOT/haystacks/lme_v2_${{ matrix.tier }}.json"
          (
            cd "$DATA_ROOT"
            pattern='  (questions.jsonl|SCHEMA.md|haystacks/lme_v2_${{ matrix.tier }}\.json)$'
            listed=$(grep -Ec "$pattern" checksums.sha256 || true)
            if [ "$listed" -ne 3 ]; then
              echo "checksums.sha256 lists $listed of the 3 expected entries" >&2
              head -c 400 checksums.sha256 >&2
              exit 1
            fi
            grep -E "$pattern" checksums.sha256 | sha256sum -c -
          )

      - name: Run LongMemEval-V2 probe
        run: |
          moon run bench-longmemeval-v2-probe -- \
            "$DATA_ROOT" \
            --tier "${{ matrix.tier }}" \
            --json \
            --output ".moon/cache/evals/longmemeval_v2_${{ matrix.tier }}_probe.json"

      - name: Upload LongMemEval-V2 probe artifact
        uses: actions/upload-artifact@v7
        with:
          name: longmemeval-v2-${{ matrix.tier }}-probe-${{ github.sha }}
          path: .moon/cache/evals/longmemeval_v2_${{ matrix.tier }}_probe.json
          if-no-files-found: error

  official-preflight:
    name: Validate sealed paid arm
    if: github.event_name == 'workflow_dispatch' && inputs.run_official_full
    runs-on: ubuntu-latest
    steps:
      - name: Reject incomplete or unpackageable paid runs
        env:
          OFFICIAL_CI_CONTEXT_JSON: ${{ inputs.official_ci_context_json }}
          OFFICIAL_DOMAIN: ${{ inputs.official_domain || 'both' }}
          OFFICIAL_LIMIT: ${{ inputs.official_limit || '' }}
          OFFICIAL_TIER: ${{ inputs.official_tier || 'small' }}
          OFFICIAL_VALIDATION_SLICE: ${{ inputs.official_validation_slice || 'none' }}
        run: |
          set -euo pipefail
          if [[ "$OFFICIAL_TIER" != "small" ]]; then
            echo "::error::Sealed paid arms require the complete Small corpus."
            exit 1
          fi
          if [[ "$OFFICIAL_DOMAIN" != "both" ]]; then
            echo "::error::Sealed paid arms require both official Small domains."
            exit 1
          fi
          if [[ -n "$OFFICIAL_LIMIT" ]]; then
            echo "::error::Sealed paid arms forbid official_limit."
            exit 1
          fi
          if [[ "$OFFICIAL_VALIDATION_SLICE" != "none" ]]; then
            echo "::error::Sealed paid arms cannot use a validation slice."
            exit 1
          fi
          if ! jq -e '
            type == "object" and
            ((keys | sort) == ([
              "arm_id",
              "memory_mode",
              "memory_source_run_id",
              "orchestration_id",
              "source_sha"
            ] | sort)) and
            (.arm_id | type == "string") and
            (.memory_mode | IN("save", "load")) and
            (.memory_source_run_id | type == "string") and
            (.orchestration_id | type == "string") and
            (.source_sha | type == "string")
          ' <<< "$OFFICIAL_CI_CONTEXT_JSON" >/dev/null; then
            echo "::error::official_ci_context_json does not match the sealed schema."
            exit 1
          fi
          OFFICIAL_MEMORY_MODE="$(jq -r '.memory_mode' <<< "$OFFICIAL_CI_CONTEXT_JSON")"
          OFFICIAL_MEMORY_SOURCE_RUN_ID="$(
            jq -r '.memory_source_run_id' <<< "$OFFICIAL_CI_CONTEXT_JSON"
          )"
          OFFICIAL_ORCHESTRATION_ID="$(jq -r '.orchestration_id' <<< "$OFFICIAL_CI_CONTEXT_JSON")"
          OFFICIAL_ARM_ID="$(jq -r '.arm_id' <<< "$OFFICIAL_CI_CONTEXT_JSON")"
          OFFICIAL_SOURCE_SHA="$(jq -r '.source_sha' <<< "$OFFICIAL_CI_CONTEXT_JSON")"
          OFFICIAL_SOURCE_SHA="${OFFICIAL_SOURCE_SHA:-$GITHUB_SHA}"
          if [[ "$OFFICIAL_SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Paid arm source SHA differs from the controller pin."
            exit 1
          fi
          if [[ -n "$OFFICIAL_ORCHESTRATION_ID" || -n "$OFFICIAL_ARM_ID" ]]; then
            if [[ ! "$OFFICIAL_ORCHESTRATION_ID" =~ ^[a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?$ ]] ||
              [[ ! "$OFFICIAL_ARM_ID" =~ ^aa-[1-3]-(left|right)$ ]]; then
              echo "::error::Distributed release identities are invalid."
              exit 1
            fi
          fi
          if [[ "$OFFICIAL_MEMORY_MODE" == "save" ]]; then
            if [[ -n "$OFFICIAL_MEMORY_SOURCE_RUN_ID" ]]; then
              echo "::error::A memory builder cannot name an upstream run."
              exit 1
            fi
          elif [[ "$OFFICIAL_MEMORY_MODE" == "load" ]]; then
            if [[ ! "$OFFICIAL_MEMORY_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::A memory consumer requires one canonical builder run ID."
              exit 1
            fi
          else
            echo "::error::official_memory_mode must be save or load."
            exit 1
          fi

  official-memory-source:
    name: Validate frozen memory source
    if: github.event_name == 'workflow_dispatch' && inputs.run_official_full
    needs: official-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      MEMORY_MODE: ${{ fromJSON(inputs.official_ci_context_json || '{}').memory_mode }}
      MEMORY_SOURCE_RUN_ID:
        ${{ fromJSON(inputs.official_ci_context_json || '{}').memory_source_run_id }}
      SOURCE_SHA:
        ${{ fromJSON(inputs.official_ci_context_json || '{}').source_sha || github.sha }}
    steps:
      - name: Validate the completed frozen baseline builder
        if: env.MEMORY_MODE == 'load'
        run: |
          set -euo pipefail
          run_json="$(gh run view "$MEMORY_SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,event,headSha,workflowName)"
          if ! jq -e \
            --arg sha "$SOURCE_SHA" \
            '.conclusion == "success" and
             .event == "workflow_dispatch" and
             .headSha == $sha and
             .workflowName == "LongMemEval V2"' \
            <<< "$run_json" >/dev/null; then
            echo "::error::Frozen memory builder provenance is invalid."
            jq . <<< "$run_json"
            exit 1
          fi

  official-full:
    name: Official ${{ matrix.domain }} ${{ inputs.official_tier || 'small' }}
    if: github.event_name == 'workflow_dispatch' && inputs.run_official_full
    needs: [official-preflight, official-memory-source]
    runs-on: ubuntu-latest
    environment: longmemeval-paid
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        domain:
          ${{ fromJSON(inputs.official_domain == 'web' && '["web"]' ||
          inputs.official_domain == 'enterprise' && '["enterprise"]' ||
          '["web","enterprise"]') }}
    env:
      COMPOSE_PROJECT_NAME: sibyl-longmemeval-v2
      DATA_ROOT: .moon/cache/benchmarks/longmemeval-v2-official
      OFFICIAL_REPO_DIR: .moon/cache/longmemeval-v2-official
      OUTPUT_ROOT: .moon/cache/evals/longmemeval-v2-official
      OFFICIAL_TIER: ${{ inputs.official_tier || 'small' }}
      FROZEN_MEMORY_ROOT: /tmp/longmemeval-v2-frozen-memory
      MEMORY_MODE: ${{ fromJSON(inputs.official_ci_context_json || '{}').memory_mode }}
      MEMORY_SOURCE_RUN_ID:
        ${{ fromJSON(inputs.official_ci_context_json || '{}').memory_source_run_id }}
      SOURCE_SHA:
        ${{ fromJSON(inputs.official_ci_context_json || '{}').source_sha || github.sha }}
      LME_SIBYL_EMAIL:
        longmemeval-v2-${{ fromJSON(inputs.official_ci_context_json || '{}').orchestration_id ||
        github.run_id }}-${{ matrix.domain }}@example.invalid
      LME_SIBYL_PASSWORD:
        SibylLongMemEvalV2-${{ fromJSON(inputs.official_ci_context_json || '{}').orchestration_id ||
        github.run_id }}-${{ matrix.domain }}-password
      OFFICIAL_LIMIT: ${{ inputs.official_limit || '' }}
      OFFICIAL_VALIDATION_SLICE: ${{ inputs.official_validation_slice || 'none' }}
      VALIDATION_MANIFEST:
        ${{ startsWith(inputs.official_validation_slice, 'composition-v2') &&
        'benchmarks/longmemeval_v2_composition_validation_v2.json' ||
        'benchmarks/longmemeval_v2_composition_validation.json' }}
      VALIDATION_TASK:
        ${{ startsWith(inputs.official_validation_slice, 'composition-v2') &&
        'bench-longmemeval-v2-validation-slice-v2' ||
        'bench-longmemeval-v2-validation-slice' }}
      ARM_MANIFEST_JSON: ${{ inputs.official_arm_manifest_json || '' }}
      OFFICIAL_DATASET_REVISION: ${{ inputs.official_dataset_revision || '' }}
      OFFICIAL_INCLUDE_SCREENSHOTS: ${{ inputs.official_include_screenshots || false }}
      READER_BASE_URL: ${{ inputs.official_reader_base_url || 'https://openrouter.ai/api/v1' }}
      READER_MODEL: ${{ inputs.official_reader_model || 'qwen/qwen3.5-9b' }}
      READER_API_KEY_ENV: ${{ inputs.official_reader_api_key_env || 'OPENROUTER_API_KEY' }}
      READER_MAX_CONCURRENT_REQUESTS: ${{ inputs.official_reader_max_concurrent_requests || '16' }}
      READER_RETRY_ATTEMPTS: ${{ inputs.official_reader_retry_attempts || '4' }}
      EVIDENCE_COMPOSITION_MODE:
        ${{ inputs.official_evidence_composition_mode || 'shared_relevance' }}
      SOURCE_EVIDENCE_BUNDLING: ${{ inputs.official_source_evidence_bundling || false }}
      RETRIEVAL_MAX_PLANNED_QUERIES:
        ${{ inputs.official_retrieval_max_planned_queries || '3' }}
      MAX_CONTEXT_CHARS_PER_ITEM:
        ${{ inputs.official_max_context_chars_per_item || '18000' }}
      TYPED_STREAM_RETRIEVAL: ${{ inputs.official_typed_stream_retrieval || false }}
      TYPED_STREAM_LIMIT: ${{ inputs.official_typed_stream_limit || '8' }}
      NOTE_DISTILLATION: ${{ inputs.official_note_distillation || false }}
      NOTE_DISTILLATION_MODEL: ${{ inputs.official_note_distillation_model || 'gpt-5.4-nano' }}
      API_RETRY_ATTEMPTS: ${{ inputs.official_api_retry_attempts || '3' }}
      PROMPT_BUILD_MAX_WORKERS: ${{ inputs.official_prompt_build_max_workers || '1' }}
      EVALUATOR_MODEL: ${{ inputs.official_evaluator_model || 'gpt-5.2' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SIBYL_ENVIRONMENT: production
      SIBYL_JWT_SECRET: not-a-real-secret-not-a-real-secret
      SIBYL_STORE: surreal
      SIBYL_AUTH_STORE: surreal
      SIBYL_PUBLIC_SIGNUPS_ENABLED: "true"
      SIBYL_LOCAL_AUTH_ENABLED: "true"
      SIBYL_COORDINATION_BACKEND: redis
      SIBYL_SURREAL_URL: ws://localhost:8000/rpc
      SIBYL_SURREAL_USERNAME: sibyl_ci
      SIBYL_SURREAL_PASSWORD: sibyl_ci_password
      SIBYL_SURREAL_PATH: rocksdb:///data/sibyl-longmemeval-v2.db
      SURREAL_ROCKSDB_BLOCK_CACHE_SIZE: "4294967296"
      SIBYL_REDIS_HOST: 127.0.0.1
      SIBYL_REDIS_PORT: "6381"
      SIBYL_GRAPH_EMBEDDING_PROVIDER: local
      SIBYL_GRAPH_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      SIBYL_GRAPH_EMBEDDING_DIMENSIONS: "384"
      SIBYL_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SIBYL_LLM_MEMORY_PROVIDER: openai
      SIBYL_LLM_MEMORY_MODEL: gpt-5.4-nano
      SIBYL_LLM_MEMORY_MAX_TOKENS: "800"
      SIBYL_LLM_MEMORY_TIMEOUT_SECONDS: "120"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: xiaowu0162/LongMemEval-V2
          ref: 2cc8c540bdb87fe6761629b585e727e1c4704520
          path: .moon/cache/longmemeval-v2-official
          persist-credentials: false

      - name: Download frozen baseline memory
        if: env.MEMORY_MODE == 'load'
        uses: actions/download-artifact@v8
        with:
          name:
            longmemeval-v2-frozen-memory-${{ matrix.domain }}-${{
            env.SOURCE_SHA }}-${{ env.MEMORY_SOURCE_RUN_ID }}
          path: /tmp/longmemeval-v2-frozen-memory/${{ matrix.domain }}
          github-token: ${{ github.token }}
          run-id: ${{ env.MEMORY_SOURCE_RUN_ID }}

      - name: Validate frozen baseline memory
        if: env.MEMORY_MODE == 'load'
        run: |
          set -euo pipefail
          memory="$FROZEN_MEMORY_ROOT/${{ matrix.domain }}/memory_state"
          snapshot="$FROZEN_MEMORY_ROOT/${{ matrix.domain }}/surrealdb_snapshot.tar"
          snapshot_manifest="$FROZEN_MEMORY_ROOT/${{ matrix.domain }}/database_snapshot_manifest.json"
          if [[ ! -s "$memory/memory_manifest.json" ]]; then
            echo "::error::Frozen baseline memory is incomplete for ${{ matrix.domain }}."
            exit 1
          fi
          if ! jq -e \
            --arg domain "${{ matrix.domain }}" \
            --arg sha "$SOURCE_SHA" \
            --arg run "$MEMORY_SOURCE_RUN_ID" \
            '.schema_version == "sibyl-longmemeval-v2-database-snapshot-v1" and
             .domain == $domain and
             .source_sha == $sha and
             .builder_run_id == $run and
             (.snapshot_sha256 | test("^sha256:[0-9a-f]{64}$")) and
             (.memory_manifest_sha256 | test("^sha256:[0-9a-f]{64}$")) and
             (.snapshot_size_bytes | type == "number" and . > 0)' \
            "$snapshot_manifest" >/dev/null; then
            echo "::error::Frozen database snapshot manifest is invalid."
            exit 1
          fi
          expected_snapshot="$(jq -r '.snapshot_sha256 | sub("^sha256:"; "")' "$snapshot_manifest")"
          expected_memory="$(jq -r '.memory_manifest_sha256 | sub("^sha256:"; "")' "$snapshot_manifest")"
          printf '%s  %s\n' "$expected_snapshot" "$snapshot" | sha256sum -c -
          printf '%s  %s\n' "$expected_memory" "$memory/memory_manifest.json" | sha256sum -c -
          if [[ "$(stat -c %s "$snapshot")" != "$(jq -r '.snapshot_size_bytes' "$snapshot_manifest")" ]]; then
            echo "::error::Frozen database snapshot size differs from its manifest."
            exit 1
          fi
          if tar -tf "$snapshot" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error::Frozen database snapshot contains an unsafe path."
            exit 1
          fi

      - name: Restore frozen baseline database
        if: env.MEMORY_MODE == 'load'
        run: |
          set -euo pipefail
          database_root="$RUNNER_TEMP/sibyl-surrealdb"
          mkdir -p "$database_root"
          tar -xf "$FROZEN_MEMORY_ROOT/${{ matrix.domain }}/surrealdb_snapshot.tar" \
            -C "$database_root"
          chmod -R u+rwX "$database_root"

      - name: Guard paid-run dependencies
        run: |
          set -euo pipefail
          if ! jq -e '
            type == "object" and
            ((keys | sort) == ([
              "arm_role",
              "experiment_id",
              "experiment_phase",
              "max_context_total_chars",
              "max_spend_usd",
              "operational_note_dedupe_mode",
              "operational_note_distillation_profile",
              "operational_note_lane_mode",
              "pass_id",
              "pass_seed",
              "preregistration_sha256",
              "render_action_spines",
              "render_group_lanes",
              "retrieval_mode",
              "substrate"
            ] | sort)) and
            (.experiment_id | type == "string" and length > 0) and
            (.experiment_phase | IN("aa", "anchor", "race", "render")) and
            (.pass_id | type == "string" and length > 0) and
            (.pass_seed | type == "number" and . >= 0 and floor == .) and
            (.arm_role | IN("machine", "naive", "render_control", "render_treatment")) and
            (.substrate | IN("machine", "naive")) and
            (.preregistration_sha256 | type == "string") and
            (.preregistration_sha256 == "" or
              (.preregistration_sha256 | test("^[0-9a-f]{64}$"))) and
            (.max_spend_usd | type == "number" and . > 0) and
            (.retrieval_mode | IN("fast", "accurate", "naive")) and
            (.max_context_total_chars | type == "number" and . > 0 and floor == .) and
            (.operational_note_dedupe_mode | IN("source", "source_kind")) and
            (.operational_note_lane_mode | IN("reserved", "additive")) and
            (.operational_note_distillation_profile | IN("baseline", "render_v1")) and
            (.render_group_lanes | type == "boolean") and
            (.render_action_spines | type == "boolean")
          ' <<< "$ARM_MANIFEST_JSON" >/dev/null; then
            echo "::error::official_arm_manifest_json does not match the sealed schema."
            exit 1
          fi
          EXPERIMENT_ID=$(jq -r '.experiment_id' <<< "$ARM_MANIFEST_JSON")
          EXPERIMENT_PHASE=$(jq -r '.experiment_phase' <<< "$ARM_MANIFEST_JSON")
          PASS_ID=$(jq -r '.pass_id' <<< "$ARM_MANIFEST_JSON")
          PASS_SEED=$(jq -r '.pass_seed' <<< "$ARM_MANIFEST_JSON")
          ARM_ROLE=$(jq -r '.arm_role' <<< "$ARM_MANIFEST_JSON")
          SUBSTRATE=$(jq -r '.substrate' <<< "$ARM_MANIFEST_JSON")
          PREREGISTRATION_SHA256=$(jq -r '.preregistration_sha256' <<< "$ARM_MANIFEST_JSON")
          MAX_SPEND_USD=$(jq -r '.max_spend_usd' <<< "$ARM_MANIFEST_JSON")
          RETRIEVAL_MODE=$(jq -r '.retrieval_mode' <<< "$ARM_MANIFEST_JSON")
          MAX_CONTEXT_TOTAL_CHARS=$(
            jq -r '.max_context_total_chars' <<< "$ARM_MANIFEST_JSON"
          )
          NOTE_DEDUPE_MODE=$(
            jq -r '.operational_note_dedupe_mode' <<< "$ARM_MANIFEST_JSON"
          )
          NOTE_LANE_MODE=$(
            jq -r '.operational_note_lane_mode' <<< "$ARM_MANIFEST_JSON"
          )
          NOTE_DISTILLATION_PROFILE=$(
            jq -r '.operational_note_distillation_profile' <<< "$ARM_MANIFEST_JSON"
          )
          RENDER_GROUP_LANES=$(jq -r '.render_group_lanes' <<< "$ARM_MANIFEST_JSON")
          RENDER_ACTION_SPINES=$(jq -r '.render_action_spines' <<< "$ARM_MANIFEST_JSON")
          export EXPERIMENT_ID EXPERIMENT_PHASE PASS_ID PREREGISTRATION_SHA256
          for value_name in \
            EXPERIMENT_ID EXPERIMENT_PHASE PASS_ID PASS_SEED ARM_ROLE SUBSTRATE \
            PREREGISTRATION_SHA256 MAX_SPEND_USD RETRIEVAL_MODE \
            MAX_CONTEXT_TOTAL_CHARS NOTE_DEDUPE_MODE NOTE_LANE_MODE \
            NOTE_DISTILLATION_PROFILE RENDER_GROUP_LANES RENDER_ACTION_SPINES; do
            printf '%s=%s\n' "$value_name" "${!value_name}" >> "$GITHUB_ENV"
          done
          for value_name in \
            EXPERIMENT_ID EXPERIMENT_PHASE PASS_ID PASS_SEED ARM_ROLE SUBSTRATE \
            MAX_SPEND_USD; do
            if [[ -z "${!value_name}" ]]; then
              echo "::error::${value_name} is required for every paid official arm."
              exit 1
            fi
          done
          if [[ ! "$PASS_SEED" =~ ^[0-9]+$ ]]; then
            echo "::error::official_pass_seed must be a non-negative integer."
            exit 1
          fi
          if [[ ! "$MAX_SPEND_USD" =~ ^[0-9]+([.][0-9]+)?$ ]] ||
            ! awk -v cap="$MAX_SPEND_USD" 'BEGIN { exit !(cap > 0) }'; then
            echo "::error::official_max_spend_usd must be finite and positive."
            exit 1
          fi
          if [[ ! "$MAX_CONTEXT_TOTAL_CHARS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::official_max_context_total_chars must be positive."
            exit 1
          fi
          if [[ "$EXPERIMENT_PHASE" == "race" || "$EXPERIMENT_PHASE" == "render" ]]; then
            if [[ -z "$PREREGISTRATION_SHA256" ]]; then
              echo "::error::Race and render phases require a preregistration digest."
              exit 1
            fi
          elif [[ -n "$PREREGISTRATION_SHA256" ]]; then
            echo "::error::A/A and anchor phases must precede preregistration."
            exit 1
          fi
          if [[ "$ARM_ROLE" == "naive" ]]; then
            if [[ "$SUBSTRATE" != "naive" || "$RETRIEVAL_MODE" != "naive" ]]; then
              echo "::error::The naive arm requires the naive substrate and retrieval mode."
              exit 1
            fi
          elif [[ "$SUBSTRATE" != "machine" || "$RETRIEVAL_MODE" == "naive" ]]; then
            echo "::error::Machine and render arms require the machine substrate."
            exit 1
          fi
          if [[ "$ARM_ROLE" == "render_treatment" ]]; then
            if [[ "$NOTE_DEDUPE_MODE" != "source_kind" ||
              "$NOTE_LANE_MODE" != "additive" ||
              "$NOTE_DISTILLATION_PROFILE" != "render_v1" ||
              "$NOTE_DISTILLATION" != "true" ||
              "$TYPED_STREAM_RETRIEVAL" != "true" ||
              "$RENDER_GROUP_LANES" != "true" ||
              "$RENDER_ACTION_SPINES" != "true" ]]; then
              echo "::error::The render treatment requires the complete preregistered bundle."
              exit 1
            fi
            if ! awk -v chars="$MAX_CONTEXT_TOTAL_CHARS" 'BEGIN { exit !(chars > 60000) }'; then
              echo "::error::The render treatment must raise the 60000-character ceiling."
              exit 1
            fi
          elif [[ "$NOTE_DEDUPE_MODE" != "source" ||
            "$NOTE_LANE_MODE" != "reserved" ||
            "$NOTE_DISTILLATION_PROFILE" != "baseline" ||
            "$RENDER_GROUP_LANES" != "false" ||
            "$RENDER_ACTION_SPINES" != "false" ]]; then
            echo "::error::Control arms cannot enable render treatment levers."
            exit 1
          fi
          if [[ "$OFFICIAL_VALIDATION_SLICE" != "none" && -n "$OFFICIAL_LIMIT" ]]; then
            echo "::error::official_limit cannot be combined with a frozen validation slice."
            exit 1
          fi
          if [[ "$OFFICIAL_VALIDATION_SLICE" != "none" && "$OFFICIAL_INCLUDE_SCREENSHOTS" == "true" ]]; then
            echo "::error::Screenshots are disabled by the frozen validation slice."
            exit 1
          fi
          if [[ "$OFFICIAL_VALIDATION_SLICE" == "composition-v2-developmental-accurate" ]]; then
            if [[ "$RETRIEVAL_MODE" != "accurate" || "$RETRIEVAL_MAX_PLANNED_QUERIES" != "3" ]]; then
              echo "::error::Developmental replay requires accurate retrieval with three planned queries."
              exit 1
            fi
          elif [[ "$OFFICIAL_VALIDATION_SLICE" != "none" && "$RETRIEVAL_MODE" != "fast" ]]; then
            echo "::error::Existing frozen validation slices require retrieval_mode=fast."
            exit 1
          fi
          if [[ "$OFFICIAL_VALIDATION_SLICE" != "none" && "$READER_BASE_URL" != "https://openrouter.ai/api/v1" ]]; then
            echo "::error::official_reader_base_url must exactly match the frozen validation slice."
            exit 1
          fi
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo "::error::OPENAI_API_KEY is required for evaluation and memory distillation."
            exit 1
          fi
          if [[ -z "${READER_BASE_URL}" ]]; then
            echo "::error::official_reader_base_url must point at the Qwen3.5-9B reader endpoint."
            exit 1
          fi
          if [[ -z "${READER_API_KEY_ENV}" ]]; then
            echo "::error::official_reader_api_key_env must name the reader API key environment variable."
            exit 1
          fi
          reader_api_key="${!READER_API_KEY_ENV:-}"
          if [[ -z "${reader_api_key}" ]]; then
            echo "::error::${READER_API_KEY_ENV} repo secret is required for the Qwen3.5-9B reader."
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer ${reader_api_key}" \
            "${READER_BASE_URL%/}/models" > /dev/null || {
            echo "::error::Reader endpoint is not reachable at ${READER_BASE_URL%/}/models."
            exit 1
          }

      - name: Start SurrealDB
        uses: ./.github/actions/start-surrealdb

      - name: Start Redis coordination
        run: |
          set -euo pipefail
          docker compose --env-file /dev/null --profile redis up -d redis
          for attempt in {1..30}; do
            if docker compose --env-file /dev/null --profile redis \
              exec -T redis valkey-cli ping | grep -qx PONG; then
              exit 0
            fi
            echo "Attempt $attempt: Redis coordination is not ready yet."
            sleep 1
          done
          docker compose --env-file /dev/null --profile redis logs redis
          exit 1

      - name: Start SurrealDB runtime telemetry
        run: |
          set -euo pipefail
          telemetry="$RUNNER_TEMP/surrealdb-runtime"
          surrealdb_id="$(docker compose --env-file /dev/null ps -q surrealdb)"
          if [[ -z "$surrealdb_id" ]]; then
            echo "::error::SurrealDB container ID is unavailable."
            exit 1
          fi
          mkdir -p "$telemetry"
          tools/dev/surreal-runtime-monitor.sh monitor \
            --container "$surrealdb_id" \
            --output-dir "$telemetry" \
            --interval 5 \
            > "$telemetry/monitor.log" 2>&1 &
          monitor_pid=$!
          printf '%s\n' "$monitor_pid" > "$telemetry/monitor.pid"
          printf '%s\n' "$surrealdb_id" > "$telemetry/container.id"
          for _ in {1..20}; do
            if ! kill -0 "$monitor_pid" 2>/dev/null; then
              cat "$telemetry/monitor.log"
              exit 1
            fi
            if [[ -e "$telemetry/monitor-ready" ]] &&
              [[ -s "$telemetry/samples.tsv" ]] &&
              (( $(wc -l < "$telemetry/samples.tsv") >= 2 )); then
              exit 0
            fi
            sleep 1
          done
          echo "::error::SurrealDB telemetry did not produce its first sample."
          cat "$telemetry/monitor.log"
          exit 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Setup moonrepo toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: "0.61.1"
          auto-install: true
          auto-setup: true
          cache-version: longmemeval-v2-official-v1

      - name: Cache moon outputs
        uses: actions/cache@v6
        with:
          path: .moon/cache
          key: moon-longmemeval-v2-official-${{ runner.os }}-${{ hashFiles('.prototools', '.python-version') }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            moon-longmemeval-v2-official-${{ runner.os }}-${{ hashFiles('.prototools', '.python-version') }}-

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-longmemeval-v2-official-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-longmemeval-v2-official-${{ runner.os }}-

      - name: Cache local embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            hf-minilm-${{ runner.os }}-

      - name: Start backend server
        run: |
          set -euo pipefail
          cd apps/api
          uv run --with sentence-transformers==6.0.0 sibyld serve \
            > /tmp/sibyld.log 2>&1 &
          printf '%s\n' "$!" > /tmp/sibyld.pid
          for _ in {1..180}; do
            if curl -fsS http://localhost:3334/api/health > /dev/null; then
              sleep 2
              curl -fsS http://localhost:3334/api/health | head -c 200
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sibyld.log
          exit 1

      - name: Start background job worker
        run: |
          cd apps/api
          uv run --with sentence-transformers==6.0.0 sibyld worker \
            > /tmp/sibyl-worker.log 2>&1 &
          printf '%s\n' "$!" > /tmp/sibyl-worker.pid
          sleep 2

      - name: Fetch LongMemEval-V2 full dataset
        run: |
          set -euo pipefail
          args=(--data-root "$DATA_ROOT")
          if [[ -n "$OFFICIAL_DATASET_REVISION" ]]; then
            args+=(--revision "$OFFICIAL_DATASET_REVISION")
          fi
          if [[ "$OFFICIAL_INCLUDE_SCREENSHOTS" == "true" ]]; then
            args+=(--include-trajectory-screenshots)
          fi
          moon run bench-longmemeval-v2-download -- "${args[@]}"

      - name: Verify frozen validation slice
        if: inputs.official_validation_slice != 'none'
        run: |
          set -euo pipefail
          args=(
            verify
            --manifest "$VALIDATION_MANIFEST"
            --questions "$DATA_ROOT/questions.jsonl"
            --tier "$OFFICIAL_TIER"
            --reader-base-url "$READER_BASE_URL"
            --reader-model "$READER_MODEL"
            --reader-max-concurrent-requests "$READER_MAX_CONCURRENT_REQUESTS"
            --reader-retry-attempts "$READER_RETRY_ATTEMPTS"
            --evaluator-model "$EVALUATOR_MODEL"
            --evidence-composition-mode "$EVIDENCE_COMPOSITION_MODE"
            --output /tmp/longmemeval-v2-validation-runtime.json
          )
          if [[ "$SOURCE_EVIDENCE_BUNDLING" == "true" ]]; then
            args+=(--source-evidence-bundling)
          fi
          if [[ "$OFFICIAL_INCLUDE_SCREENSHOTS" == "true" ]]; then
            args+=(--include-screenshot-refs)
          fi
          if [[ "$OFFICIAL_VALIDATION_SLICE" == composition-v2* ]]; then
            args+=(--max-context-total-chars "$MAX_CONTEXT_TOTAL_CHARS")
          fi
          moon run "$VALIDATION_TASK" -- "${args[@]}"
          web_question_ids="$(jq -e -r '.question_ids_by_domain.web | select(type == "array" and length > 0) | join(",")' /tmp/longmemeval-v2-validation-runtime.json)"
          enterprise_question_ids="$(jq -e -r '.question_ids_by_domain.enterprise | select(type == "array" and length > 0) | join(",")' /tmp/longmemeval-v2-validation-runtime.json)"
          printf 'OFFICIAL_WEB_QUESTION_IDS=%s\n' "$web_question_ids" >> "$GITHUB_ENV"
          printf 'OFFICIAL_ENTERPRISE_QUESTION_IDS=%s\n' "$enterprise_question_ids" >> "$GITHUB_ENV"

      - name: Run official LongMemEval-V2 domain
        run: |
          set -euo pipefail
          domain_output="$OUTPUT_ROOT/${{ matrix.domain }}_${OFFICIAL_TIER}"
          rm -rf "$domain_output"
          mkdir -p "$domain_output"
          args=()
          if [[ -n "$OFFICIAL_LIMIT" ]]; then
            args+=(--limit "$OFFICIAL_LIMIT")
          fi
          if [[ "${{ matrix.domain }}" == "web" ]]; then
            official_question_ids="${OFFICIAL_WEB_QUESTION_IDS:-}"
          else
            official_question_ids="${OFFICIAL_ENTERPRISE_QUESTION_IDS:-}"
          fi
          if [[ "$OFFICIAL_VALIDATION_SLICE" != "none" && -z "$official_question_ids" ]]; then
            echo "::error::Frozen validation slice produced no question IDs for ${{ matrix.domain }}."
            exit 1
          fi
          if [[ -n "$official_question_ids" ]]; then
            args+=(--question-ids "$official_question_ids")
          fi
          if [[ "$OFFICIAL_INCLUDE_SCREENSHOTS" == "true" ]]; then
            args+=(--include-screenshot-refs)
          fi
          args+=(--evidence-composition-mode "$EVIDENCE_COMPOSITION_MODE")
          args+=(--retrieval-mode "$RETRIEVAL_MODE")
          args+=(--retrieval-max-planned-queries "$RETRIEVAL_MAX_PLANNED_QUERIES")
          args+=(--max-context-chars-per-item "$MAX_CONTEXT_CHARS_PER_ITEM")
          args+=(--max-context-total-chars "$MAX_CONTEXT_TOTAL_CHARS")
          args+=(--experiment-id "$EXPERIMENT_ID")
          args+=(--experiment-phase "$EXPERIMENT_PHASE")
          args+=(--pass-id "$PASS_ID")
          args+=(--pass-seed "$PASS_SEED")
          args+=(--arm-role "$ARM_ROLE")
          args+=(--substrate "$SUBSTRATE")
          args+=(--max-spend-usd "$MAX_SPEND_USD")
          args+=(--shuffle-questions-seed "$PASS_SEED")
          args+=(--operational-note-dedupe-mode "$NOTE_DEDUPE_MODE")
          args+=(--operational-note-lane-mode "$NOTE_LANE_MODE")
          args+=(--operational-note-distillation-profile "$NOTE_DISTILLATION_PROFILE")
          args+=(--typed-stream-limit "$TYPED_STREAM_LIMIT")
          args+=(--note-distillation-model "$NOTE_DISTILLATION_MODEL")
          args+=(--api-retry-attempts "$API_RETRY_ATTEMPTS")
          args+=(--prompt-build-max-workers "$PROMPT_BUILD_MAX_WORKERS")
          args+=(--require-embedding-provider local)
          args+=(--require-embedding-model sentence-transformers/all-MiniLM-L6-v2)
          if [[ "$TYPED_STREAM_RETRIEVAL" == "true" ]]; then
            args+=(--typed-stream-retrieval)
          fi
          if [[ "$NOTE_DISTILLATION" == "true" ]]; then
            args+=(--note-distillation)
          fi
          if [[ -n "$PREREGISTRATION_SHA256" ]]; then
            args+=(--preregistration-sha256 "$PREREGISTRATION_SHA256")
          fi
          if [[ "$ARM_ROLE" == "render_treatment" ]]; then
            args+=(--render-char-total-treatment)
          fi
          if [[ "$RENDER_GROUP_LANES" == "true" ]]; then
            args+=(--render-group-lanes)
          fi
          if [[ "$RENDER_ACTION_SPINES" == "true" ]]; then
            args+=(--render-action-spines)
          fi
          if [[ "$SOURCE_EVIDENCE_BUNDLING" == "true" ]]; then
            args+=(--source-evidence-bundling)
          fi
          if [[ "$MEMORY_MODE" == "save" ]]; then
            args+=(--save-memory --checkpoint-dir "$domain_output/ingest_checkpoint")
          else
            args+=(--load-memory-dir "$FROZEN_MEMORY_ROOT/${{ matrix.domain }}/memory_state")
          fi
          moon run bench-longmemeval-v2-official-full -- \
            --official-repo "$OFFICIAL_REPO_DIR" \
            --data-root "$DATA_ROOT" \
            --domain "${{ matrix.domain }}" \
            --tier "$OFFICIAL_TIER" \
            --output-dir "$domain_output" \
            --api-url http://127.0.0.1:3334/api \
            --allow-localhost \
            --reader-base-url "$READER_BASE_URL" \
            --reader-model "$READER_MODEL" \
            --reader-api-key-env "$READER_API_KEY_ENV" \
            --reader-max-concurrent-requests "$READER_MAX_CONCURRENT_REQUESTS" \
            --reader-retry-attempts "$READER_RETRY_ATTEMPTS" \
            --evaluator-model "$EVALUATOR_MODEL" \
            --evaluator-api-key-env OPENAI_API_KEY \
            "${args[@]}"
          rm -rf "$domain_output/ingest_checkpoint"

      - name: Capture service diagnostics
        if: always()
        run: |
          set +e
          telemetry="$RUNNER_TEMP/surrealdb-runtime"
          if [[ -f "$telemetry/docker-events.pid" ]]; then
            events_pid="$(cat "$telemetry/docker-events.pid")"
            if ! kill -0 "$events_pid" 2>/dev/null; then
              : > "$telemetry/docker-events.failed"
            fi
          else
            : > "$telemetry/docker-events.failed"
          fi
          if [[ -f "$telemetry/monitor.pid" ]]; then
            monitor_pid="$(cat "$telemetry/monitor.pid")"
            if kill -0 "$monitor_pid" 2>/dev/null; then
              kill "$monitor_pid" 2>/dev/null
              for _ in {1..70}; do
                kill -0 "$monitor_pid" 2>/dev/null || break
                sleep 0.1
              done
              if kill -0 "$monitor_pid" 2>/dev/null; then
                : > "$telemetry/monitor-force-killed"
                kill -KILL "$monitor_pid" 2>/dev/null
              fi
            else
              : > "$telemetry/monitor-unexpected-exit"
            fi
          else
            : > "$telemetry/monitor-unexpected-exit"
          fi
          if [[ -n "${events_pid:-}" ]]; then
            for _ in {1..20}; do
              kill -0 "$events_pid" 2>/dev/null || break
              sleep 0.1
            done
            if kill -0 "$events_pid" 2>/dev/null; then
              : > "$telemetry/docker-events-orphaned"
              kill "$events_pid" 2>/dev/null
            fi
          fi
          docker compose --env-file /dev/null ps --all \
            > /tmp/surrealdb-compose-ps.txt 2>&1
          surrealdb_id="$(docker compose --env-file /dev/null ps -q surrealdb)"
          if [[ -n "$surrealdb_id" ]]; then
            docker inspect "$surrealdb_id" > /tmp/surrealdb-inspect.json 2>&1
          fi
          docker compose --env-file /dev/null logs --no-color surrealdb \
            > /tmp/surrealdb.log 2>&1
          docker compose --env-file /dev/null --profile redis logs --no-color redis \
            > /tmp/redis.log 2>&1
          free -h > /tmp/runner-memory.txt 2>&1
          df -h > /tmp/runner-disk.txt 2>&1
          ps -eo pid,ppid,stat,%mem,rss,cmd --sort=-rss \
            > /tmp/runner-processes.txt 2>&1
          cat /proc/pressure/memory > "$telemetry/host-memory-pressure.txt" 2>&1
          sudo dmesg --ctime --color=never 2>&1 \
            | tee "$telemetry/kernel-dmesg.txt" > /dev/null
          sudo journalctl --dmesg --no-pager 2>&1 \
            | tee "$telemetry/kernel-journal.txt" > /dev/null

      - name: Gate SurrealDB runtime integrity
        if: always()
        run: |
          set -euo pipefail
          telemetry="$RUNNER_TEMP/surrealdb-runtime"
          surrealdb_id="$(cat "$telemetry/container.id")"
          tools/dev/surreal-runtime-monitor.sh gate \
            --container "$surrealdb_id" \
            --output-dir "$telemetry" \
            | tee "$telemetry/runtime-gate.log"

      - name: Freeze baseline database snapshot
        if: success() && env.MEMORY_MODE == 'save'
        run: |
          set -euo pipefail
          domain_output="$OUTPUT_ROOT/${{ matrix.domain }}_${OFFICIAL_TIER}"
          database_root="$RUNNER_TEMP/sibyl-surrealdb"
          frozen_root="$FROZEN_MEMORY_ROOT/${{ matrix.domain }}"
          snapshot="$frozen_root/surrealdb_snapshot.tar"
          memory_manifest="$domain_output/memory_state/memory_manifest.json"
          mkdir -p "$frozen_root"
          for pid_file in /tmp/sibyl-worker.pid /tmp/sibyld.pid; do
            if [[ -s "$pid_file" ]]; then
              kill -TERM "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
          pkill -TERM -f '[s]ibyld (serve|worker)' 2>/dev/null || true
          for attempt in {1..60}; do
            active=false
            for pid_file in /tmp/sibyl-worker.pid /tmp/sibyld.pid; do
              if [[ -s "$pid_file" ]] && kill -0 "$(cat "$pid_file")" 2>/dev/null; then
                active=true
              fi
            done
            if pgrep -f '[s]ibyld (serve|worker)' >/dev/null; then
              active=true
            fi
            if [[ "$active" == "false" ]]; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "::error::Sibyl services did not stop before the database snapshot."
              exit 1
            fi
            sleep 1
          done
          docker compose --env-file /dev/null --profile redis stop redis
          docker compose --env-file /dev/null stop surrealdb
          tar -C "$database_root" -cf "$snapshot" .
          snapshot_sha="$(sha256sum "$snapshot" | awk '{print $1}')"
          memory_sha="$(sha256sum "$memory_manifest" | awk '{print $1}')"
          snapshot_size="$(stat -c %s "$snapshot")"
          cp -a "$domain_output/memory_state" "$frozen_root/memory_state"
          jq -n \
            --arg domain "${{ matrix.domain }}" \
            --arg sha "$SOURCE_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg snapshot_sha "sha256:${snapshot_sha}" \
            --arg memory_sha "sha256:${memory_sha}" \
            --argjson snapshot_size "$snapshot_size" \
            '{
              schema_version: "sibyl-longmemeval-v2-database-snapshot-v1",
              domain: $domain,
              source_sha: $sha,
              builder_run_id: $run,
              snapshot_sha256: $snapshot_sha,
              snapshot_size_bytes: $snapshot_size,
              memory_manifest_sha256: $memory_sha
            }' > "$frozen_root/database_snapshot_manifest.json"

      - name: Upload frozen baseline memory
        if: success() && env.MEMORY_MODE == 'save'
        uses: actions/upload-artifact@v7
        with:
          name:
            longmemeval-v2-frozen-memory-${{ matrix.domain }}-${{
            env.SOURCE_SHA }}-${{ github.run_id }}
          path: /tmp/longmemeval-v2-frozen-memory/${{ matrix.domain }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

      - name: Upload official domain artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name:
            longmemeval-v2-${{ matrix.domain }}-${{ inputs.official_tier || 'small' }}-${{
            env.SOURCE_SHA }}-${{ github.run_id }}
          path:
            .moon/cache/evals/longmemeval-v2-official/${{ matrix.domain }}_${{ inputs.official_tier
            || 'small' }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

      - name: Upload service diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name:
            longmemeval-v2-${{ matrix.domain }}-${{ inputs.official_tier || 'small'
            }}-service-diagnostics-${{ env.SOURCE_SHA }}-${{
            github.run_id }}
          path: |
            /tmp/sibyld.log
            /tmp/sibyl-worker.log
            /tmp/surrealdb-compose-ps.txt
            /tmp/surrealdb-inspect.json
            /tmp/surrealdb.log
            /tmp/redis.log
            /tmp/runner-memory.txt
            /tmp/runner-disk.txt
            /tmp/runner-processes.txt
            ${{ runner.temp }}/surrealdb-runtime
          if-no-files-found: warn

  official-package:
    name: Official combined receipt
    if:
      github.event_name == 'workflow_dispatch' && inputs.run_official_full &&
      (inputs.official_domain || 'both') == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: official-full
    env:
      DATA_ROOT: .moon/cache/benchmarks/longmemeval-v2-official
      OFFICIAL_REPO_DIR: .moon/cache/longmemeval-v2-official
      OUTPUT_ROOT: .moon/cache/evals/longmemeval-v2-official
      SUBMISSION_ROOT: .moon/cache/evals/longmemeval-v2-submissions
      SUBMISSION_NAME: sibyl_live_api
      OPERATING_POINT_NAME: official
      OFFICIAL_TIER: ${{ inputs.official_tier || 'small' }}
      OFFICIAL_VALIDATION_SLICE: ${{ inputs.official_validation_slice || 'none' }}
      VALIDATION_MANIFEST:
        ${{ startsWith(inputs.official_validation_slice, 'composition-v2') &&
        'benchmarks/longmemeval_v2_composition_validation_v2.json' ||
        'benchmarks/longmemeval_v2_composition_validation.json' }}
      VALIDATION_TASK:
        ${{ startsWith(inputs.official_validation_slice, 'composition-v2') &&
        'bench-longmemeval-v2-validation-slice-v2' ||
        'bench-longmemeval-v2-validation-slice' }}
      OFFICIAL_DATASET_REVISION: ${{ inputs.official_dataset_revision || '' }}
      OFFICIAL_INCLUDE_SCREENSHOTS: ${{ inputs.official_include_screenshots || false }}
      SOURCE_SHA:
        ${{ fromJSON(inputs.official_ci_context_json || '{}').source_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: xiaowu0162/LongMemEval-V2
          ref: 2cc8c540bdb87fe6761629b585e727e1c4704520
          path: .moon/cache/longmemeval-v2-official
          persist-credentials: false

      - name: Setup moonrepo toolchain
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: "0.61.1"
          auto-install: true
          auto-setup: true
          cache-version: longmemeval-v2-official-v1

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-longmemeval-v2-package-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-longmemeval-v2-package-${{ runner.os }}-

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name:
            longmemeval-v2-web-${{ inputs.official_tier || 'small' }}-${{
            env.SOURCE_SHA }}-${{ github.run_id }}
          path: .moon/cache/evals/longmemeval-v2-official/web_${{ inputs.official_tier || 'small' }}

      - name: Download enterprise artifact
        uses: actions/download-artifact@v8
        with:
          name:
            longmemeval-v2-enterprise-${{ inputs.official_tier || 'small' }}-${{
            env.SOURCE_SHA }}-${{ github.run_id }}
          path:
            .moon/cache/evals/longmemeval-v2-official/enterprise_${{ inputs.official_tier || 'small'
            }}

      - name: Fetch LongMemEval-V2 dataset metadata
        run: |
          set -euo pipefail
          args=(--data-root "$DATA_ROOT")
          if [[ -n "$OFFICIAL_DATASET_REVISION" ]]; then
            args+=(--revision "$OFFICIAL_DATASET_REVISION")
          fi
          if [[ "$OFFICIAL_INCLUDE_SCREENSHOTS" == "true" ]]; then
            args+=(--include-trajectory-screenshots)
          fi
          moon run bench-longmemeval-v2-download -- "${args[@]}"

      - name: Evaluate validation evidence
        if: inputs.official_validation_slice != 'none'
        run: |
          args=(
            evaluate \
            --manifest "$VALIDATION_MANIFEST" \
            --run "web=$OUTPUT_ROOT/web_${OFFICIAL_TIER}" \
            --run "enterprise=$OUTPUT_ROOT/enterprise_${OFFICIAL_TIER}" \
            --output "$OUTPUT_ROOT/composition_validation_report.json"
          )
          if [[ "$OFFICIAL_VALIDATION_SLICE" == composition-v2* ]]; then
            args+=(--questions "$DATA_ROOT/questions.jsonl")
          fi
          if [[ "$OFFICIAL_VALIDATION_SLICE" == "composition-v2-developmental-accurate" ]]; then
            args+=(--developmental-replay)
          fi
          moon run "$VALIDATION_TASK" -- "${args[@]}"

      - name: Upload frozen validation report
        if: always() && inputs.official_validation_slice != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: longmemeval-v2-composition-validation-${{ github.sha }}
          path: .moon/cache/evals/longmemeval-v2-official/composition_validation_report.json
          if-no-files-found: error

      - name: Build official submission package and receipt
        if: inputs.official_validation_slice == 'none'
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          cat > "$OUTPUT_ROOT/SYSTEM_DESCRIPTION.md" <<'EOF'
          Sibyl live API memory backend for LongMemEval-V2. The memory adapter
          writes trajectory chunks into Sibyl and queries Sibyl search for
          context before the fixed official reader answers each question.
          EOF

          python "$OFFICIAL_REPO_DIR/leaderboard/build_submission_step_1_single_operating_point.py" \
            "$OUTPUT_ROOT/web_${OFFICIAL_TIER}" \
            "$OUTPUT_ROOT/enterprise_${OFFICIAL_TIER}" \
            "$SUBMISSION_NAME" \
            "$OPERATING_POINT_NAME" \
            "$OFFICIAL_TIER" \
            --method sibyl_live_api \
            --output-root "$SUBMISSION_ROOT" \
            --force

          python "$OFFICIAL_REPO_DIR/leaderboard/build_submission_step_2_build_package.py" \
            "$SUBMISSION_NAME" \
            "$OUTPUT_ROOT/SYSTEM_DESCRIPTION.md" \
            benchmarks/longmemeval_v2_memory/sibyl_memory.py \
            "$SUBMISSION_ROOT/$SUBMISSION_NAME/operating_points/$OPERATING_POINT_NAME" \
            --output-root "$SUBMISSION_ROOT" \
            --force

          mkdir -p "$OUTPUT_ROOT/combined_${OFFICIAL_TIER}"
          python "$OFFICIAL_REPO_DIR/leaderboard/combine_aggregated_metrics.py" \
            "$OUTPUT_ROOT/web_${OFFICIAL_TIER}/aggregated_metrics.json" \
            "$OUTPUT_ROOT/enterprise_${OFFICIAL_TIER}/aggregated_metrics.json" \
            -o "$OUTPUT_ROOT/combined_${OFFICIAL_TIER}/aggregated_metrics.json"

          moon run bench-longmemeval-v2-official -- \
            --official-repo "$OFFICIAL_REPO_DIR" \
            --data-root "$DATA_ROOT" \
            --domain combined \
            --tier "$OFFICIAL_TIER" \
            --output-dir "$OUTPUT_ROOT/combined_${OFFICIAL_TIER}" \
            --receipt-only \
            --metric-overview "$SUBMISSION_ROOT/$SUBMISSION_NAME/operating_points/$OPERATING_POINT_NAME/metric_overview.json" \
            --combined-metrics "$OUTPUT_ROOT/combined_${OFFICIAL_TIER}/aggregated_metrics.json" \
            --submission-overview "$SUBMISSION_ROOT/$SUBMISSION_NAME/submission_overview.json" \
            --submission-archive "$SUBMISSION_ROOT/$SUBMISSION_NAME.tar.gz" \
            --web-output-dir "$OUTPUT_ROOT/web_${OFFICIAL_TIER}" \
            --enterprise-output-dir "$OUTPUT_ROOT/enterprise_${OFFICIAL_TIER}" \
            --receipt-output "$OUTPUT_ROOT/longmemeval_v2_${OFFICIAL_TIER}_receipt.json"

          moon run bench-gate -- \
            "$OUTPUT_ROOT/longmemeval_v2_${OFFICIAL_TIER}_receipt.json" \
            --profile longmemeval-v2

          moon run longmemeval-v2-artifact-bridge -- \
            arm \
            --official-receipt \
            "$OUTPUT_ROOT/longmemeval_v2_${OFFICIAL_TIER}_receipt.json" \
            --output "$OUTPUT_ROOT/arm_run.json"

      - name: Upload official combined receipt
        if: inputs.official_validation_slice == 'none'
        uses: actions/upload-artifact@v7
        with:
          name:
            longmemeval-v2-combined-${{ inputs.official_tier || 'small' }}-${{
            env.SOURCE_SHA }}-${{ github.run_id }}
          path: |
            .moon/cache/evals/longmemeval-v2-official/longmemeval_v2_${{ inputs.official_tier || 'small' }}_receipt.json
            .moon/cache/evals/longmemeval-v2-official/arm_run.json
            .moon/cache/evals/longmemeval-v2-official/combined_${{ inputs.official_tier || 'small' }}/aggregated_metrics.json
            .moon/cache/evals/longmemeval-v2-official/composition_validation_report.json
            .moon/cache/evals/longmemeval-v2-submissions/sibyl_live_api.tar.gz
            .moon/cache/evals/longmemeval-v2-submissions/sibyl_live_api/submission_overview.json
            .moon/cache/evals/longmemeval-v2-submissions/sibyl_live_api/operating_points/official/metric_overview.json
          if-no-files-found: error
