apiVersion: v2
name: sibyl-surrealdb
description: Sibyl-owned SurrealDB wrapper with backup and restore operations
type: application
version: 1.4.9
appVersion: "3.2.4"
# The restore drill runs its scratch SurrealDB as a native sidecar (an init
# container with restartPolicy Always, on by default from 1.29), and the
# export Job's podFailurePolicy needs 1.26. The -0 admits provider version
# suffixes such as v1.29.3-eks-....
kubeVersion: ">=1.29.0-0"
keywords:
  - surrealdb
  - backup
  - restore
  - sibyl
home: https://github.com/hyperb1iss/sibyl
sources:
  - https://github.com/hyperb1iss/sibyl
maintainers:
  - name: hyperb1iss
    url: https://github.com/hyperb1iss
dependencies:
  - name: surrealdb
    version: 0.5.0
    repository: https://helm.surrealdb.com
