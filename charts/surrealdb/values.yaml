# Sibyl SurrealDB wrapper values.
# The upstream chart is pinned and configured for a single RocksDB-backed pod.

global:
  imagePullSecrets: []

surrealdb:
  replicaCount: 1
  image:
    tag: v3.2.3
  args:
    - start
  surrealdb:
    path: rocksdb:/data/db
    unauthenticated: false
  strategy:
    type: Recreate
  # RocksDB can still be flushing at SIGTERM; the default 30s kubelet grace
  # period risks losing the tail of a compaction on node drains.
  terminationGracePeriodSeconds: 120
  persistence:
    enabled: true
    # Empty uses the cluster default storage class; premium block storage
    # recommended for RocksDB.
    storageClassName: ""
    size: 100Gi
  podExtraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: ""
    - name: OTEL_SERVICE_NAME
      value: sibyl-surrealdb

# opsImage runs the operational jobs (strict bootstrap, export, restore
# drill). The official surrealdb image is distroless (no shell since v2),
# so anything that needs sh, curl, or jq runs here and talks to SurrealDB
# over its HTTP API instead of the CLI. alpine/k8s matches the snapshot
# job's kubectl image, so one utility image serves the whole ops surface.
opsImage:
  repository: alpine/k8s
  tag: "1.34.1"
  pullPolicy: IfNotPresent

connection:
  # Defaults to http://<upstream-surrealdb-service>:8000 when empty.
  # The ops jobs call the HTTP API, so this must be an http(s) URL,
  # not ws(s).
  endpoint: ""
  scheme: http
  authLevel: root
  username: root
  existingSecret: ""
  usernameKey: username
  passwordKey: password

databases:
  - namespace: sibyl_auth
    database: auth
  - namespace: sibyl_content
    database: content

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

jobDefaults:
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources: {}

bootstrap:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  annotations: {}

snapshot:
  enabled: false
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  # alpine/k8s rather than bitnami/kubectl: Docker Hub's bitnami catalog purge
  # removed versioned tags, and the snapshot script needs a shell plus awk,
  # which distroless kubectl images do not carry.
  kubectlImage:
    repository: alpine/k8s
    tag: "1.34.1"
    pullPolicy: IfNotPresent
  persistentVolumeClaimName: ""
  volumeSnapshotClassName: ""
  quiesceDelaySeconds: 10
  retention:
    enabled: true
    keep: 7

export:
  enabled: false
  schedule: "30 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  destination:
    # Local staging path. Deployment overlays can mount blob/object storage here.
    path: /backups
    # Informational URI for overlays that sync to object/blob storage.
    uri: ""
  filePrefix: sibyl
  encryption:
    enabled: false
    command: ""
  syncCommand: ""
  extraEnv: []
  extraEnvFrom: []
  extraVolumeMounts: []
  extraVolumes: []
  workspace:
    emptyDir: true

restoreDrill:
  enabled: false
  schedule: "0 4 * * 0"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  source:
    path: /backups
  restore:
    endpoint: http://127.0.0.1:8000
    username: drill
    password: drill
    path: memory
  # The scratch server runs as its own sidecar container, so a restore
  # path that lives on a volume (anything other than "memory" or a
  # path under /tmp) needs its mount declared here as well; the
  # drill-container extraVolumeMounts below do not reach the sidecar.
  server:
    extraVolumeMounts: []
  receipt:
    path: /tmp/restore-drill-receipt.json
  recallCheck:
    enabled: false
    command: ""
  fixtureChecks:
    - namespace: sibyl_auth
      database: auth
      table: users
      minRows: 1
  failureNotification:
    command: ""
  extraEnv: []
  extraEnvFrom: []
  extraVolumeMounts: []
  extraVolumes: []
  workspace:
    emptyDir: true
