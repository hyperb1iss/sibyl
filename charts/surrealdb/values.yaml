# Sibyl SurrealDB wrapper values.
# The upstream chart is pinned and configured for a single RocksDB-backed pod.

global:
  imagePullSecrets: []

surrealdb:
  replicaCount: 1
  image:
    tag: v3.2.4
  args:
    - start
  surrealdb:
    path: rocksdb:/data/db
    unauthenticated: false
  strategy:
    type: Recreate
  # RocksDB can still be flushing at SIGTERM; the default 30s kubelet grace
  # period risks losing the tail of a compaction on node drains.
  terminationGracePeriodSeconds: 120
  persistence:
    enabled: true
    # Empty uses the cluster default storage class; premium block storage
    # recommended for RocksDB.
    storageClassName: ""
    size: 100Gi
  podExtraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: ""
    - name: OTEL_SERVICE_NAME
      value: sibyl-surrealdb

# opsImage runs the operational jobs (strict bootstrap, export, restore
# drill). The official surrealdb image is distroless (no shell since v2),
# so anything that needs sh, curl, or jq runs here and talks to SurrealDB
# over its HTTP API instead of the CLI. alpine/k8s matches the snapshot
# job's kubectl image, so one utility image serves the whole ops surface.
opsImage:
  repository: alpine/k8s
  tag: "1.34.1"
  pullPolicy: IfNotPresent

connection:
  # Defaults to http://<upstream-surrealdb-service>:8000 when empty.
  # The ops jobs call the HTTP API, so this must be an http(s) URL,
  # not ws(s).
  endpoint: ""
  scheme: http
  authLevel: root
  username: root
  existingSecret: ""
  usernameKey: username
  passwordKey: password

# Databases the strict-bootstrap Job defines as STRICT. The export does
# not limit itself to this list: it discovers every namespace and database
# on the server at run time, including each org's graph namespace
# (org_<uuid>), which Sibyl creates as orgs appear. It does require every
# entry here to exist, so an empty or wrong server fails the export
# instead of producing an empty backup, and the restore drill requires
# them in the manifest and restores them STRICT.
databases:
  - namespace: sibyl_auth
    database: auth
  - namespace: sibyl_content
    database: content

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

jobDefaults:
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources: {}
  # Every request the export and drill make is bounded, so a hung server
  # cannot hold a Job (and, under concurrencyPolicy Forbid, every later
  # run). maxTimeSeconds covers the longest single /export or /import.
  http:
    connectTimeoutSeconds: 10
    maxTimeSeconds: 3600

bootstrap:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  annotations: {}

snapshot:
  enabled: false
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  # alpine/k8s rather than bitnami/kubectl: Docker Hub's bitnami catalog purge
  # removed versioned tags, and the snapshot script needs a shell plus awk,
  # which distroless kubectl images do not carry.
  kubectlImage:
    repository: alpine/k8s
    tag: "1.34.1"
    pullPolicy: IfNotPresent
  persistentVolumeClaimName: ""
  volumeSnapshotClassName: ""
  quiesceDelaySeconds: 10
  retention:
    enabled: true
    keep: 7

export:
  enabled: false
  schedule: "30 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  # Retries rerun the whole export into a new run directory. A run whose
  # recorded failures are all deterministic (names the SurrealDB headers
  # cannot carry) exits 111 and is not retried (podFailurePolicy): it would
  # fail the same way again. Any transient failure exits 1 and is retried.
  backoffLimit: 2
  # Kill a run that has not finished in 6 hours, well before the next
  # daily schedule.
  activeDeadlineSeconds: 21600
  destination:
    # Local staging path. Deployment overlays can mount blob/object storage here.
    path: /backups
    # Where syncCommand copies runs, such as s3://bucket/prefix. Exposed
    # as $SIBYL_EXPORT_DESTINATION_URI to syncCommand and to the restore
    # drill's fetchCommand.
    uri: ""
  # Each run writes <destination.path>/<filePrefix>-<UTC timestamp>/ with
  # one <namespace>.<database>.surql per database and a manifest.json
  # written last; the restore drill reads the newest directory that has
  # one. The manifest's sizes and sha256 describe the plaintext. A run
  # that fails before its manifest removes its directory, and directories
  # without a manifest older than a day are pruned. Letters, digits, "_"
  # and "-" only, so runs match <filePrefix>-<14 digits> exactly.
  #
  # Upgrading from 1.4.9 or earlier: exports used to be flat files,
  # <filePrefix>-<namespace>-<database>-<timestamp>.surql, directly under
  # destination.path. Point retention and sync scripts at the run
  # directories instead; the drill ignores the old flat files, so take one
  # new export before the first drill after upgrading.
  filePrefix: sibyl
  encryption:
    enabled: false
    # Runs in its own `sh -ec` once per file, manifest last. It reads
    # $SIBYL_EXPORT_FILE (a plaintext copy in scratch space, never in the
    # destination) and writes the ciphertext to
    # $SIBYL_EXPORT_ENCRYPTED_FILE; the job then moves the ciphertext to
    # the file's final name, so names never change. Writing nothing, or
    # the plaintext unchanged, fails the export. Example:
    #   age -r "$AGE_RECIPIENT" -o "$SIBYL_EXPORT_ENCRYPTED_FILE" "$SIBYL_EXPORT_FILE"
    #
    # Upgrading from 1.4.9 or earlier: the command used to encrypt
    # $SIBYL_EXPORT_FILE however it liked, for example
    #   age -r "$AGE_RECIPIENT" -o "$SIBYL_EXPORT_FILE.age" "$SIBYL_EXPORT_FILE" && rm "$SIBYL_EXPORT_FILE"
    # That form now fails every export ("wrote nothing to
    # $SIBYL_EXPORT_ENCRYPTED_FILE"), so rewrite it to the example above
    # before upgrading.
    command: ""
  # Runs once after the manifest, with the run directory in
  # $SIBYL_EXPORT_RUN_DIR. Upload the manifest last so a reader never sees
  # a manifest before its files (see docs/admin/backup-restore.md).
  syncCommand: ""
  extraEnv: []
  extraEnvFrom: []
  extraVolumeMounts: []
  extraVolumes: []
  workspace:
    emptyDir: true
  # Lists, in the manifest's `organizations.without_graph`, organizations
  # in the auth database that have no graph database at export time. It
  # never fails the run: a new organization has no graph until it first
  # uses it. An organization whose graph was lost shows up here too. Match
  # Sibyl's SIBYL_SURREAL_NAMESPACE_PREFIX and SIBYL_SURREAL_DATABASE.
  organizationCheck:
    authNamespace: sibyl_auth
    authDatabase: auth
    graphNamespacePrefix: org_
    graphDatabase: graph

restoreDrill:
  enabled: false
  schedule: "0 4 * * 0"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  # Every failed attempt runs failureNotification, so the default is a
  # single attempt: one failing drill, one page.
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  source:
    path: /backups
  # Runs in its own `sh -ec` before the drill picks a run, with
  # $SIBYL_RESTORE_SOURCE_PATH, $SIBYL_EXPORT_DESTINATION_URI and
  # $SIBYL_EXPORT_FILE_PREFIX set. Use it to download the newest run whose
  # manifest.json exists into the source path, files before manifest.
  fetchCommand: ""
  decryption:
    enabled: false
    # Runs in its own `sh -ec` once per file, manifest first. It reads
    # $SIBYL_RESTORE_ENCRYPTED_FILE (never modified) and writes the
    # plaintext to $SIBYL_RESTORE_FILE, which the drill then checks against
    # the manifest's plaintext sha256. Example:
    #   age -d -i /secrets/age/key.txt -o "$SIBYL_RESTORE_FILE" "$SIBYL_RESTORE_ENCRYPTED_FILE"
    command: ""
  # Fail when the newest complete export is older than this, so a stalled
  # export pipeline pages instead of the drill passing on old data. Exports
  # run daily by default; 36 allows one late run. 0 disables the check.
  maxExportAgeHours: 36
  # The export counts each table just before and just after it streams,
  # and its snapshot lies between the two. Per table, a restore may fall
  # short of the lower count by max(rows, percent% of that count); any
  # larger shortfall, a missing table, or a table restored empty although
  # both counts saw rows fails the drill.
  rowDrift:
    rows: 2
    percent: 1
  restore:
    endpoint: http://127.0.0.1:8000
    username: drill
    password: drill
    # The drill restores every namespace, so the scratch server holds a
    # full copy of the data. RocksDB on the pod's /tmp emptyDir keeps it
    # on node disk rather than in memory; "memory" suits small datasets.
    path: rocksdb:/tmp/restore-db
  # The scratch server runs as its own sidecar container, so a restore
  # path that lives on a volume (anything other than "memory" or a
  # path under /tmp) needs its mount declared here as well; the
  # drill-container extraVolumeMounts below do not reach the sidecar.
  server:
    extraVolumeMounts: []
  receipt:
    path: /tmp/restore-drill-receipt.json
  recallCheck:
    enabled: false
    command: ""
  fixtureChecks:
    - namespace: sibyl_auth
      database: auth
      table: users
      minRows: 1
  failureNotification:
    command: ""
  extraEnv: []
  extraEnvFrom: []
  extraVolumeMounts: []
  extraVolumes: []
  workspace:
    emptyDir: true
