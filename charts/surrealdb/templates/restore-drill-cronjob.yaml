{{- if .Values.restoreDrill.enabled -}}
{{- include "sibyl-surrealdb.validateDatabases" . -}}
{{- include "sibyl-surrealdb.validateOps" . -}}
{{- if and .Values.restoreDrill.recallCheck.enabled (not .Values.restoreDrill.recallCheck.command) -}}
{{- fail "restoreDrill.recallCheck.command is required when restoreDrill.recallCheck.enabled=true" -}}
{{- end -}}
{{- if and .Values.restoreDrill.decryption.enabled (not .Values.restoreDrill.decryption.command) -}}
{{- fail "restoreDrill.decryption.command is required when restoreDrill.decryption.enabled=true" -}}
{{- end -}}
{{- if not (regexMatch "^[0-9]+$" (toString .Values.restoreDrill.maxExportAgeHours)) -}}
{{- fail (printf "restoreDrill.maxExportAgeHours must be a whole number of hours (0 disables the check), got %q" (toString .Values.restoreDrill.maxExportAgeHours)) -}}
{{- end -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sibyl-surrealdb.fullname" . }}-restore-drill
  labels:
    {{- include "sibyl-surrealdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: restore-drill
spec:
  schedule: {{ .Values.restoreDrill.schedule | quote }}
  concurrencyPolicy: {{ .Values.restoreDrill.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.restoreDrill.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.restoreDrill.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ .Values.restoreDrill.startingDeadlineSeconds }}
  jobTemplate:
    spec:
      # Every failed attempt pages through failureNotification, so retries
      # default to none; a drill failure wants a person, not a loop.
      backoffLimit: {{ .Values.restoreDrill.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.restoreDrill.activeDeadlineSeconds }}
      # A drill pod lost to a drain or eviction is replaced, not counted as a
      # failed drill, so a node rotation does not page.
      podFailurePolicy:
        rules:
          # status is required by the API server before 1.34.
          - action: Ignore
            onPodConditions:
              - type: DisruptionTarget
                status: "True"
      template:
        metadata:
          labels:
            {{- include "sibyl-surrealdb.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: restore-drill
          {{- with .Values.jobDefaults.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          # Never, not OnFailure: a container-level restart would leave
          # the scratch-server sidecar alive with the previous attempt's
          # imported state, and a drill that validates leftovers proves
          # nothing. A fresh Pod per retry means a fresh scratch server.
          restartPolicy: Never
          serviceAccountName: {{ include "sibyl-surrealdb.serviceAccountName" . }}
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.jobDefaults.podSecurityContext | nindent 12 }}
          # The scratch server is the one job the surreal binary can still
          # do without a shell: it runs as a native sidecar with its plain
          # entrypoint, and the drill logic talks to it over HTTP from the
          # ops image. The kubelet reaps the sidecar when the drill exits.
          initContainers:
            - name: restore-server
              image: {{ include "sibyl-surrealdb.surrealImage" . | quote }}
              imagePullPolicy: {{ .Values.surrealdb.image.pullPolicy | default "IfNotPresent" }}
              restartPolicy: Always
              securityContext:
                {{- toYaml .Values.jobDefaults.securityContext | nindent 16 }}
                runAsUser: 65532
                runAsGroup: 65532
              # No command override: the distroless image has no $PATH, so
              # the surreal binary is reachable only as the entrypoint.
              args:
                - start
                - --user
                - $(SURREAL_RESTORE_USER)
                - --pass
                - $(SURREAL_RESTORE_PASS)
                - $(SURREAL_RESTORE_PATH)
              env:
                - name: SURREAL_RESTORE_USER
                  value: {{ .Values.restoreDrill.restore.username | quote }}
                - name: SURREAL_RESTORE_PASS
                  value: {{ .Values.restoreDrill.restore.password | quote }}
                - name: SURREAL_RESTORE_PATH
                  value: {{ .Values.restoreDrill.restore.path | quote }}
              resources:
                {{- toYaml .Values.jobDefaults.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                {{- with .Values.restoreDrill.server.extraVolumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          containers:
            - name: restore-drill
              image: {{ include "sibyl-surrealdb.opsImage" . | quote }}
              imagePullPolicy: {{ .Values.opsImage.pullPolicy | default "IfNotPresent" }}
              workingDir: /tmp
              securityContext:
                {{- toYaml .Values.jobDefaults.securityContext | nindent 16 }}
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  notify_failure() {
                    {{- if .Values.restoreDrill.failureNotification.command }}
                    {{ .Values.restoreDrill.failureNotification.command | replace "$" "$$" | nindent 20 }}
                    {{- else }}
                    return 0
                    {{- end }}
                  }
                  # EXIT, not ERR: busybox ash skips an ERR trap on an
                  # explicit `exit 1` and on failures inside functions,
                  # which are exactly the drill's validation failures.
                  # Decrypted scratch copies go with it either way.
                  on_exit() {
                    status=$?
                    trap - EXIT
                    if [ -n "${work:-}" ]; then
                      rm -rf "$work"
                    fi
                    if [ "$status" -ne 0 ]; then
                      notify_failure || echo "restore drill failure notification failed" >&2
                    fi
                    exit "$status"
                  }
                  trap on_exit EXIT
                  table_rows='RETURN object::keys((INFO FOR DB).tables).map(|$t| { table: $t, rows: (SELECT count() FROM type::table($t) GROUP ALL)[0].count ?? 0 });'
                  # header_safe mirrors the export. ident quotes any name
                  # for SurrealQL, escaping backslashes and backticks.
                  jq_defs='def header_safe: type == "string" and test("^[ -~]+$") and (test("^ | $") | not);
                    def ident: "`" + (gsub("\\\\"; "\\\\") | gsub("`"; "\\`")) + "`";'
                  work="$(mktemp -d)"
                  # Bounded requests, as in the export.
                  http() {
                    curl --connect-timeout "$SIBYL_HTTP_CONNECT_TIMEOUT" \
                      --max-time "$SIBYL_HTTP_MAX_TIME" "$@"
                  }
                  # Same gate as the export: /sql answers HTTP 200 with a
                  # status per statement. Prints the last statement's result.
                  restore_sql() {
                    scope_ns="$1"
                    scope_db="$2"
                    statement="$3"
                    set -- -sS -u "$SURREAL_RESTORE_USER:$SURREAL_RESTORE_PASS" \
                      -H "Accept: application/json" -H "Content-Type: text/plain"
                    if [ -n "$scope_ns" ]; then set -- "$@" -H "surreal-ns: $scope_ns"; fi
                    if [ -n "$scope_db" ]; then set -- "$@" -H "surreal-db: $scope_db"; fi
                    response="$(http "$@" --data-binary "$statement" "$SURREAL_RESTORE_ENDPOINT/sql")" || exit 1
                    if ! printf '%s\n' "$response" \
                      | jq -e 'type == "array" and length > 0 and all(.[]; .status == "OK")' >/dev/null 2>&1; then
                      printf 'SurrealQL failed in %s/%s: %s\n%s\n' \
                        "${scope_ns:-(root)}" "${scope_db:-(namespace)}" "$statement" "$response" >&2
                      exit 1
                    fi
                    printf '%s\n' "$response" | jq -c '.[-1].result'
                  }
                  # Hooks run in their own `sh -ec`, so a failing step inside
                  # one fails the hook, and an `exit` in it cannot end the
                  # drill early.
                  decrypt_restore_file() {
                    SIBYL_RESTORE_ENCRYPTED_FILE="$1" SIBYL_RESTORE_FILE="$2" \
                      sh -ec "$SIBYL_RESTORE_DECRYPTION_COMMAND"
                  }
                  if [ -n "${SIBYL_RESTORE_FETCH_COMMAND:-}" ]; then
                    mkdir -p "$SIBYL_RESTORE_SOURCE_PATH"
                    echo "fetching exports from ${SIBYL_EXPORT_DESTINATION_URI:-(no destination URI)}"
                    sh -ec "$SIBYL_RESTORE_FETCH_COMMAND"
                  fi
                  ready=""
                  for _ in $(seq 1 30); do
                    if http -fsS "$SURREAL_RESTORE_ENDPOINT/health" >/dev/null 2>&1; then
                      ready=1
                      break
                    fi
                    sleep 2
                  done
                  if [ -z "$ready" ]; then
                    echo "restore server never became healthy at $SURREAL_RESTORE_ENDPOINT" >&2
                    exit 1
                  fi
                  # Only exact <filePrefix>-<14 digits> directories are runs,
                  # so a sibling prefix such as sibyl-staging never matches.
                  # The export writes manifest.json last, so a run without
                  # one is incomplete. The glob sorts by the UTC timestamp in
                  # the name; the last complete match wins.
                  manifest=""
                  for candidate in "$SIBYL_RESTORE_SOURCE_PATH/$SIBYL_EXPORT_FILE_PREFIX"-*; do
                    stamp="${candidate##*/}"
                    stamp="${stamp#"$SIBYL_EXPORT_FILE_PREFIX"-}"
                    case "$stamp" in
                      [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
                      *) continue ;;
                    esac
                    if [ -f "$candidate/manifest.json" ]; then
                      manifest="$candidate/manifest.json"
                    elif [ -d "$candidate" ]; then
                      echo "skipping incomplete run ${candidate##*/} (no manifest.json)"
                    fi
                  done
                  if [ -z "$manifest" ]; then
                    echo "no complete export under $SIBYL_RESTORE_SOURCE_PATH (a run directory needs its manifest.json)" >&2
                    exit 1
                  fi
                  run_dir="$(dirname "$manifest")"
                  # Decrypted copies go to scratch space: the source may be
                  # the backup store itself, and it is never modified.
                  manifest_doc="$manifest"
                  decrypted=false
                  if [ -n "${SIBYL_RESTORE_DECRYPTION_COMMAND:-}" ]; then
                    decrypted=true
                    manifest_doc="$work/manifest.json"
                    decrypt_restore_file "$manifest" "$manifest_doc"
                  fi
                  if ! jq -e 'type == "object"' "$manifest_doc" >/dev/null 2>&1; then
                    echo "manifest $manifest is not JSON; encrypted exports need restoreDrill.decryption" >&2
                    exit 1
                  fi
                  # Names reach HTTP headers and SurrealQL, and files reach
                  # paths: names must be header-safe and every file a plain,
                  # distinct name inside the run directory.
                  if ! jq -e "$jq_defs"'
                      (.databases | type == "array" and length > 0)
                      and all(.databases[];
                        (.namespace | header_safe) and (.database | header_safe)
                        and (.file | type == "string" and test("^[A-Za-z0-9_][A-Za-z0-9_.]*[.]surql$")))
                      and ([.databases[].file] | length == (unique | length))' \
                      "$manifest_doc" >/dev/null; then
                    echo "manifest $manifest lists no databases, an unsafe name, or an unsafe or repeated file" >&2
                    exit 1
                  fi
                  # A manifest without the bootstrap databases is not a Sibyl
                  # backup, whatever else it holds.
                  missing="$(jq -r --argjson required "$SIBYL_RESTORE_REQUIRED_DATABASES" \
                    '$required - [.databases[] | {namespace, database}] | map("\(.namespace)/\(.database)") | join(", ")' \
                    "$manifest_doc")"
                  if [ -n "$missing" ]; then
                    echo "manifest $manifest is missing required databases: $missing" >&2
                    exit 1
                  fi
                  # A stalled export pipeline must page, not leave the drill
                  # passing on the last run that happened to complete.
                  created_at="$(jq -r '.created_at' "$manifest_doc")"
                  created_epoch="$(jq -r '.created_at | fromdateiso8601' "$manifest_doc")"
                  age_seconds=$(( $(date -u +%s) - created_epoch ))
                  max_age_hours="$SIBYL_RESTORE_MAX_EXPORT_AGE_HOURS"
                  if [ "$max_age_hours" -gt 0 ] && [ "$age_seconds" -gt $((max_age_hours * 3600)) ]; then
                    echo "newest complete export $manifest was created $created_at, $((age_seconds / 3600))h ago; restoreDrill.maxExportAgeHours is $max_age_hours" >&2
                    exit 1
                  fi
                  echo "restoring $(jq '.databases | length' "$manifest_doc") databases from $manifest (created $created_at, $((age_seconds / 3600))h ago)"
                  : > "$work/databases.jsonl"
                  database_count="$(jq '.databases | length' "$manifest_doc")"
                  index=0
                  while [ "$index" -lt "$database_count" ]; do
                    expected="$(jq -c --argjson index "$index" '.databases[$index]' "$manifest_doc")"
                    index=$((index + 1))
                    namespace="$(printf '%s\n' "$expected" | jq -r '.namespace')"
                    database="$(printf '%s\n' "$expected" | jq -r '.database')"
                    stored="$run_dir/$(printf '%s\n' "$expected" | jq -r '.file')"
                    file="$stored"
                    problem=""
                    restored='[]'
                    if [ ! -f "$stored" ]; then
                      problem="export file $stored is missing"
                    elif [ "$decrypted" = true ]; then
                      file="$work/${stored##*/}"
                      if ! decrypt_restore_file "$stored" "$file"; then
                        problem="decryption failed for $stored"
                      fi
                    fi
                    # Checksums describe the plaintext, so this also catches
                    # a decrypt step that returns the wrong bytes.
                    if [ -n "$problem" ]; then
                      :
                    elif [ "$(wc -c < "$file" | tr -d ' ')" != "$(printf '%s\n' "$expected" | jq -r '.bytes')" ] \
                      || [ "$(sha256sum "$file" | cut -d ' ' -f 1)" != "$(printf '%s\n' "$expected" | jq -r '.sha256')" ]; then
                      problem="export file $stored does not match the manifest's size and sha256 after decryption"
                      if [ "$decrypted" = false ]; then
                        problem="export file $stored does not match the manifest's size and sha256"
                      fi
                    else
                      # Export files assume their namespace and database
                      # exist, and 3.x does not create them over HTTP. The
                      # bootstrap databases are STRICT in production, so they
                      # are restored STRICT here too.
                      preamble="$(printf '%s\n' "$expected" | jq -r --argjson required "$SIBYL_RESTORE_REQUIRED_DATABASES" "$jq_defs"'
                        . as $entry
                        | ([$required[] | select(.namespace == $entry.namespace and .database == $entry.database)] | length > 0) as $strict
                        | "DEFINE NAMESPACE IF NOT EXISTS \(.namespace | ident); USE NS \(.namespace | ident); DEFINE DATABASE IF NOT EXISTS \(.database | ident)\(if $strict then " STRICT" else "" end);"')"
                      restore_sql "" "" "$preamble" >/dev/null
                      # -T streams the file instead of loading it into memory.
                      import_response="$(http -sS -X POST -T "$file" \
                        -u "$SURREAL_RESTORE_USER:$SURREAL_RESTORE_PASS" \
                        -H "Accept: application/json" \
                        -H "Content-Type: text/plain" \
                        -H "surreal-ns: $namespace" \
                        -H "surreal-db: $database" \
                        "$SURREAL_RESTORE_ENDPOINT/import")"
                      if printf '%s\n' "$import_response" \
                        | jq -e 'type == "array" and all(.[]; .status == "OK")' >/dev/null 2>&1; then
                        restored="$(restore_sql "$namespace" "$database" "$table_rows")"
                      else
                        problem="import failed: $(printf '%s' "$import_response" | head -c 2000)"
                      fi
                    fi
                    if [ "$decrypted" = true ]; then
                      rm -f "$file"
                    fi
                    # The export counts each table just before and just after
                    # it streams, and its snapshot lies between the two. A
                    # table is judged against the lower count, with a small
                    # allowance per table, never pooled, so one emptied table
                    # cannot hide behind others. A table restored empty fails
                    # when both counts saw rows: a table that emptied during
                    # the export window (an expired session, a released lease)
                    # does not page. Manifests without the second count fall
                    # back to the first.
                    printf '%s\n' "$expected" | jq -c \
                      --argjson restored "$restored" \
                      --arg problem "$problem" \
                      --argjson drift_rows "$SIBYL_RESTORE_ROW_DRIFT_ROWS" \
                      --argjson drift_percent "$SIBYL_RESTORE_ROW_DRIFT_PERCENT" '
                      ($restored | map({key: .table, value: .rows}) | from_entries) as $imported
                      | (.tables_after // null) as $post
                      | {namespace, database, file, bytes, sha256,
                         rows_exported: .rows,
                         rows_exported_after: (.rows_after // null),
                         rows_restored: ($restored | map(.rows) | add // 0),
                         tables: (.tables | with_entries(.value = {
                           exported: .value,
                           exported_after: (if $post == null then null else $post[.key] end),
                           restored: $imported[.key]}))}
                      | ([.tables | to_entries[] | .key as $table
                          | select(.value.restored == null and ($post == null or ($post | has($table))))
                          | $table]) as $missing
                      | ([.tables | to_entries[] | select(.value.restored != null)
                          | .value as $counts
                          | ($counts.exported_after // $counts.exported) as $after_export
                          | ([$counts.exported, $after_export] | min) as $low
                          | ([$drift_rows, ($low * $drift_percent / 100 | ceil)] | max) as $allowed
                          | if $counts.exported > 0 and $after_export > 0 and $counts.restored == 0
                            then "\(.key) (0 of \($counts.exported)\(if $counts.exported_after == null then "" else ", \($after_export) after export" end), emptied)"
                            elif $low - $counts.restored > $allowed
                            then "\(.key) (\($counts.restored) of \($low), allowed shortfall \($allowed))"
                            else empty end]) as $short
                      | .problem = (
                          if $problem != "" then $problem
                          elif ($missing | length) > 0 then "tables missing after import: \($missing | join(", "))"
                          elif ($short | length) > 0 then "tables short after import: \($short | join(", "))"
                          else null end)
                      | .status = (if .problem == null then "PASS" else "FAIL" end)
                      | if .problem == null then del(.problem) else . end' \
                      >> "$work/databases.jsonl"
                  done
                  failures="$(jq -r 'select(.status == "FAIL") | "restore failed for \(.namespace)/\(.database): \(.problem)"' "$work/databases.jsonl")"
                  # Databases the export itself could not capture make the
                  # backup incomplete, however well the rest restored.
                  export_failures="$(jq -r '.failures // [] | .[] | "export recorded a failure for \(.namespace | @json)/\(.database // "*" | @json)\(if .kind then " (\(.kind))" else "" end): \(.reason)"' "$manifest_doc")"
                  if [ -n "$failures" ] || [ -n "$export_failures" ]; then
                    if [ -n "$failures" ]; then
                      printf '%s\n' "$failures" >&2
                    fi
                    if [ -n "$export_failures" ]; then
                      printf '%s\n' "$export_failures" >&2
                    fi
                    exit 1
                  fi
                  jq -r '"restored \(.namespace)/\(.database): \(.rows_restored) rows (export counted \(.rows_exported))"' \
                    "$work/databases.jsonl"
                  jq -r '.organizations // empty
                    | if .error then "export skipped its organization check: \(.error)"
                      else "organizations without a graph database at export: \(.without_graph | length) of \(.total)"
                        + (.without_graph[:10] | map(" " + .organization) | join(""))
                        + (if (.without_graph | length) > 10 then " and \((.without_graph | length) - 10) more (see the receipt)" else "" end) end' \
                    "$manifest_doc"
                  row_counts_json="{"
                  row_counts_separator=""
                  {{- range .Values.restoreDrill.fixtureChecks }}
                  count_result="$(restore_sql {{ .namespace }} {{ .database }} "SELECT count() AS count FROM {{ .table }} GROUP ALL;")"
                  row_count="$(printf '%s\n' "$count_result" | jq -r '.[0].count // 0')"
                  if [ "${row_count:-0}" -lt {{ .minRows }} ]; then
                    echo "fixture {{ .namespace }}/{{ .database }}/{{ .table }} expected >= {{ .minRows }}, got ${row_count:-0}" >&2
                    exit 1
                  fi
                  row_counts_json="${row_counts_json}${row_counts_separator}\"{{ .namespace }}.{{ .database }}.{{ .table }}\":{\"expected\":${row_count},\"actual\":${row_count}}"
                  row_counts_separator=","
                  {{- end }}
                  row_counts_json="${row_counts_json}}"
                  recall_sample_json='{"query":"restore drill recall check disabled","result_count":0}'
                  {{- if .Values.restoreDrill.recallCheck.enabled }}
                  recall_sample_path="$(mktemp)"
                  export SIBYL_RESTORE_RECALL_SAMPLE_PATH="$recall_sample_path"
                  {{ .Values.restoreDrill.recallCheck.command | replace "$" "$$" | nindent 18 }}
                  if [ ! -s "$recall_sample_path" ]; then
                    echo "recall check did not write $recall_sample_path" >&2
                    exit 1
                  fi
                  recall_result_count="$(sed -n 's/.*"result_count":[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$recall_sample_path" | head -n 1)"
                  if [ "${recall_result_count:-0}" -lt 1 ]; then
                    echo "recall check expected result_count > 0, got ${recall_result_count:-0}" >&2
                    exit 1
                  fi
                  recall_sample_json="$(cat "$recall_sample_path")"
                  {{- end }}
                  receipt_dir="$(dirname "$SIBYL_RESTORE_RECEIPT_PATH")"
                  mkdir -p "$receipt_dir"
                  jq -c \
                    --arg path "$manifest" \
                    --argjson age_seconds "$age_seconds" \
                    --argjson max_age_hours "$max_age_hours" \
                    --argjson decrypted "$decrypted" \
                    '{path: $path, created_at, server_version, databases: (.databases | length),
                      age_seconds: $age_seconds, max_age_hours: $max_age_hours, decrypted: $decrypted,
                      organizations: (.organizations // null)}' \
                    "$manifest_doc" > "$work/manifest-summary.json"
                  jq -cn \
                    --arg runtime "kubernetes:${POD_NAMESPACE:-default}/{{ include "sibyl-surrealdb.fullname" . }}-restore-drill" \
                    --slurpfile manifest "$work/manifest-summary.json" \
                    --slurpfile databases "$work/databases.jsonl" \
                    --argjson row_counts "$row_counts_json" \
                    --argjson recall_sample "$recall_sample_json" \
                    '{status: "PASS", runtime: $runtime, manifest: $manifest[0], databases: $databases,
                      row_counts: $row_counts, recall_sample: $recall_sample}' \
                    > "$SIBYL_RESTORE_RECEIPT_PATH"
                  echo "restore drill receipt: $SIBYL_RESTORE_RECEIPT_PATH"
                  echo "SIBYL_RESTORE_RECEIPT_JSON_BEGIN"
                  cat "$SIBYL_RESTORE_RECEIPT_PATH"
                  echo "SIBYL_RESTORE_RECEIPT_JSON_END"
              env:
                - name: HOME
                  value: /tmp
                - name: SIBYL_RESTORE_SOURCE_PATH
                  value: {{ .Values.restoreDrill.source.path | quote }}
                - name: SIBYL_EXPORT_FILE_PREFIX
                  value: {{ .Values.export.filePrefix | quote }}
                - name: SIBYL_EXPORT_DESTINATION_URI
                  value: {{ .Values.export.destination.uri | quote }}
                - name: SIBYL_RESTORE_FETCH_COMMAND
                  value: {{ include "sibyl-surrealdb.hookEnvValue" .Values.restoreDrill.fetchCommand }}
                {{- if .Values.restoreDrill.decryption.enabled }}
                - name: SIBYL_RESTORE_DECRYPTION_COMMAND
                  value: {{ include "sibyl-surrealdb.hookEnvValue" .Values.restoreDrill.decryption.command }}
                {{- end }}
                - name: SIBYL_RESTORE_REQUIRED_DATABASES
                  value: {{ .Values.databases | toJson | quote }}
                - name: SIBYL_RESTORE_ROW_DRIFT_ROWS
                  value: {{ .Values.restoreDrill.rowDrift.rows | toString | quote }}
                - name: SIBYL_RESTORE_ROW_DRIFT_PERCENT
                  value: {{ .Values.restoreDrill.rowDrift.percent | toString | quote }}
                {{- include "sibyl-surrealdb.httpEnv" . | nindent 16 }}
                - name: SIBYL_RESTORE_MAX_EXPORT_AGE_HOURS
                  value: {{ .Values.restoreDrill.maxExportAgeHours | toString | quote }}
                - name: SURREAL_RESTORE_ENDPOINT
                  value: {{ .Values.restoreDrill.restore.endpoint | quote }}
                - name: SURREAL_RESTORE_USER
                  value: {{ .Values.restoreDrill.restore.username | quote }}
                - name: SURREAL_RESTORE_PASS
                  value: {{ .Values.restoreDrill.restore.password | quote }}
                - name: SURREAL_RESTORE_PATH
                  value: {{ .Values.restoreDrill.restore.path | quote }}
                - name: SIBYL_RESTORE_RECEIPT_PATH
                  value: {{ .Values.restoreDrill.receipt.path | quote }}
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                {{- with .Values.restoreDrill.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- with .Values.restoreDrill.extraEnvFrom }}
              envFrom:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              resources:
                {{- toYaml .Values.jobDefaults.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                {{- if .Values.restoreDrill.workspace.emptyDir }}
                - name: restore-workspace
                  mountPath: {{ .Values.restoreDrill.source.path | quote }}
                {{- end }}
                {{- with .Values.restoreDrill.extraVolumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          volumes:
            - name: tmp
              emptyDir: {}
            {{- if .Values.restoreDrill.workspace.emptyDir }}
            - name: restore-workspace
              emptyDir: {}
            {{- end }}
            {{- with .Values.restoreDrill.extraVolumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
