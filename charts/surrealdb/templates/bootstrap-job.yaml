{{- if .Values.bootstrap.enabled -}}
{{- include "sibyl-surrealdb.validateDatabases" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sibyl-surrealdb.fullname" . }}-strict-bootstrap
  labels:
    {{- include "sibyl-surrealdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: strict-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "5"
    {{- with .Values.bootstrap.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.bootstrap.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "sibyl-surrealdb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: strict-bootstrap
      {{- with .Values.jobDefaults.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "sibyl-surrealdb.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.jobDefaults.podSecurityContext | nindent 8 }}
      containers:
        - name: strict-bootstrap
          image: {{ include "sibyl-surrealdb.opsImage" . | quote }}
          imagePullPolicy: {{ .Values.opsImage.pullPolicy | default "IfNotPresent" }}
          workingDir: /tmp
          securityContext:
            {{- toYaml .Values.jobDefaults.securityContext | nindent 12 }}
          command:
            - /bin/sh
            - -ec
          # The surreal CLI is unavailable here (the surreal image is
          # distroless and cannot host a shell), so statements go through
          # the HTTP API. /sql returns HTTP 200 with per-statement status,
          # so the jq gate is what actually fails the Job on SQL errors.
          args:
            - |
              cat > /tmp/bootstrap.surql <<'SQL'
              {{- range .Values.databases }}
              USE NS {{ .namespace }};
              DEFINE DATABASE OVERWRITE {{ .database }} STRICT;
              {{- end }}
              SQL
              response="$(curl -fsS \
                -u "$SURREAL_USER:$SURREAL_PASS" \
                -H "Accept: application/json" \
                -H "Content-Type: text/plain" \
                --data-binary @/tmp/bootstrap.surql \
                "$SURREAL_ENDPOINT/sql")"
              printf '%s\n' "$response" | jq -e 'all(.[]; .status == "OK")' >/dev/null || {
                printf 'strict bootstrap failed:\n%s\n' "$response" >&2
                exit 1
              }
          env:
            - name: HOME
              value: /tmp
            - name: SURREAL_HIDE_WELCOME
              value: "true"
            {{- include "sibyl-surrealdb.surrealEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.jobDefaults.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
