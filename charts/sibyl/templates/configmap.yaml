apiVersion: v1
kind: ConfigMap
{{- include "sibyl.validateOidcProviders" . }}
{{- include "sibyl.validateProductionAuthSecret" . }}
{{- if hasKey .Values.backend.env "SIBYL_VALIDATION_RECEIPT_URL" }}
{{- fail "Set backend.validationReceipts.url instead of backend.env.SIBYL_VALIDATION_RECEIPT_URL, so the chart can check it against the receipts claim." }}
{{- end }}
{{- with .Values.backend.validationReceipts }}
{{- if and .url .existingClaim }}
{{- fail "Set only one of backend.validationReceipts.url or backend.validationReceipts.existingClaim." }}
{{- end }}
{{- include "sibyl.validateS3Url" (dict "url" .url "value" "backend.validationReceipts.url") }}
{{- if not (or .url .existingClaim) }}
{{- fail "backend.validationReceipts.existingClaim is required unless backend.validationReceipts.url names an S3 bucket. Provision a persistent claim shared by API and worker, with ReadWriteMany access for multi-node replicas, or set an s3:// URL, before installation or upgrade." }}
{{- end }}
{{- end }}
{{- if hasKey .Values.backend.env "SIBYL_BACKUP_ARCHIVE_URL" }}
{{- fail "Set backend.backupArchives.url instead of backend.env.SIBYL_BACKUP_ARCHIVE_URL, so the chart can check it against the archives claim." }}
{{- end }}
{{- if hasKey .Values.backend.env "SIBYL_BACKUP_DIR" }}
{{- fail "Set backend.backupArchives.existingClaim instead of backend.env.SIBYL_BACKUP_DIR; the chart mounts the archive directory for API and worker." }}
{{- end }}
{{- with .Values.backend.backupArchives }}
{{- if and .url .existingClaim }}
{{- fail "Set only one of backend.backupArchives.url or backend.backupArchives.existingClaim." }}
{{- end }}
{{- include "sibyl.validateS3Url" (dict "url" .url "value" "backend.backupArchives.url") }}
{{- if not (or .url .existingClaim $.Values.backend.validationReceipts.existingClaim) }}
{{- fail "backend.backupArchives.url or backend.backupArchives.existingClaim is required when validation receipts live in S3: backup archives need storage that API and worker share. Set an s3:// URL (a prefix apart from receipts) or a persistent claim, with ReadWriteMany access for multi-node replicas." }}
{{- end }}
{{- if and .url $.Values.backend.validationReceipts.url }}
{{- $archives := include "sibyl.s3KeyBase" .url }}
{{- $receipts := include "sibyl.s3KeyBase" $.Values.backend.validationReceipts.url }}
{{- if or (hasPrefix $receipts $archives) (hasPrefix $archives $receipts) }}
{{- fail "backend.backupArchives.url and backend.validationReceipts.url need separate S3 prefixes; neither may contain the other." }}
{{- end }}
{{- end }}
{{- end }}
{{- if hasKey .Values "store" }}
{{- fail "Deprecated value 'store' is no longer supported. Remove it and complete legacy-to-Surreal migration before upgrading." }}
{{- end }}
{{- if hasKey .Values "authStore" }}
{{- fail "Deprecated value 'authStore' is no longer supported. Remove it and complete legacy auth migration before upgrading." }}
{{- end }}
metadata:
  name: {{ include "sibyl.fullname" . }}-config
  labels:
    {{- include "sibyl.labels" . | nindent 4 }}
data:
  # Backend configuration
  {{- range $key, $value := .Values.backend.env }}
  {{- if and (ne $key "SIBYL_PUBLIC_URL") (ne $key "SIBYL_FORWARDED_ALLOW_IPS") }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- with include "sibyl.forwardedAllowIps" . }}
  SIBYL_FORWARDED_ALLOW_IPS: {{ . | quote }}
  {{- end }}
  # Storage mode
  SIBYL_STORE: "surreal"
  SIBYL_AUTH_STORE: "surreal"
  SIBYL_COORDINATION_BACKEND: {{ .Values.coordinationBackend | quote }}
  {{- with .Values.backend.validationReceipts.url }}
  SIBYL_VALIDATION_RECEIPT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.backupArchives.url }}
  SIBYL_BACKUP_ARCHIVE_URL: {{ . | quote }}
  {{- end }}
  SIBYL_LOCAL_AUTH_ENABLED: {{ .Values.auth.localAuthEnabled | quote }}
  SIBYL_PUBLIC_SIGNUPS_ENABLED: {{ .Values.auth.publicSignupsEnabled | quote }}
  {{- if .Values.publicUrl }}
  SIBYL_PUBLIC_URL: {{ trimSuffix "/" .Values.publicUrl | quote }}
  {{- else if hasKey .Values.backend.env "SIBYL_PUBLIC_URL" }}
  SIBYL_PUBLIC_URL: {{ index .Values.backend.env "SIBYL_PUBLIC_URL" | quote }}
  {{- end }}
  SIBYL_BREAK_GLASS_ENABLED: {{ .Values.breakGlass.enabled | quote }}
  SIBYL_BREAK_GLASS_ALLOWED_IPS: {{ .Values.breakGlass.allowedIPs | toJson | quote }}
  {{- if .Values.breakGlass.expiresAt }}
  SIBYL_BREAK_GLASS_EXPIRES_AT: {{ .Values.breakGlass.expiresAt | quote }}
  {{- end }}
  SIBYL_OIDC: {{ .Values.oidc | toJson | quote }}
  {{- if eq .Values.coordinationBackend "redis" }}
  SIBYL_REDIS_HOST: {{ .Values.backend.redis.host | quote }}
  SIBYL_REDIS_PORT: {{ .Values.backend.redis.port | quote }}
  SIBYL_REDIS_JOBS_DB: {{ .Values.backend.redis.jobsDb | quote }}
  {{- if .Values.backend.redis.rateLimitStorage }}
  SIBYL_RATE_LIMIT_STORAGE: {{ .Values.backend.redis.rateLimitStorage | quote }}
  {{- else }}
  SIBYL_RATE_LIMIT_STORAGE: {{ printf "redis://%s:%s/%s" .Values.backend.redis.host .Values.backend.redis.port .Values.backend.redis.rateLimitDb | quote }}
  {{- end }}
  {{- end }}
  # SurrealDB connection
  SIBYL_SURREAL_URL: {{ .Values.backend.surreal.url | quote }}
  SIBYL_SURREAL_USERNAME: {{ .Values.backend.surreal.username | quote }}
  SIBYL_SURREAL_NAMESPACE_PREFIX: {{ .Values.backend.surreal.namespacePrefix | quote }}
  SIBYL_SURREAL_DATABASE: {{ .Values.backend.surreal.database | quote }}
