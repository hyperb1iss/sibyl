# ============================================================================
# Sibyl Production Docker Compose
# Complete stack: Backend, Frontend, SurrealDB (unified store)
# ============================================================================
#
# Quick Start:
#   1. Copy .env.example to ~/.sibyl/prod.env and configure secrets
#   2. docker compose --env-file ~/.sibyl/prod.env -f docker-compose.prod.yml up -d
#   3. Visit http://localhost:3337
#
# SurrealDB is the only data store: graph, content, and auth in one instance.
#
# Environment Variables (required):
#   SIBYL_JWT_SECRET          — Random secret for JWT signing (openssl rand -hex 32)
#   SIBYL_OPENAI_API_KEY      — OpenAI API key for embeddings
#   SIBYL_ANTHROPIC_API_KEY   — Anthropic API key for entity extraction and agents
#
# Environment Variables (optional):
#   SIBYL_SURREAL_PASSWORD    — SurrealDB root password (default: sibyl_dev; CHANGE IN PROD)
#   SIBYL_SETTINGS_KEY        — Key for encrypted settings; unset, receipts-init writes one
#                               to the shared volume that the backend and worker both read
#   SIBYL_COORDINATION_BACKEND — Set to redis together with --profile redis to run jobs on
#                               the separate worker; backend and worker then share the
#                               redis service for jobs, locks, events and rate limits:
#     SIBYL_COORDINATION_BACKEND=redis docker compose --env-file ~/.sibyl/prod.env \
#       -f docker-compose.prod.yml --profile redis up -d
#                               Use local or redis here, not auto: the Redis address is
#                               always set, so auto would resolve to redis. A worker
#                               started without redis coordination exits with an error
#                               rather than idling while the backend runs every job.

services:
  # ==========================================================================
  # Backend API + MCP Server
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sibyl-backend
    volumes:
      - validation_receipts:/home/sibyl/.sibyl
    depends_on:
      receipts-init:
        condition: service_completed_successfully
      surrealdb:
        condition: service_healthy
      redis:
        condition: service_started
        required: false
    ports:
      - "3334:3334"
    environment:
      # Runtime environment and auth hardening
      SIBYL_ENVIRONMENT: ${SIBYL_ENVIRONMENT:-production}
      SIBYL_LOCAL_AUTH_ENABLED: ${SIBYL_LOCAL_AUTH_ENABLED:-false}
      # Store selection — fully Surreal by default
      SIBYL_STORE: ${SIBYL_STORE:-surreal}
      SIBYL_AUTH_STORE: ${SIBYL_AUTH_STORE:-surreal}
      # local runs jobs in-process; redis (with --profile redis) hands them to the
      # worker. The Redis address is read only under redis coordination, which is
      # why the default is local rather than auto: auto would see it and pick redis.
      SIBYL_COORDINATION_BACKEND: ${SIBYL_COORDINATION_BACKEND:-local}
      SIBYL_REDIS_HOST: ${SIBYL_REDIS_HOST:-redis}
      SIBYL_REDIS_PORT: 6379
      # Unset, the backend and worker read the key receipts-init wrote to the shared volume.
      SIBYL_SETTINGS_KEY: ${SIBYL_SETTINGS_KEY:-}
      # SurrealDB (primary)
      SIBYL_SURREAL_URL: ws://surrealdb:8000/rpc
      SIBYL_SURREAL_USERNAME:
        ${SIBYL_SURREAL_USERNAME:?Set SIBYL_SURREAL_USERNAME in the environment}
      SIBYL_SURREAL_PASSWORD:
        ${SIBYL_SURREAL_PASSWORD:?Set SIBYL_SURREAL_PASSWORD in the environment}
      # Auth (REQUIRED)
      SIBYL_JWT_SECRET: ${SIBYL_JWT_SECRET:?Set SIBYL_JWT_SECRET in the environment}
      SIBYL_SERVER_URL: ${SIBYL_SERVER_URL:-http://localhost:3334}
      # OpenAI (REQUIRED for embeddings)
      SIBYL_OPENAI_API_KEY: ${SIBYL_OPENAI_API_KEY:?Set SIBYL_OPENAI_API_KEY in the environment}
      # Anthropic (REQUIRED for entity extraction and agents)
      SIBYL_ANTHROPIC_API_KEY:
        ${SIBYL_ANTHROPIC_API_KEY:?Set SIBYL_ANTHROPIC_API_KEY in the environment}
      SIBYL_LLM_PROVIDER: anthropic
      SIBYL_LLM_MODEL: claude-haiku-5-5
      # Server config
      SIBYL_SERVER_HOST: 0.0.0.0
      SIBYL_SERVER_PORT: 3334
      # Reverse proxies allowed to report the client address; empty keeps
      # loopback only. Port 3334 is published on every interface, so list
      # only the proxy's own address, never Docker's bridge ranges.
      SIBYL_FORWARDED_ALLOW_IPS: ${SIBYL_FORWARDED_ALLOW_IPS:-}
    healthcheck:
      # Readiness, not liveness: /api/health is always 200 once the process is up, so it
      # cannot see a failed schema bootstrap. /api/health/ready returns 503 for that, and
      # raise_for_status turns the 503 into a non-zero exit the healthcheck acts on.
      test:
        [
          "CMD-SHELL",
          'python -c "import httpx; httpx.get(''http://localhost:3334/api/health/ready'').raise_for_status()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start on a store moved to SurrealDB 4 rebuilds the auth and
      # content indexes before it serves, about 60 s per GB: 10m covers 10 GB.
      start_period: 10m
    restart: unless-stopped

  # ==========================================================================
  # Frontend (Next.js)
  # ==========================================================================
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sibyl-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3337:3337"
    environment:
      # API URL for client-side requests (browser → external URL)
      NEXT_PUBLIC_API_URL: ${SIBYL_SERVER_URL:-http://localhost:3334}
      # API URL for server-side requests (Next.js server → backend container)
      SIBYL_API_URL: http://backend:3334/api
      NODE_ENV: production
    restart: unless-stopped

  # ==========================================================================
  # Background Worker (Redis/Valkey profile only)
  # ==========================================================================
  worker:
    profiles: ["redis"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sibyl-worker
    command: ["sibyld", "worker", "--require-redis"]
    volumes:
      - validation_receipts:/home/sibyl/.sibyl
    depends_on:
      receipts-init:
        condition: service_completed_successfully
      surrealdb:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SIBYL_ENVIRONMENT: ${SIBYL_ENVIRONMENT:-production}
      SIBYL_LOCAL_AUTH_ENABLED: ${SIBYL_LOCAL_AUTH_ENABLED:-false}
      SIBYL_STORE: ${SIBYL_STORE:-surreal}
      SIBYL_AUTH_STORE: ${SIBYL_AUTH_STORE:-surreal}
      # Same variable and default as the backend, so the two cannot disagree; left
      # unset with --profile redis, this worker refuses to start.
      SIBYL_COORDINATION_BACKEND: ${SIBYL_COORDINATION_BACKEND:-local}
      SIBYL_REDIS_HOST: ${SIBYL_REDIS_HOST:-redis}
      SIBYL_REDIS_PORT: 6379
      SIBYL_SURREAL_URL: ws://surrealdb:8000/rpc
      SIBYL_SURREAL_USERNAME:
        ${SIBYL_SURREAL_USERNAME:?Set SIBYL_SURREAL_USERNAME in the environment}
      SIBYL_SURREAL_PASSWORD:
        ${SIBYL_SURREAL_PASSWORD:?Set SIBYL_SURREAL_PASSWORD in the environment}
      # Auth (REQUIRED): the worker shares the API's signing key so both agree on
      # a signature, and production refuses to start without one.
      SIBYL_JWT_SECRET: ${SIBYL_JWT_SECRET:?Set SIBYL_JWT_SECRET in the environment}
      # The worker decrypts settings the backend saved, so it needs the same key.
      SIBYL_SETTINGS_KEY: ${SIBYL_SETTINGS_KEY:-}
      SIBYL_OPENAI_API_KEY: ${SIBYL_OPENAI_API_KEY:?Set SIBYL_OPENAI_API_KEY in the environment}
      SIBYL_ANTHROPIC_API_KEY:
        ${SIBYL_ANTHROPIC_API_KEY:?Set SIBYL_ANTHROPIC_API_KEY in the environment}
      SIBYL_LLM_PROVIDER: anthropic
      SIBYL_LLM_MODEL: claude-haiku-5-5
    # The image's own healthcheck asks the API port, which a worker does not
    # serve; this asks Valkey whether a worker heartbeat is live.
    healthcheck:
      test: ["CMD", "sibyld", "worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # Redis/Valkey (optional distributed coordination)
  # ==========================================================================
  redis:
    profiles: ["redis"]
    image: valkey/valkey:8-alpine
    container_name: sibyl-redis
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  # ==========================================================================
  # SurrealDB (graph + content + auth, unified)
  # ==========================================================================
  # The SurrealDB image runs as UID 65532 (distroless nonroot), but a
  # fresh named volume is created root-owned, so SurrealDB cannot create
  # its store directory under /data. This one-shot fixes the volume
  # ownership before SurrealDB starts; the chown is idempotent on reruns.
  # The backend and worker share /home/sibyl/.sibyl. A process on redis
  # coordination never generates its own settings key (each would differ), so
  # this one-shot writes the shared key once, before either starts.
  receipts-init:
    image: busybox:1.37
    command:
      - sh
      - -c
      - |
        set -eu
        key=/home/sibyl/.sibyl/settings.key
        if [ ! -s "$$key" ]; then
          head -c 32 /dev/urandom | base64 | tr '+/' '-_' > "$$key"
          chmod 600 "$$key"
        fi
        chown 10001:10001 /home/sibyl/.sibyl "$$key"
    volumes:
      - validation_receipts:/home/sibyl/.sibyl
    restart: "no"

  # The one-shot that prepares the data directory also refuses an image and
  # store path that would open existing data wrong (a 3.x image on surrealkv://
  # or on a converted store, or 4.0 on a 3.x store without the opt-in), so the
  # server never starts on them.
  surreal-init:
    image: busybox:1.37
    container_name: sibyl-surreal-init
    command:
      - sh
      - -c
      - |
        # Refuse a SurrealDB image and store path that would open the data wrong.
        store="$${SURREAL_STORE#*://}"
        case "$$store" in /*) ;; *) store="" ;; esac
        ref="$${SURREAL_IMAGE%%@*}"
        tag="$${ref##*/}"
        case "$$tag" in *:*) tag="$${tag##*:}" ;; *) tag="" ;; esac
        tag="$${tag#v}"
        major="$${tag%%.*}"
        case "$$major" in "" | *[!0-9]*) major="" ;; esac
        convert="$${SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X:-}"
        refuse() {
          echo "surreal-init: $$1" >&2
          echo "surreal-init: nothing was started; see docs/deployment/surrealdb-4-upgrade.md" >&2
          exit 1
        }
        if [ -n "$$store" ] && [ -e "$$store" ] && ! ls "$$store" > /dev/null 2>&1; then
          refuse "cannot read $$store to check which store it holds"
        fi
        if [ -n "$$store" ] && [ -d "$$store/manifest" ]; then
          case "$$SURREAL_STORE" in
            rocksdb://*)
              if [ "$$major" = 3 ]; then
                refuse "$$store holds a SurrealKV store; a 3.x server opened with rocksdb:// on it serves an empty database and leaves files that stop 4.0 from opening the store"
              fi
              ;;
          esac
        elif [ -n "$$store" ] && [ -f "$$store/CURRENT" ]; then
          case "$$SURREAL_STORE" in
            surrealkv://*)
              if [ "$$major" = 3 ]; then
                refuse "a 3.x server opened with surrealkv:// serves an empty database beside the 3.x store in $$store; a 3.x image keeps the rocksdb:// store path"
              fi
              if [ "$$convert" != true ]; then
                refuse "$$store holds a store a SurrealDB 3.x server wrote; 4.0 converts it once and for good: back it up, then start once with SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X=true"
              fi
              ;;
            *)
              if [ -n "$$major" ] && [ "$$major" -ge 4 ] && [ "$$convert" != true ]; then
                refuse "$$store holds a store a SurrealDB 3.x server wrote; 4.0 converts it once and for good: back it up, then start once with SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X=true"
              fi
              ;;
          esac
        fi
        chown -R 65532:65532 /data
    environment:
      SURREAL_IMAGE: ${SIBYL_SURREAL_IMAGE:-surrealdb/surrealdb:v4.0.0}
      SURREAL_STORE: ${SIBYL_SURREAL_PATH:-surrealkv:///data/sibyl.db}
      SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X: ${SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X:-}
    volumes:
      - surreal_data:/data
    restart: "no"

  surrealdb:
    # A 3.x image needs SIBYL_SURREAL_PATH=rocksdb:///data/sibyl.db with it:
    # a 3.x server opened with surrealkv:// serves an empty database.
    image: ${SIBYL_SURREAL_IMAGE:-surrealdb/surrealdb:v4.0.0}
    container_name: sibyl-surrealdb
    depends_on:
      surreal-init:
        condition: service_completed_successfully
    command:
      [
        "start",
        "--log",
        "info",
        "--user",
        "${SIBYL_SURREAL_USERNAME:?Set SIBYL_SURREAL_USERNAME in the environment}",
        "--pass",
        "${SIBYL_SURREAL_PASSWORD:?Set SIBYL_SURREAL_PASSWORD in the environment}",
        "${SIBYL_SURREAL_PATH:-surrealkv:///data/sibyl.db}",
      ]
    ports:
      - "${SIBYL_SURREAL_PORT:-8000}:8000"
    volumes:
      - surreal_data:/data
    environment:
      # Set to true for the one start that converts a 3.x store; see
      # docs/deployment/surrealdb-4-upgrade.md.
      - SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X
      # Off from a directory's first 4.0 start: value-log files are never reclaimed.
      - SURREAL_SURREALKV_ENABLE_VLOG=false
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "ws://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Nothing listens while 4.0 converts a 3.x store in place. Allow 30 s per
      # GB of the RocksDB store: 10m covers 20 GB.
      start_period: 10m
    restart: unless-stopped

volumes:
  validation_receipts:
  surreal_data:

networks:
  default:
    name: sibyl-network
