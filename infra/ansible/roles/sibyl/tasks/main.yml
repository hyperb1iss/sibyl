---
- name: Assert required secrets are supplied
  ansible.builtin.assert:
    that:
      - sibyl_surreal_password | default('') | length > 0
      - sibyl_jwt_secret | default('') | length > 0
      - sibyl_openai_api_key | default('') | length > 0
      - sibyl_anthropic_api_key | default('') | length > 0
      - sibyl_cf_api_token | default('') | length > 0
    quiet: true
    fail_msg: >-
      The sibyl role needs sibyl_surreal_password, sibyl_jwt_secret, sibyl_openai_api_key,
      sibyl_anthropic_api_key and sibyl_cf_api_token. Supply them through vault-backed variables.

- name: Assert the compose network prefix names a /24
  ansible.builtin.assert:
    that:
      - sibyl_network_prefix is match('^[0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}$')
    quiet: true
    fail_msg: >-
      sibyl_network_prefix takes the first three octets of a /24, such as 10.47.213, not a full
      address or a CIDR range.

# A 3.x server handed surrealkv:// on its RocksDB directory starts an empty
# database beside the data, so the path has to match the image's major. The
# major comes from the tag, whatever registry or digest the reference carries;
# a reference without a version tag is refused rather than guessed.
- name: Read the SurrealDB image's major version
  ansible.builtin.set_fact:
    sibyl_surreal_major: >-
      {{ sibyl_surreal_image | regex_replace('@.*$', '') | regex_replace('^.*/', '')
         | regex_replace('^[^:]+:v?([0-9]+)[.][0-9]+[.][0-9]+[^:]*$', '\1') }}

- name: Assert the SurrealDB image names a version
  ansible.builtin.assert:
    that:
      - (sibyl_surreal_major | string) is match('^[0-9]+$')
    quiet: true
    fail_msg: >-
      sibyl_surreal_image must carry a version tag such as surrealdb/surrealdb:v4.0.0 (a digest may
      follow it), so the role can pair it with its store path; got {{ sibyl_surreal_image }}.

- name: Assert the SurrealDB store path matches the image's major version
  ansible.builtin.assert:
    that:
      - (sibyl_surreal_major | int != 3) or (sibyl_surreal_path is match('^rocksdb://'))
      - (sibyl_surreal_major | int < 4) or (sibyl_surreal_path is match('^surrealkv://'))
    quiet: true
    fail_msg: >-
      sibyl_surreal_path must be rocksdb:///data/sibyl.db for a 3.x sibyl_surreal_image and
      surrealkv:///data/sibyl.db for 4.x. A 3.x server opened with surrealkv:// serves an empty
      database; see docs/deployment/surrealdb-4-upgrade.md.

# ─── Docker engine ─────────────────────────────────────────────────────────────
- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install the Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add the Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ sibyl_docker_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# ─── Firewall ──────────────────────────────────────────────────────────────────
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH on the proxy interface only
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ sibyl_proxy_interface }}"
    proto: tcp
    port: "22"
  tags: [firewall]

# Earlier runs of this role allowed OpenSSH on every interface. Drop
# that rule so SSH, like HTTP/HTTPS, is reachable on the tailnet only.
- name: Revoke the public SSH allow rule
  community.general.ufw:
    rule: allow
    name: OpenSSH
    delete: true
  tags: [firewall]

- name: Allow HTTP and HTTPS on the proxy interface only
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ sibyl_proxy_interface }}"
    proto: tcp
    port: "{{ item }}"
  loop: ["80", "443"]
  tags: [firewall]

- name: Enable ufw with a default-deny inbound policy
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny
  tags: [firewall]

# ─── Stack ─────────────────────────────────────────────────────────────────────
- name: Create the deployment directory
  ansible.builtin.file:
    path: "{{ sibyl_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy the compose and Caddy config
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ sibyl_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - docker-compose.yml
    - Caddyfile
  notify: Restart sibyl

- name: Deploy the Caddy image build context
  ansible.builtin.copy:
    src: caddy
    dest: "{{ sibyl_dir }}/"
    owner: root
    group: root
    mode: "0644"
  notify: Restart sibyl

- name: Resolve the Tailscale interface address
  ansible.builtin.command: tailscale ip -4
  check_mode: false
  register: sibyl_tailscale_ip
  changed_when: false
  until: sibyl_tailscale_ip.rc == 0 and (sibyl_tailscale_ip.stdout | trim | length) > 0
  retries: 10
  delay: 3

- name: Render the environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ sibyl_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart sibyl

# ─── Service ───────────────────────────────────────────────────────────────────
- name: Install the sibyl systemd unit
  ansible.builtin.template:
    src: sibyl.service.j2
    dest: /etc/systemd/system/sibyl.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Daemon reload
    - Restart sibyl

- name: Flush handlers so the unit is registered before starting
  ansible.builtin.meta: flush_handlers

- name: Enable and start sibyl
  ansible.builtin.service:
    name: sibyl
    state: started
    enabled: true
