# Sibyl single-host deployment stack: ghcr.io images fronted by Caddy,
# which terminates TLS with a Let's Encrypt cert via the Cloudflare
# DNS-01 challenge. Rendered config lives in the sibling .env. Managed
# by the Ansible `sibyl` role and sibyl.service; not run by hand.

name: sibyl

services:
  # The SurrealDB image runs as UID 65532 (distroless nonroot), but a
  # fresh named volume is created root-owned, so SurrealDB cannot create
  # its store directory under /data. This one-shot fixes the volume
  # ownership before SurrealDB starts; the chown is idempotent on reruns.
  # The one-shot that prepares the data directory also refuses an image and
  # store path that would open existing data wrong (a 3.x image on surrealkv://
  # or on a converted store, or 4.0 on a 3.x store without the opt-in), so the
  # server never starts on them.
  surreal-init:
    image: busybox:1.37
    container_name: sibyl-surreal-init
    command:
      - sh
      - -c
      - |
        # Refuse a SurrealDB image and store path that would open the data wrong.
        store="$${SURREAL_STORE#*://}"
        case "$$store" in /*) ;; *) store="" ;; esac
        ref="$${SURREAL_IMAGE%%@*}"
        tag="$${ref##*/}"
        case "$$tag" in *:*) tag="$${tag##*:}" ;; *) tag="" ;; esac
        tag="$${tag#v}"
        major="$${tag%%.*}"
        case "$$major" in "" | *[!0-9]*) major="" ;; esac
        convert="$${SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X:-}"
        refuse() {
          echo "surreal-init: $$1" >&2
          echo "surreal-init: nothing was started; see docs/deployment/surrealdb-4-upgrade.md" >&2
          exit 1
        }
        if [ -n "$$store" ] && [ -e "$$store" ] && ! ls "$$store" > /dev/null 2>&1; then
          refuse "cannot read $$store to check which store it holds"
        fi
        if [ -n "$$store" ] && [ -d "$$store/manifest" ]; then
          case "$$SURREAL_STORE" in
            rocksdb://*)
              if [ "$$major" = 3 ]; then
                refuse "$$store holds a SurrealKV store; a 3.x server opened with rocksdb:// on it serves an empty database and leaves files that stop 4.0 from opening the store"
              fi
              ;;
          esac
        elif [ -n "$$store" ] && [ -f "$$store/CURRENT" ]; then
          case "$$SURREAL_STORE" in
            surrealkv://*)
              if [ "$$major" = 3 ]; then
                refuse "a 3.x server opened with surrealkv:// serves an empty database beside the 3.x store in $$store; a 3.x image keeps the rocksdb:// store path"
              fi
              if [ "$$convert" != true ]; then
                refuse "$$store holds a store a SurrealDB 3.x server wrote; 4.0 converts it once and for good: back it up, then start once with SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X=true"
              fi
              ;;
            *)
              if [ -n "$$major" ] && [ "$$major" -ge 4 ] && [ "$$convert" != true ]; then
                refuse "$$store holds a store a SurrealDB 3.x server wrote; 4.0 converts it once and for good: back it up, then start once with SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X=true"
              fi
              ;;
          esac
        fi
        chown -R 65532:65532 /data
    environment:
      SURREAL_IMAGE: ${SIBYL_SURREAL_IMAGE:-surrealdb/surrealdb:v4.0.0}
      SURREAL_STORE: ${SIBYL_SURREAL_PATH:?set SIBYL_SURREAL_PATH in the role env file}
      SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X: ${SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X:-}
    volumes:
      - surreal_data:/data
    restart: "no"

  surrealdb:
    image: ${SIBYL_SURREAL_IMAGE:-surrealdb/surrealdb:v4.0.0}
    container_name: sibyl-surrealdb
    depends_on:
      surreal-init:
        condition: service_completed_successfully
    command:
      - start
      - --log
      - info
      - --user
      - ${SIBYL_SURREAL_USERNAME:-root}
      - --pass
      - ${SIBYL_SURREAL_PASSWORD:?set SIBYL_SURREAL_PASSWORD in the role env file}
      - ${SIBYL_SURREAL_PATH:?set SIBYL_SURREAL_PATH in the role env file}
    volumes:
      - surreal_data:/data
    environment:
      SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X: ${SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X:-false}
      # Off from a directory's first 4.0 start: value-log files are never reclaimed.
      SURREAL_SURREALKV_ENABLE_VLOG: "false"
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "ws://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Nothing listens while 4.0 converts a 3.x store in place. Allow 30 s per
      # GB of the RocksDB store: 10m covers 20 GB.
      start_period: 10m
    restart: unless-stopped

  backend:
    image: ghcr.io/hyperb1iss/sibyl-api:${SIBYL_VERSION:-1.4.13}
    container_name: sibyl-backend
    depends_on:
      surrealdb:
        condition: service_healthy
    environment:
      SIBYL_ENVIRONMENT: production
      SIBYL_STORE: surreal
      SIBYL_AUTH_STORE: surreal
      SIBYL_COORDINATION_BACKEND: auto
      SIBYL_SURREAL_URL: ws://surrealdb:8000/rpc
      SIBYL_SURREAL_USERNAME: ${SIBYL_SURREAL_USERNAME:-root}
      SIBYL_SURREAL_PASSWORD:
        ${SIBYL_SURREAL_PASSWORD:?set SIBYL_SURREAL_PASSWORD in the role env file}
      SIBYL_JWT_SECRET: ${SIBYL_JWT_SECRET:?set SIBYL_JWT_SECRET in the role env file}
      SIBYL_SERVER_URL: https://${SIBYL_DOMAIN:?set SIBYL_DOMAIN in the role env file}
      SIBYL_FRONTEND_URL: https://${SIBYL_DOMAIN}/
      SIBYL_OPENAI_API_KEY: ${SIBYL_OPENAI_API_KEY:?set SIBYL_OPENAI_API_KEY in the role env file}
      SIBYL_ANTHROPIC_API_KEY:
        ${SIBYL_ANTHROPIC_API_KEY:?set SIBYL_ANTHROPIC_API_KEY in the role env file}
      SIBYL_RESEND_API_KEY: ${SIBYL_RESEND_API_KEY:-}
      SIBYL_SMTP_HOST: ${SIBYL_SMTP_HOST:-}
      SIBYL_SMTP_PORT: ${SIBYL_SMTP_PORT:-587}
      SIBYL_SMTP_USERNAME: ${SIBYL_SMTP_USERNAME:-}
      SIBYL_SMTP_PASSWORD: ${SIBYL_SMTP_PASSWORD:-}
      SIBYL_SMTP_STARTTLS: ${SIBYL_SMTP_STARTTLS:-true}
      SIBYL_SMTP_SSL: ${SIBYL_SMTP_SSL:-false}
      SIBYL_SMTP_TIMEOUT_SECONDS: ${SIBYL_SMTP_TIMEOUT_SECONDS:-20}
      SIBYL_EMAIL_FROM: "${SIBYL_EMAIL_FROM:-Sibyl <noreply@sibyl.dev>}"
      SIBYL_EMAIL_OUTBOX_PATH: ${SIBYL_EMAIL_OUTBOX_PATH:-}
      SIBYL_LLM_PROVIDER: anthropic
      SIBYL_LLM_MODEL: claude-haiku-5-5
      SIBYL_LOCAL_AUTH_ENABLED: ${SIBYL_LOCAL_AUTH_ENABLED:-true}
      SIBYL_PUBLIC_SIGNUPS_ENABLED: ${SIBYL_PUBLIC_SIGNUPS_ENABLED:-false}
      SIBYL_BREAK_GLASS_ENABLED: ${SIBYL_BREAK_GLASS_ENABLED:-false}
      SIBYL_MCP_AUTH_MODE: ${SIBYL_MCP_AUTH_MODE:-auto}
      # Trust Caddy's pinned address alone, so logins key on the real client
      # rather than Caddy. The bridge gateway, which every host process
      # connects from, stays untrusted. Only an unset variable falls back;
      # an empty one means loopback only.
      SIBYL_FORWARDED_ALLOW_IPS: ${SIBYL_FORWARDED_ALLOW_IPS-10.47.213.10/32}
      SIBYL_COOKIE_DOMAIN: ${SIBYL_DOMAIN}
      SIBYL_COOKIE_SECURE: "true"
      SIBYL_SERVER_HOST: 0.0.0.0
      SIBYL_SERVER_PORT: "3334"
    healthcheck:
      # Readiness, not liveness: /api/health is always 200 once the process is up, so it
      # cannot see a failed schema bootstrap. /api/health/ready returns 503 for that, and
      # raise_for_status turns the 503 into a non-zero exit the healthcheck acts on.
      test:
        [
          "CMD-SHELL",
          'python -c "import httpx;
          httpx.get(''http://localhost:3334/api/health/ready'').raise_for_status()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start on a store moved to SurrealDB 4 rebuilds the auth and
      # content indexes before it serves, about 60 s per GB: 10m covers 10 GB.
      start_period: 10m
    restart: unless-stopped

  frontend:
    image: ghcr.io/hyperb1iss/sibyl-web:${SIBYL_VERSION:-1.4.13}
    container_name: sibyl-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: https://${SIBYL_DOMAIN:?set SIBYL_DOMAIN in the role env file}
      SIBYL_API_URL: http://backend:3334/api
      SIBYL_BACKEND_URL: http://backend:3334
      NODE_ENV: production
      # Next.js standalone binds 0.0.0.0 (IPv4 only) by default; :: makes
      # the server dual-stack so it answers on both ::1 and 127.0.0.1.
      HOSTNAME: "::"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3337/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  caddy:
    build:
      context: ./caddy
    container_name: sibyl-caddy
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    # Bound to the Tailscale address only. Docker NATs published ports
    # ahead of ufw, so a 0.0.0.0 bind would be public despite the
    # firewall; binding to the tailnet IP is what keeps this private.
    ports:
      - "${SIBYL_BIND_IP:?set SIBYL_BIND_IP in the role env file}:80:80"
      - "${SIBYL_BIND_IP}:443:443"
    # A fixed address outside the dynamic range, so the backend can trust
    # exactly this container through SIBYL_FORWARDED_ALLOW_IPS.
    networks:
      default:
        ipv4_address: ${SIBYL_CADDY_IPV4:-10.47.213.10}
    environment:
      SIBYL_DOMAIN: ${SIBYL_DOMAIN:?set SIBYL_DOMAIN in the role env file}
      CF_API_TOKEN: ${CF_API_TOKEN:?set CF_API_TOKEN in the role env file}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  surreal_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: sibyl-network
    # Pinned rather than drawn from Docker's default pools, so Caddy's
    # address is known ahead of time. Other containers draw from ip_range,
    # which leaves Caddy's address free. The gateway is set explicitly
    # because Docker would otherwise take it from that range.
    ipam:
      config:
        - subnet: ${SIBYL_NETWORK_SUBNET:-10.47.213.0/24}
          gateway: ${SIBYL_NETWORK_GATEWAY:-10.47.213.1}
          ip_range: ${SIBYL_NETWORK_DYNAMIC_RANGE:-10.47.213.128/25}
