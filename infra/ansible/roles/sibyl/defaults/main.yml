---
# Filesystem location of the deployment on the host.
sibyl_dir: /opt/sibyl

# ghcr.io/hyperb1iss/sibyl-api and sibyl-web image tag to run.
sibyl_version: "1.4.1"

# SurrealDB image to run. Stated here rather than left to the compose
# fallback so the engine a host runs is a deliberate, reviewable value: an
# unset variable would otherwise let a checkout's default silently upgrade
# the database on the next restart, independently of sibyl_version.
sibyl_surreal_image: "surrealdb/surrealdb:v3.2.4"

# Public hostname Caddy serves and requests a certificate for.
sibyl_domain: sibyl.example.com

# Local-first auth defaults. First setup can create the owner/admin user;
# later account creation stays invite-based unless public signups are enabled.
sibyl_local_auth_enabled: true
sibyl_public_signups_enabled: false
sibyl_break_glass_enabled: false

# MCP bearer-token enforcement: on | auto | off.
sibyl_mcp_auth_mode: "auto"

# Address plan for the compose network (sibyl-network), given as the first
# three octets of a private /24. The bridge gateway takes .1, Caddy is pinned
# to .10, and Docker hands every other container an address from .128 up, so
# no container can land on Caddy's address. Pick a /24 that no host route,
# VPN, or other Docker network uses; the next restart recreates the network.
sibyl_network_prefix: "10.47.213"
sibyl_caddy_ipv4: "{{ sibyl_network_prefix }}.10"

# Reverse proxies the backend trusts to report the client address through
# X-Forwarded-For (SIBYL_FORWARDED_ALLOW_IPS). Caddy is the only ingress and
# replaces any X-Forwarded-For a client sends with the address it saw, so the
# default trusts Caddy's pinned address and nothing else. Never widen it to
# the network's subnet: host processes (any local user, a host-network
# container, an SSH tunnel) reach the backend from the bridge gateway, and a
# trusted gateway would let them choose their client address. Without this,
# every login shares Caddy's rate-limit bucket. An empty string turns proxy
# trust off (loopback only).
sibyl_forwarded_allow_ips: "{{ sibyl_caddy_ipv4 }}/32"

# Transactional email. Leave SMTP host empty to disable live delivery.
# Set sibyl_email_outbox_path when you want JSONL break-glass recovery.
sibyl_resend_api_key: ""
sibyl_smtp_host: ""
sibyl_smtp_port: 587
sibyl_smtp_username: ""
sibyl_smtp_password: ""
sibyl_smtp_starttls: true
sibyl_smtp_ssl: false
sibyl_smtp_timeout_seconds: 20
sibyl_email_from: "Sibyl <noreply@sibyl.dev>"
sibyl_email_outbox_path: ""

# SurrealDB root user. The password is a secret with no default.
sibyl_surreal_username: root

# Interface the proxy ports are exposed on. Tailscale-only by default,
# so the stack stays unreachable from the public internet.
sibyl_proxy_interface: tailscale0

# Docker apt repository architecture, derived from the host.
sibyl_docker_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

# Secrets — no defaults on purpose. Supply via host/group vars; homelab
# maps these to ansible-vault values. The role asserts they are set:
#   sibyl_surreal_password
#   sibyl_jwt_secret
#   sibyl_openai_api_key
#   sibyl_anthropic_api_key
#   sibyl_cf_api_token
