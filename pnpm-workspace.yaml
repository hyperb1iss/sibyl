packages:
  - "apps/web"
  - "docs"

# pnpm v11 replaced ignoredBuiltDependencies/onlyBuiltDependencies with
# a single allowBuilds map. Each entry explicitly opts in (true) or out
# (false) of running that package's install lifecycle scripts.
allowBuilds:
  esbuild: true # vite bundler needs the platform-specific binary
  msw: true # service worker tooling for apps/web tests
  sharp: false # preserved from prior ignoredBuiltDependencies
  unrs-resolver: false # preserved from prior ignoredBuiltDependencies

# Require packages to age for 24 hours before fresh resolution. Version-specific
# exceptions below cover this reviewed dependency refresh only.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@storybook/addon-a11y@10.5.10'
  - '@storybook/addon-docs@10.5.10'
  - '@storybook/addon-onboarding@10.5.10'
  - '@storybook/addon-vitest@10.5.10'
  - '@storybook/builder-vite@10.5.10'
  - '@storybook/csf-plugin@10.5.10'
  - '@storybook/nextjs-vite@10.5.10'
  - '@storybook/react-dom-shim@10.5.10'
  - '@storybook/react-vite@10.5.10'
  - '@storybook/react@10.5.10'
  - '@vitejs/plugin-react@6.1.0'
  - framer-motion@13.1.1
  - motion-dom@13.1.1
  - motion@13.1.1
  - storybook@10.5.10
  - vite@8.2.2

overrides:
  postcss: ^8.5.18
  sharp: 0.35.3

# Skip minimumReleaseAge re-verification of the committed lockfile. The
# 24h cooldown still applies during fresh resolution (and lockfile diffs
# are reviewed in PRs), so trusting an already-vetted lockfile is safe.
trustLockfile: true
