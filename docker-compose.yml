# Sibyl Development Data Services
#
# To run multiple instances, use different project names and ports:
#   COMPOSE_PROJECT_NAME=sibyl-test SIBYL_SURREAL_PORT=8010 docker compose --env-file /dev/null up -d surrealdb
#   COMPOSE_PROJECT_NAME=sibyl-redis SIBYL_REDIS_PORT=6391 docker compose --env-file /dev/null --profile redis up -d surrealdb redis
#
# Or use a separate env file:
#   docker compose --env-file .env.test up -d

services:
  surrealdb:
    image: ${SIBYL_SURREAL_IMAGE:-surrealdb/surrealdb:v3.2.3}
    container_name: ${COMPOSE_PROJECT_NAME:-sibyl}-surrealdb
    command:
      [
        "start",
        "--log",
        "${SIBYL_SURREAL_LOG_LEVEL:-info}",
        "--user",
        "${SIBYL_SURREAL_USERNAME:-root}",
        "--pass",
        "${SIBYL_SURREAL_PASSWORD:-root}",
        "${SIBYL_SURREAL_PATH:-rocksdb:///data/sibyl.db}",
      ]
    ports:
      - "${SIBYL_SURREAL_PORT:-8000}:8000"
    volumes:
      # `:U` is a podman extension that chowns the bind mount to the container UID
      # on first start (no-op under Docker Engine). Fixes rootless podman perm denied.
      - "${SURREAL_DATA_DIR:-./.moon/cache/surreal-dev}:/data:U"
    restart: unless-stopped

  surrealdb-eval:
    image: surrealdb/surrealdb:v3.2.3
    container_name: ${COMPOSE_PROJECT_NAME:-sibyl}-surrealdb-eval
    profiles: ["eval"]
    command: ["start", "--log", "info", "rocksdb:///data/sibyl.db"]
    environment:
      SURREAL_BIND: 0.0.0.0:8000
      SURREAL_USER: root
      SURREAL_PASS: root
      SURREAL_ROCKSDB_BLOCK_CACHE_SIZE: "8589934592"
      SURREAL_ROCKSDB_WRITE_BUFFER_SIZE: "134217728"
      SURREAL_ROCKSDB_MAX_WRITE_BUFFER_NUMBER: "4"
    ports:
      - "127.0.0.1:8018:8000"
    volumes:
      - "${SIBYL_RELEASE_ROOT:-./.moon/cache/surreal-eval}/surreal:/data:U"
    restart: unless-stopped

  redis:
    image: valkey/valkey:8-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-sibyl}-redis
    profiles: ["redis"]
    ports:
      - "${SIBYL_REDIS_PORT:-6381}:6379"
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
