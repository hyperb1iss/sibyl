# Sibyl Development Data Services
#
# To run multiple instances, use different project names and ports:
#   COMPOSE_PROJECT_NAME=sibyl-test SIBYL_SURREAL_PORT=8010 docker compose --env-file /dev/null up -d surrealdb
#   COMPOSE_PROJECT_NAME=sibyl-redis SIBYL_REDIS_PORT=6391 docker compose --env-file /dev/null --profile redis up -d surrealdb redis
#
# A data directory a SurrealDB 3.x server wrote is refused by 4.0 until it is
# converted, once and for good. Back it up, then start once with
# SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X=true in the shell; see
# docs/deployment/surrealdb-4-upgrade.md.

# The SurrealDB image runs as 65532:65532, and a bind-mounted host directory
# keeps its host owner, so a plain `docker compose up` on Linux could not write
# it. This one-shot hands the mount to that user before SurrealDB starts. A
# file share that cannot change owners (some desktop VMs) only warns here;
# SurrealDB itself reports a directory it cannot write.
x-surreal-init: &surreal-init
  image: busybox:1.37
  command:
    - sh
    - -c
    - chown -R 65532:65532 /data || echo "surreal-init could not hand /data to 65532:65532" >&2
  network_mode: none
  restart: "no"

services:
  surreal-init:
    <<: *surreal-init
    volumes:
      - "${SURREAL_DATA_DIR:-./.moon/cache/surreal-dev}:/data"

  surrealdb:
    # A 3.x image needs SIBYL_SURREAL_PATH=rocksdb:///data/sibyl.db with it:
    # a 3.x server opened with surrealkv:// serves an empty database.
    image: ${SIBYL_SURREAL_IMAGE:-surrealdb/surrealdb:v4.0.0}
    container_name: ${COMPOSE_PROJECT_NAME:-sibyl}-surrealdb
    depends_on:
      surreal-init:
        condition: service_completed_successfully
    command:
      [
        "start",
        "--log",
        "${SIBYL_SURREAL_LOG_LEVEL:-info}",
        "--user",
        "${SIBYL_SURREAL_USERNAME:-root}",
        "--pass",
        "${SIBYL_SURREAL_PASSWORD:-root}",
        "${SIBYL_SURREAL_PATH:-surrealkv:///data/sibyl.db}",
      ]
    ports:
      - "${SIBYL_SURREAL_PORT:-8000}:8000"
    volumes:
      # `:U` is a podman extension that chowns the bind mount to the container UID
      # on first start (no-op under Docker Engine). Fixes rootless podman perm denied.
      - "${SURREAL_DATA_DIR:-./.moon/cache/surreal-dev}:/data:U"
    environment:
      - SURREAL_SURREALKV_BLOCK_CACHE_CAPACITY
      - SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X
      # Off from a directory's first 4.0 start: value-log files are never reclaimed.
      - SURREAL_SURREALKV_ENABLE_VLOG=false
    restart: unless-stopped

  surreal-eval-init:
    <<: *surreal-init
    profiles: ["eval"]
    volumes:
      - "${SIBYL_RELEASE_ROOT:-./.moon/cache/surreal-eval}/surreal:/data"

  surrealdb-eval:
    image: surrealdb/surrealdb:v4.0.0
    container_name: ${COMPOSE_PROJECT_NAME:-sibyl}-surrealdb-eval
    profiles: ["eval"]
    depends_on:
      surreal-eval-init:
        condition: service_completed_successfully
    command: ["start", "--log", "info", "surrealkv:///data/sibyl.db"]
    environment:
      SURREAL_BIND: 0.0.0.0:8000
      SURREAL_USER: root
      SURREAL_PASS: root
      # The bounded runtime: an 8 GiB block cache and a 512 MiB memtable, the
      # same envelope the RocksDB cache and write buffers held on 3.x.
      SURREAL_SURREALKV_BLOCK_CACHE_CAPACITY: "8589934592"
      SURREAL_SURREALKV_MAX_MEMTABLE_SIZE: "536870912"
      # Off from a directory's first 4.0 start: value-log files are never reclaimed.
      SURREAL_SURREALKV_ENABLE_VLOG: "false"
    ports:
      - "127.0.0.1:8018:8000"
    volumes:
      - "${SIBYL_RELEASE_ROOT:-./.moon/cache/surreal-eval}/surreal:/data:U"
    restart: unless-stopped

  redis:
    image: valkey/valkey:8-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-sibyl}-redis
    profiles: ["redis"]
    ports:
      - "${SIBYL_REDIS_PORT:-6381}:6379"
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
