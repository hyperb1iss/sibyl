# Sibyl Development Data Services
#
# To run multiple instances, use different project names and ports:
#   COMPOSE_PROJECT_NAME=sibyl-test SIBYL_SURREAL_PORT=8010 docker compose --env-file /dev/null up -d surrealdb
#   COMPOSE_PROJECT_NAME=sibyl-redis SIBYL_REDIS_PORT=6391 docker compose --env-file /dev/null --profile redis up -d surrealdb redis
#
# A data directory a SurrealDB 3.x server wrote is refused by 4.0 until it is
# converted, once and for good. Back it up, then start once with
# SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X=true in the shell; see
# docs/deployment/surrealdb-4-upgrade.md.

# The SurrealDB image runs as 65532:65532, and a bind-mounted host directory
# keeps its host owner, so a plain `docker compose up` on Linux could not write
# it. This one-shot hands the mount to that user before SurrealDB starts. A
# file share that cannot change owners (some desktop VMs) only warns here;
# SurrealDB itself reports a directory it cannot write.
# The one-shot that prepares the data directory also refuses an image and
# store path that would open existing data wrong (a 3.x image on surrealkv://
# or on a converted store, or 4.0 on a 3.x store without the opt-in), so the
# server never starts on them.
x-surreal-init: &surreal-init
  image: busybox:1.37
  command:
    - sh
    - -c
    - |
      # Refuse a SurrealDB image and store path that would open the data wrong.
      refuse() {
        echo "surreal-init: $$1" >&2
        echo "surreal-init: nothing was started; see docs/deployment/surrealdb-4-upgrade.md" >&2
        exit 1
      }
      # First, the pairing itself, whatever the directory holds: Sibyl runs 3.x
      # only on rocksdb:// and 4.x only on surrealkv://, at an absolute path.
      ref="$${SURREAL_IMAGE%%@*}"
      tag="$${ref##*/}"
      case "$$tag" in *:*) tag="$${tag##*:}" ;; *) tag="" ;; esac
      tag="$${tag#v}"
      major="$${tag%%.*}"
      case "$$major" in "" | *[!0-9]*) refuse "the image $$SURREAL_IMAGE names no version; pin a tag such as v4.0.0" ;; esac
      case "$$SURREAL_STORE" in
        rocksdb:///*) scheme=rocksdb ;;
        surrealkv:///*) scheme=surrealkv ;;
        *) refuse "the store path $$SURREAL_STORE is not an absolute rocksdb:// or surrealkv:// path" ;;
      esac
      store="$${SURREAL_STORE#*://}"
      if [ "$$major" -lt 4 ] && [ "$$scheme" != rocksdb ]; then
        refuse "a $$major.x server runs only on a rocksdb:// path; on $$SURREAL_STORE it serves an empty database beside the data"
      fi
      if [ "$$major" -ge 4 ] && [ "$$scheme" != surrealkv ]; then
        refuse "a $$major.x server runs on a surrealkv:// path, not $$SURREAL_STORE"
      fi
      # Then what the directory holds.
      readable() { (cd "$$1" && ls . > /dev/null) 2> /dev/null; }
      if ! readable "$${store%/*}/"; then
        refuse "cannot read $${store%/*}/ to check which store it holds"
      fi
      if [ -e "$$store" ] && ! readable "$$store"; then
        refuse "cannot read $$store to check which store it holds"
      fi
      if [ "$$major" -lt 4 ] && { [ -e "$$store/manifest" ] || [ -e "$$store/_rocksdb_backup" ]; }; then
        refuse "$$store holds a store SurrealDB 4 wrote, which a 3.x server opens as an empty database"
      fi
      if [ -e "$$store/_rocksdb_backup" ] && [ ! -e "$$store/manifest" ]; then
        refuse "$$store holds only the 3.x copy a conversion keeps in _rocksdb_backup/, so any server would start an empty database beside it; restore or remove it first"
      fi
      if [ "$$major" -ge 4 ] && [ -e "$$store/CURRENT" ] && [ "$${SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X:-}" != true ]; then
        refuse "$$store holds a store a SurrealDB 3.x server wrote; 4.0 converts it once and for good: back it up, then start once with SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X=true"
      fi
      chown -R 65532:65532 /data || echo "surreal-init could not hand /data to 65532:65532" >&2
  network_mode: none
  restart: "no"

services:
  surreal-init:
    <<: *surreal-init
    environment:
      SURREAL_IMAGE: ${SIBYL_SURREAL_IMAGE:-surrealdb/surrealdb:v4.0.0}
      SURREAL_STORE: ${SIBYL_SURREAL_PATH:-surrealkv:///data/sibyl.db}
      SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X: ${SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X:-}
    volumes:
      - "${SURREAL_DATA_DIR:-./.moon/cache/surreal-dev}:/data"

  surrealdb:
    # A 3.x image needs SIBYL_SURREAL_PATH=rocksdb:///data/sibyl.db with it:
    # a 3.x server opened with surrealkv:// serves an empty database.
    image: ${SIBYL_SURREAL_IMAGE:-surrealdb/surrealdb:v4.0.0}
    container_name: ${COMPOSE_PROJECT_NAME:-sibyl}-surrealdb
    depends_on:
      surreal-init:
        condition: service_completed_successfully
    command:
      [
        "start",
        "--log",
        "${SIBYL_SURREAL_LOG_LEVEL:-info}",
        "--user",
        "${SIBYL_SURREAL_USERNAME:-root}",
        "--pass",
        "${SIBYL_SURREAL_PASSWORD:-root}",
        "${SIBYL_SURREAL_PATH:-surrealkv:///data/sibyl.db}",
      ]
    ports:
      - "${SIBYL_SURREAL_PORT:-8000}:8000"
    volumes:
      # `:U` is a podman extension that chowns the bind mount to the container UID
      # on first start (no-op under Docker Engine). Fixes rootless podman perm denied.
      - "${SURREAL_DATA_DIR:-./.moon/cache/surreal-dev}:/data:U"
    environment:
      - SURREAL_SURREALKV_BLOCK_CACHE_CAPACITY
      - SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X
      # Off from a directory's first 4.0 start: value-log files are never reclaimed.
      - SURREAL_SURREALKV_ENABLE_VLOG=false
    restart: unless-stopped

  surreal-eval-init:
    <<: *surreal-init
    profiles: ["eval"]
    environment:
      SURREAL_IMAGE: surrealdb/surrealdb:v4.0.0
      SURREAL_STORE: surrealkv:///data/sibyl.db
    volumes:
      - "${SIBYL_RELEASE_ROOT:-./.moon/cache/surreal-eval}/surreal:/data"

  surrealdb-eval:
    image: surrealdb/surrealdb:v4.0.0
    container_name: ${COMPOSE_PROJECT_NAME:-sibyl}-surrealdb-eval
    profiles: ["eval"]
    depends_on:
      surreal-eval-init:
        condition: service_completed_successfully
    command: ["start", "--log", "info", "surrealkv:///data/sibyl.db"]
    environment:
      SURREAL_BIND: 0.0.0.0:8000
      SURREAL_USER: root
      SURREAL_PASS: root
      # The bounded runtime: an 8 GiB block cache and a 512 MiB memtable, the
      # same envelope the RocksDB cache and write buffers held on 3.x.
      SURREAL_SURREALKV_BLOCK_CACHE_CAPACITY: "8589934592"
      SURREAL_SURREALKV_MAX_MEMTABLE_SIZE: "536870912"
      # Off from a directory's first 4.0 start: value-log files are never reclaimed.
      SURREAL_SURREALKV_ENABLE_VLOG: "false"
    ports:
      - "127.0.0.1:8018:8000"
    volumes:
      - "${SIBYL_RELEASE_ROOT:-./.moon/cache/surreal-eval}/surreal:/data:U"
    restart: unless-stopped

  redis:
    image: valkey/valkey:8-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-sibyl}-redis
    profiles: ["redis"]
    ports:
      - "${SIBYL_REDIS_PORT:-6381}:6379"
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
