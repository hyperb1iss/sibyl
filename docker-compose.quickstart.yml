# ============================================================================
# Sibyl Quickstart — Zero-Config for Individual Developers
# ============================================================================
#
# Get running in 5 minutes with pre-built Docker images. No .env file required.
#
# Quick Start:
#   docker compose --env-file /dev/null -f docker-compose.quickstart.yml up -d
#   Open http://localhost:3337
#   Complete onboarding (API keys entered via UI)
#
# All configuration happens through the web UI:
#   - API keys saved to encrypted database storage
#   - JWT secret auto-generated if not set
#   - Default passwords suitable for local development only
#
# SurrealDB is the only data store: graph, content, and auth in one instance.
#
# Optional environment variables for advanced setup:
#   SIBYL_OPENAI_API_KEY      — Pre-configure via env (or enter in UI)
#   SIBYL_ANTHROPIC_API_KEY   — Pre-configure via env (or enter in UI)
#   SIBYL_SETTINGS_KEY        — Fernet key for settings encryption (unset, secrets-init
#                               writes one to the shared sibyl_secrets volume)
#   SIBYL_SURREAL_PASSWORD    — SurrealDB root password (default: sibyl_quickstart)
#   SIBYL_COORDINATION_BACKEND — Set to redis together with --profile redis to run jobs on
#                               the separate worker; api and worker then share the redis
#                               service for jobs, locks, events and rate limits:
#     SIBYL_COORDINATION_BACKEND=redis docker compose --env-file /dev/null \
#       -f docker-compose.quickstart.yml --profile redis up -d
#                               Use local or redis here, not auto: the Redis address is
#                               always set, so auto would resolve to redis. A worker
#                               started without redis coordination exits with an error
#                               rather than idling while the api runs every job.
#
# Running alongside an existing dev setup:
#   docker compose --env-file /dev/null \
#     -f docker-compose.quickstart.yml \
#     -f docker-compose.quickstart.test.yml up -d
#
# ============================================================================

services:
  # ==========================================================================
  # Sibyl Backend (API + MCP Server)
  # ==========================================================================
  api:
    image: ghcr.io/hyperb1iss/sibyl-api:${SIBYL_IMAGE_TAG:-1.4.13}
    container_name: sibyl-api
    ports:
      - "${SIBYL_SERVER_PORT:-3334}:3334"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      surrealdb:
        condition: service_healthy
      redis:
        condition: service_started
        required: false
    environment:
      # Store configuration — fully Surreal by default
      SIBYL_STORE: ${SIBYL_STORE:-surreal}
      SIBYL_AUTH_STORE: ${SIBYL_AUTH_STORE:-surreal}
      # local runs jobs in-process; redis (with --profile redis) hands them to the
      # worker. The Redis address is read only under redis coordination, which is
      # why the default is local rather than auto: auto would see it and pick redis.
      SIBYL_COORDINATION_BACKEND: ${SIBYL_COORDINATION_BACKEND:-local}
      SIBYL_REDIS_HOST: ${SIBYL_REDIS_HOST:-redis}
      SIBYL_REDIS_PORT: 6379
      # SurrealDB connection (internal Docker network)
      SIBYL_SURREAL_URL: ws://surrealdb:8000/rpc
      SIBYL_SURREAL_USERNAME: ${SIBYL_SURREAL_USERNAME:-root}
      SIBYL_SURREAL_PASSWORD: ${SIBYL_SURREAL_PASSWORD:-sibyl_quickstart}
      # Unset, the api and worker read the key secrets-init wrote to sibyl_secrets.
      SIBYL_SETTINGS_KEY: ${SIBYL_SETTINGS_KEY:-}
      SIBYL_PUBLIC_URL: http://localhost:${SIBYL_WEB_PORT:-3337}
      # AI Providers (optional — can be configured via UI during onboarding)
      SIBYL_OPENAI_API_KEY: ${SIBYL_OPENAI_API_KEY:-}
      SIBYL_ANTHROPIC_API_KEY: ${SIBYL_ANTHROPIC_API_KEY:-}
      SIBYL_LLM_PROVIDER: anthropic
      SIBYL_LLM_MODEL: claude-haiku-5-5
      # Server config
      SIBYL_SERVER_HOST: 0.0.0.0
      SIBYL_SERVER_PORT: 3334
      SIBYL_ENVIRONMENT: development
    volumes:
      - sibyl_secrets:/home/sibyl/.sibyl
    healthcheck:
      # Readiness, not liveness: /api/health is always 200 once the process is up, so it
      # cannot see a failed schema bootstrap. /api/health/ready returns 503 for that, and
      # raise_for_status turns the 503 into a non-zero exit the healthcheck acts on.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:3334/api/health/ready').raise_for_status()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # The first start on a store moved to SurrealDB 4 rebuilds the auth and
      # content indexes before it serves, about 60 s per GB: 10m covers 10 GB.
      start_period: 10m
    restart: unless-stopped

  # ==========================================================================
  # Background Worker (Redis/Valkey profile only)
  # ==========================================================================
  worker:
    profiles: ["redis"]
    image: ghcr.io/hyperb1iss/sibyl-api:${SIBYL_IMAGE_TAG:-1.4.13}
    container_name: sibyl-worker
    command: ["sibyld", "worker", "--require-redis"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SIBYL_STORE: ${SIBYL_STORE:-surreal}
      SIBYL_AUTH_STORE: ${SIBYL_AUTH_STORE:-surreal}
      # Same variable and default as the api, so the two cannot disagree; left
      # unset with --profile redis, this worker refuses to start.
      SIBYL_COORDINATION_BACKEND: ${SIBYL_COORDINATION_BACKEND:-local}
      SIBYL_REDIS_HOST: ${SIBYL_REDIS_HOST:-redis}
      SIBYL_REDIS_PORT: 6379
      SIBYL_SURREAL_URL: ws://surrealdb:8000/rpc
      SIBYL_SURREAL_USERNAME: ${SIBYL_SURREAL_USERNAME:-root}
      SIBYL_SURREAL_PASSWORD: ${SIBYL_SURREAL_PASSWORD:-sibyl_quickstart}
      SIBYL_SETTINGS_KEY: ${SIBYL_SETTINGS_KEY:-}
      SIBYL_OPENAI_API_KEY: ${SIBYL_OPENAI_API_KEY:-}
      SIBYL_ANTHROPIC_API_KEY: ${SIBYL_ANTHROPIC_API_KEY:-}
      SIBYL_LLM_PROVIDER: anthropic
      SIBYL_LLM_MODEL: claude-haiku-5-5
    volumes:
      - sibyl_secrets:/home/sibyl/.sibyl
    # The image's own healthcheck asks the API port, which a worker does not
    # serve; this asks Valkey whether a worker heartbeat is live.
    healthcheck:
      test: ["CMD", "sibyld", "worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # Redis/Valkey (optional distributed coordination)
  # ==========================================================================
  redis:
    profiles: ["redis"]
    image: valkey/valkey:8-alpine
    container_name: sibyl-redis
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  # ==========================================================================
  # Frontend (Next.js Web UI)
  # ==========================================================================
  web:
    image: ghcr.io/hyperb1iss/sibyl-web:${SIBYL_IMAGE_TAG:-1.4.13}
    container_name: sibyl-web
    ports:
      - "${SIBYL_WEB_PORT:-3337}:3337"
    depends_on:
      api:
        condition: service_healthy
    environment:
      SIBYL_API_URL: http://api:3334/api # Server-side (SSR) fetches
      NEXT_PUBLIC_API_URL: http://localhost:${SIBYL_SERVER_PORT:-3334} # Client-side (browser) fetches
      NODE_ENV: production
      # Next.js standalone binds 0.0.0.0 (IPv4 only) by default; :: makes
      # the server dual-stack so it answers on both ::1 and 127.0.0.1.
      HOSTNAME: "::"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3337/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==========================================================================
  # SurrealDB (graph + content + auth, unified)
  # ==========================================================================
  # The current API image runs as UID 10001 with /home/sibyl as its home.
  # Persist auto-generated keys there so JWT refresh tokens survive
  # container recreation. Override SIBYL_API_UID/GID only when pinning an
  # older image whose runtime user still used a different numeric UID.
  # The settings key is written here, once, because a process on redis
  # coordination never generates its own: the api and worker must share one.
  secrets-init:
    image: busybox:1.37
    container_name: sibyl-secrets-init
    command:
      - sh
      - -c
      - |
        set -eu
        key=/home/sibyl/.sibyl/settings.key
        if [ ! -s "$$key" ]; then
          head -c 32 /dev/urandom | base64 | tr '+/' '-_' > "$$key"
          chmod 600 "$$key"
        fi
        chown -R "${SIBYL_API_UID:-10001}:${SIBYL_API_GID:-10001}" /home/sibyl/.sibyl
    volumes:
      - sibyl_secrets:/home/sibyl/.sibyl
    restart: "no"

  # The SurrealDB image runs as UID 65532 (distroless nonroot), but a
  # fresh named volume is created root-owned, so SurrealDB cannot create
  # its store directory under /data. This one-shot fixes the volume
  # ownership before SurrealDB starts; the chown is idempotent on reruns.
  # The one-shot that prepares the data directory also refuses an image and
  # store path that would open existing data wrong, so the server never starts
  # on them: an unversioned image, a relative path, 3.x on anything but
  # rocksdb://, 4.x on anything but surrealkv://, or a store that server would
  # misread (4.0 converts a 3.x store only with the opt-in).
  surreal-init:
    image: busybox:1.37
    container_name: sibyl-surreal-init
    command:
      - sh
      - -c
      - |
        # Refuse a SurrealDB image and store path that would open the data wrong.
        refuse() {
          echo "surreal-init: $$1" >&2
          echo "surreal-init: nothing was started; see docs/deployment/surrealdb-4-upgrade.md" >&2
          exit 1
        }
        # First, the pairing itself, whatever the directory holds: Sibyl runs 3.x
        # only on rocksdb:// and 4.x only on surrealkv://, at an absolute path.
        ref="$${SURREAL_IMAGE%%@*}"
        tag="$${ref##*/}"
        case "$$tag" in *:*) tag="$${tag##*:}" ;; *) tag="" ;; esac
        tag="$${tag#v}"
        major="$${tag%%.*}"
        case "$$major" in "" | *[!0-9]*) refuse "the image $$SURREAL_IMAGE names no version; pin a tag such as v4.0.0" ;; esac
        case "$$SURREAL_STORE" in
          rocksdb:///*) scheme=rocksdb ;;
          surrealkv:///*) scheme=surrealkv ;;
          *) refuse "the store path $$SURREAL_STORE is not an absolute rocksdb:// or surrealkv:// path" ;;
        esac
        store="$${SURREAL_STORE#*://}"
        if [ "$$major" -lt 4 ] && [ "$$scheme" != rocksdb ]; then
          refuse "a $$major.x server runs only on a rocksdb:// path; on $$SURREAL_STORE it serves an empty database beside the data"
        fi
        if [ "$$major" -ge 4 ] && [ "$$scheme" != surrealkv ]; then
          refuse "a $$major.x server runs on a surrealkv:// path, not $$SURREAL_STORE"
        fi
        # Then what the directory holds.
        readable() { (cd "$$1" && ls . > /dev/null) 2> /dev/null; }
        if ! readable "$${store%/*}/"; then
          refuse "cannot read $${store%/*}/ to check which store it holds"
        fi
        if [ -e "$$store" ] && ! readable "$$store"; then
          refuse "cannot read $$store to check which store it holds"
        fi
        if [ "$$major" -lt 4 ] && { [ -e "$$store/manifest" ] || [ -e "$$store/_rocksdb_backup" ]; }; then
          refuse "$$store holds a store SurrealDB 4 wrote, which a 3.x server opens as an empty database"
        fi
        if [ -e "$$store/_rocksdb_backup" ] && [ ! -e "$$store/manifest" ]; then
          refuse "$$store holds only the 3.x copy a conversion keeps in _rocksdb_backup/, so any server would start an empty database beside it; restore or remove it first"
        fi
        if [ "$$major" -ge 4 ] && [ -e "$$store/CURRENT" ] && [ "$${SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X:-}" != true ]; then
          refuse "$$store holds a store a SurrealDB 3.x server wrote; 4.0 converts it once and for good: back it up, then start once with SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X=true"
        fi
        chown -R 65532:65532 /data
    environment:
      SURREAL_IMAGE: ${SIBYL_SURREAL_IMAGE:-surrealdb/surrealdb:v4.0.0}
      SURREAL_STORE: ${SIBYL_SURREAL_PATH:-surrealkv:///data/sibyl.db}
      SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X: ${SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X:-}
    volumes:
      - sibyl_surreal:/data
    restart: "no"

  surrealdb:
    # A 3.x image needs SIBYL_SURREAL_PATH=rocksdb:///data/sibyl.db with it:
    # a 3.x server opened with surrealkv:// serves an empty database.
    image: ${SIBYL_SURREAL_IMAGE:-surrealdb/surrealdb:v4.0.0}
    container_name: sibyl-surrealdb
    depends_on:
      surreal-init:
        condition: service_completed_successfully
    command:
      [
        "start",
        "--log",
        "info",
        "--user",
        "${SIBYL_SURREAL_USERNAME:-root}",
        "--pass",
        "${SIBYL_SURREAL_PASSWORD:-sibyl_quickstart}",
        "${SIBYL_SURREAL_PATH:-surrealkv:///data/sibyl.db}",
      ]
    ports:
      - "${SIBYL_SURREAL_PORT:-8000}:8000"
    volumes:
      - sibyl_surreal:/data
    environment:
      # Set to true for the one start that converts a 3.x store; see
      # docs/deployment/surrealdb-4-upgrade.md.
      - SURREAL_EXPERIMENTAL_UPGRADE_FROM_3X
      # Off from a directory's first 4.0 start: value-log files are never reclaimed.
      - SURREAL_SURREALKV_ENABLE_VLOG=false
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "ws://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 5
      # Nothing listens while 4.0 converts a 3.x store in place. Allow 30 s per
      # GB of the RocksDB store: 10m covers 20 GB.
      start_period: 10m
    restart: unless-stopped

volumes:
  sibyl_secrets:
    name: sibyl_secrets
  sibyl_surreal:
    name: sibyl_surreal

networks:
  default:
    name: sibyl
